<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة طلب الحساب</title><link rel="stylesheet" href="student-account.css"></head><body><main class="accountPage"><a href="student.html">← العودة للدخول</a><h1>متابعة طلب إنشاء الحساب</h1><form id="form" class="accountCard"><div class="accountField"><label>رقم الطلب</label><input name="reference" required autocomplete="off"></div><div class="accountField"><label>رمز المتابعة</label><textarea name="status_token" required autocomplete="off"></textarea></div><div id="message" class="hidden"></div><button class="accountBtn">عرض الحالة</button></form></main><script type="module">import{identity,$,message}from'./student-identity-api.js';$('form').onsubmit=async e=>{e.preventDefault();try{const b=Object.fromEntries(new FormData(e.currentTarget));const d=await identity('registration_status',b);message(d.status?`${d.message} الحالة: ${d.status}`:d.message,true)}catch(x){message(x.message)}};</script></body></html>
