<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحليل واجب المحاضرة الأولى</title><style>
:root{font-family:Arial,"Noto Sans Arabic",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:20px 14px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#5b21b6;text-decoration:none;font-weight:900}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:17px;padding:17px;margin-top:14px;box-shadow:0 5px 18px #1018280a}.filters,.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button{font:inherit;border:1px solid #d0d5dd;border-radius:10px;padding:10px;background:#fff}.button{background:#6d28d9;color:#fff;border:0;font-weight:900;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:14px}.stat b{display:block;font-size:25px}table{width:100%;border-collapse:collapse}th,td{text-align:right;border-bottom:1px solid #eaecf0;padding:10px;font-size:13px}.wrap{overflow:auto}.muted{color:#667085}.hidden{display:none}.bad{color:#be123c}.good{color:#047857}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main>
<div class="top"><div><h1>تحليل واجب المحاضرة الأولى — الفصل الثاني</h1><p class="muted">الاختيار المتعدد منفصل عن التقييم الذاتي للمقالي، وغير المحلول لا يُحسب خطأ.</p></div><a href="admin-home.html">← الإدارة</a></div>
<section class="panel filters"><input id="group" placeholder="كود المجموعة — اختياري"><input id="search" placeholder="بحث باسم أو كود الطالب"><button id="refresh" class="button">تحديث</button></section>
<section id="stats" class="stats"></section><p id="notice" class="muted"></p>
<section class="panel"><div class="tabs"><button class="button" data-tab="students">الطلاب</button><button data-tab="questions">الأسئلة الشائعة</button><button data-tab="skills">المهارات</button></div><div id="table" class="wrap"></div></section>
<section id="detail" class="panel hidden"><h2 id="detailTitle">تفاصيل الطالب</h2><div id="detailTable" class="wrap"></div></section>
</main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/+esm';const sb=createClient('https://ltjdhconuiqblxfjzpzj.supabase.co','sb_publishable_-7SIdrqTmUibqpA7mXXrgg_SHz9EJRr',{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='students';
async function api(action,p={}){const{data,error}=await sb.functions.invoke('paper-homework',{body:{action,group_code:$('group').value.trim(),search:$('search').value.trim(),...p}});if(error||data?.error)throw new Error(data?.message||error?.message||'تعذر التحميل');return data}const table=(heads,rows)=>`<table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
function stat(label,value){return`<div class="stat"><span class="muted">${label}</span><b>${Number(value||0).toLocaleString('ar-EG')}</b></div>`}
async function load(){try{$('notice').textContent='جارٍ التحميل…';const overview=(await api('overview')).overview;$('stats').innerHTML=stat('مؤهلون',overview.eligible)+stat('سلّموا',overview.submitted)+stat('لم يسلّموا',overview.unsubmitted)+stat('متوسط الاختيار %',overview.average_mcq)+stat('غير محلول',overview.unanswered)+stat('أخطاء مثبتة',overview.mistake_progress?.total)+stat('تمت مراجعتها',overview.mistake_progress?.reviewed)+stat('تم إتقانها',overview.mistake_progress?.mastered);await loadTab();$('notice').textContent=`المقالي — صحيح ذاتيًا: ${overview.essay_self_review?.correct||0} · جزئي: ${overview.essay_self_review?.partial||0} · خطأ: ${overview.essay_self_review?.incorrect||0} · بانتظار المراجعة: ${overview.essay_self_review?.pending||0}`}catch(e){$('notice').textContent=e.message}}
async function loadTab(){if(tab==='students'){const rows=(await api('students')).students;$('table').innerHTML=table(['الطالب','المجموعة','الحالة','درجة MCQ','غير محلول',''],rows.map(x=>`<tr><td><b>${esc(x.full_name)}</b><div class="muted">${esc(x.student_code)}</div></td><td>${esc(x.group_code)}</td><td class="${x.submission_id?'good':'bad'}">${x.submission_id?'تم التسليم':'لم يسلّم'}</td><td>${x.submission_id?`${Number(x.mcq_score)} / ${Number(x.mcq_max_score)}`:'—'}</td><td>${x.unanswered_parts??'—'}</td><td>${x.submission_id?`<button data-user="${x.user_id}" data-name="${esc(x.full_name)}">عرض الإجابات</button>`:''}</td></tr>`));document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>detail(b.dataset.user,b.dataset.name))}else if(tab==='questions'){const rows=(await api('questions')).questions;$('table').innerHTML=table(['السؤال','المطلوب','المهارة','تسليمات','أخطاء فعلية','غير محلول'],rows.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted">مصدر ${esc(x.source_ref)}</div></td><td>${esc(x.label)}</td><td>${esc(x.skill_name)}</td><td>${x.submissions}</td><td class="bad">${x.wrong}</td><td>${x.unanswered}</td></tr>`))}else{const rows=(await api('skills')).skills;$('table').innerHTML=table(['المهارة','مجاب','خطأ فعلي','غير محلول'],rows.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.skill_ref)}</div></td><td>${x.answered}</td><td class="bad">${x.wrong}</td><td>${x.unanswered}</td></tr>`))}}
async function detail(user,name){const rows=(await api('student_detail',{user_id:user})).answers;$('detail').classList.remove('hidden');$('detailTitle').textContent=`الإجابات الأصلية — ${name}`;$('detailTable').innerHTML=table(['السؤال','المطلوب','الإجابة الأصلية','حالة MCQ','تقييم المقالي'],rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.label)}</td><td>${x.answer_state==='unanswered'?'لم أحل':esc(x.answer_json?.raw||x.answer_json?.text||'صورة مرفقة')}</td><td>${x.response_kind==='auto_mcq'?(x.answer_state==='unanswered'?'—':x.is_correct?'صحيح':'خطأ'):'—'}</td><td>${esc(x.assessment||'بانتظار الطالب')}</td></tr>`));$('detail').scrollIntoView({behavior:'smooth'})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;loadTab()});$('refresh').onclick=load;const{data:{session}}=await sb.auth.getSession();if(!session||session.user.app_metadata?.role!=='admin')location.href='admin-home.html';else load();
</script></body></html>
