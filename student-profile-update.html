<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث بيانات الطالب</title><link rel="stylesheet" href="student-account.css"></head><body><main class="accountPage"><h1>تحديث بيانات الحساب</h1><p class="accountMuted">تحديث البيانات مطلوب مرة واحدة لكل إصدار. الصف والمجموعة والاسم الأساسي لا يتغيرون من هذه الصفحة.</p><section id="current" class="accountCard"></section><form id="form" class="accountCard accountGrid"><div class="accountField"><label>رقم هاتف الطالب</label><input name="student_phone" required inputmode="tel"></div><div class="accountField"><label>رقم ولي الأمر</label><input name="guardian_phone" required inputmode="tel"></div><div class="accountField"><label>مكان الحضور</label><select name="attendance_location"><option>ناهيا</option><option>كفر حكيم</option><option>خصوصي</option><option>غير ذلك</option></select></div><div class="accountField"><label>محل السكن</label><input name="residence_area" required></div><div id="nationalField" class="accountField full"><label>الرقم القومي</label><input name="national_id" inputmode="numeric" maxlength="14" autocomplete="off"><small>لا يُحفظ في المتصفح. إذا كان مسجلًا بالفعل سيظهر آخر أربعة أرقام فقط.</small></div><div id="message" class="hidden full"></div><button class="accountBtn">حفظ واستكمال البيانات</button></form><section class="accountCard"><label><input id="changeToggle" type="checkbox"> أريد تغيير كلمة المرور</label><form id="passwordForm" class="accountGrid hidden"><div class="accountField"><label>كلمة المرور الحالية</label><input name="current_password" type="password" autocomplete="current-password"></div><div class="accountField"><label>كلمة المرور الجديدة</label><input name="new_password" type="password" autocomplete="new-password"></div><button class="accountBtn">تغيير كلمة المرور</button></form></section></main><script type="module">
import{identity,sb,$,esc,message}from'./student-identity-api.js';const{data:{session}}=await sb.auth.getSession();if(!session?.user){location.replace('student.html');throw Error('login required')}let d;try{d=await identity('me')}catch(e){message(e.message);throw e}const p=d.profile||{};$('current').innerHTML=`<b>${esc(p.full_name)}</b><p>${esc(p.student_code)} · ${esc(p.grade_level)} · ${esc(p.group_code||'بدون مجموعة')}</p><p>الرقم القومي: ${p.national_id_last4?'••••••••••'+esc(p.national_id_last4):'غير مكتمل'}</p>`;$('form').student_phone.value=p.student_phone||'';$('form').guardian_phone.value=p.guardian_phone||'';if(p.national_id_last4)$('nationalField').classList.add('hidden');$('form').onsubmit=async e=>{e.preventDefault();try{const r=await identity('complete_profile',Object.fromEntries(new FormData(e.target)));message(r.message,true);setTimeout(()=>location.href='student.html',1200)}catch(x){message(x.message)}};$('changeToggle').onchange=e=>$('passwordForm').classList.toggle('hidden',!e.target.checked);$('passwordForm').onsubmit=async e=>{e.preventDefault();try{const r=await identity('change_password',Object.fromEntries(new FormData(e.target)));message(r.message,true);e.target.reset()}catch(x){message(x.message)}};
</script></body></html>
