<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة حسابات الطلاب</title><link rel="stylesheet" href="student-account.css"><style>table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e4e7ec;text-align:right;font-size:13px}.scroll{overflow:auto}.pill{padding:4px 8px;border-radius:999px;background:#eef2ff}</style></head><body><main class="accountPage" style="max-width:1180px"><a href="admin-home.html">← لوحة الإدارة</a><h1>إدارة الحسابات وطلبات الانضمام</h1><p class="accountMuted">الرقم القومي الكامل لا يظهر. رموز التفعيل والاستعادة تظهر مرة واحدة.</p><div id="message" class="hidden"></div>
<section class="accountCard scroll"><h2>طلبات التسجيل</h2><table><thead><tr><th>الطلب</th><th>الطالب</th><th>الدراسة</th><th>التواصل</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"></tbody></table></section>
<section class="accountCard scroll"><h2>طلبات الاستعادة</h2><table><thead><tr><th>الطلب</th><th>التطابق</th><th>التواصل</th><th>الحالة</th><th></th></tr></thead><tbody id="recoveryRows"></tbody></table></section>
<section id="decision" class="accountCard hidden"><h2>قرار التسجيل</h2><form id="decisionForm" class="accountGrid"><input name="reference" type="hidden"><div class="accountField"><label>القرار</label><select name="decision"><option value="approved">موافقة</option><option value="needs_information">طلب استكمال</option><option value="rejected">رفض</option></select></div><div class="accountField"><label>المجموعة</label><input name="group_code" placeholder="N3-A"></div><div class="accountField full"><label>السبب</label><textarea name="reason" required></textarea></div><button class="accountBtn">حفظ</button></form></section>
<section id="recoveryDecision" class="accountCard hidden"><h2>قرار استعادة الحساب</h2><form id="recoveryForm" class="accountGrid"><input name="reference" type="hidden"><div class="accountField"><label>القرار</label><select name="decision"><option value="approved">موافقة وإصدار رمز</option><option value="rejected">رفض</option></select></div><div class="accountField full"><label>السبب</label><textarea name="reason" required></textarea></div><button class="accountBtn">حفظ قرار الاستعادة</button></form></section>
<section id="secret" class="accountCard sensitiveNotice hidden"><b id="secretTitle"></b><textarea id="secretValue" readonly></textarea></section></main><script type="module">
import{identity,sb,$,esc,message}from'./student-identity-api.js';const{data:{session}}=await sb.auth.getSession();if(!session?.user||session.user.app_metadata?.role!=='admin'){location.replace('admin-home.html');throw Error('admin required')}function secret(t,v){$('secret').classList.remove('hidden');$('secretTitle').textContent=t;$('secretValue').value=v}async function load(){try{const d=await identity('admin_list');$('rows').innerHTML=d.requests.map(r=>`<tr><td>${esc(r.public_ref)}</td><td><b>${esc(r.full_name)}</b><br>قومي: ••••${esc(r.national_id_last4||'استثناء')}</td><td>${esc(r.grade_level)} · ${esc(r.education_system)}</td><td>${esc(r.student_phone_e164)}</td><td><span class="pill">${esc(r.status)}</span></td><td><button class="accountBtn secondary" data-ref="${esc(r.public_ref)}">قرار</button></td></tr>`).join('');document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{$('decision').classList.remove('hidden');$('decisionForm').reference.value=b.dataset.ref});$('recoveryRows').innerHTML=d.recovery_requests.map(r=>`<tr><td>${esc(r.public_ref)}</td><td>${r.account_matched?'مطابق داخليًا':'غير مطابق'}</td><td>${esc(r.contact_phone_e164||'—')}</td><td>${esc(r.status)}</td><td>${r.status==='pending'?`<button class="accountBtn secondary" data-recovery="${esc(r.public_ref)}">قرار</button>`:''}</td></tr>`).join('');document.querySelectorAll('[data-recovery]').forEach(b=>b.onclick=()=>{$('recoveryDecision').classList.remove('hidden');$('recoveryForm').reference.value=b.dataset.recovery})}catch(e){message(e.message)}}
$('decisionForm').onsubmit=async e=>{e.preventDefault();try{const d=await identity('admin_decide',Object.fromEntries(new FormData(e.target)));message('تم حفظ القرار.',true);if(d.activation_token)secret(`الكود ${d.student_code} — رمز تفعيل 72 ساعة`,d.activation_token);await load()}catch(x){message(x.message)}};$('recoveryForm').onsubmit=async e=>{e.preventDefault();try{const d=await identity('admin_recovery_decide',Object.fromEntries(new FormData(e.target)));message('تم حفظ قرار الاستعادة.',true);if(d.reset_token)secret('رمز استعادة صالح لساعتين',d.reset_token);await load()}catch(x){message(x.message)}};load();
</script></body></html>
