name: Fix essay review pending fetch once
on:
  push:
    paths:
      - '.github/workflows/fix-essay-review-fetch-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reviews-admin.html')
          s=p.read_text(encoding='utf-8')
          old="async function load(){const {data,error}=await sb.from('admin_short_text_reviews').select('*').order('submitted_at',{ascending:true,nullsFirst:false}).limit(500);if(error)throw error;all=data||[];renderStats();renderRows()}"
          new="async function load(){const [pendingRes,reviewedRes]=await Promise.all([sb.from('admin_short_text_reviews').select('*').eq('grading_status','review').order('submitted_at',{ascending:true,nullsFirst:false}).limit(1000),sb.from('admin_short_text_reviews').select('*').in('grading_status',['correct','incorrect','partial']).order('submitted_at',{ascending:false,nullsFirst:false}).limit(500)]);if(pendingRes.error)throw pendingRes.error;if(reviewedRes.error)throw reviewedRes.error;all=[...(pendingRes.data||[]),...(reviewedRes.data||[])];renderStats();renderRows()}"
          if old not in s:
              raise SystemExit('target loader not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate fix
        run: |
          grep -q "eq('grading_status','review')" reviews-admin.html
          grep -q "in('grading_status',\['correct','incorrect','partial'\])" reviews-admin.html
          if grep -q "order('submitted_at',{ascending:true,nullsFirst:false}).limit(500)" reviews-admin.html; then exit 1; fi
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reviews-admin.html
          git commit -m 'Fix pending essay reviews disappearing after 500 rows'
          git push
