name: Add teacher lesson references

on:
  push:
    paths:
      - '.github/workflows/add-teacher-references.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install teacher references
        run: python3 scripts/add_teacher_references.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-home.html teacher-references.html teacher-reference-lesson1.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add teacher lesson references"
            git push
          fi
# retry with chunked source
