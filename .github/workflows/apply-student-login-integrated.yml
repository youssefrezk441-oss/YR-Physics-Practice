name: Apply integrated student login

on:
  push:
    paths:
      - '.github/workflows/apply-student-login-integrated.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          wf=Path('.github/workflows/redesign-student-login-integrated.yml').read_text(encoding='utf-8')
          m=re.search(r'LOGIN_CSS_B64:\s*([^\s]+)',wf)
          if not m: raise SystemExit('CSS payload missing')
          css=base64.b64decode(m.group(1)).decode('utf-8')
          marker='/* Student login redesign */'
          if marker not in s: raise SystemExit('login CSS marker missing')
          a=s.index(marker); b=s.index('</style>',a)
          s=s[:a]+css+'\n'+s[b:]
          html_b64=''
          html=base64.b64decode(html_b64).decode('utf-8')
          pat=r'<section id="loginView" class="loginShell">.*?</section>(?=\s*<section id="dashboardView")'
          s,n=re.subn(pat,html,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'login HTML replacement count={n}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git commit -m "Apply integrated fixed-dark student login"
          git push
