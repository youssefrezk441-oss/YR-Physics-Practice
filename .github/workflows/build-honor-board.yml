name: Build YR honor board
on:
  push:
    paths:
      - '.github/workflows/build-honor-board.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build honor board UI
        run: python .github/scripts/patch_honor_board.py
      - name: Validate honor board markers
        run: |
          grep -q 'YR Honors Arena' student.html
          grep -q 'id="honorView"' student.html
          grep -q "student-honor-board" student.html
          grep -q "openHonorView" student.html
          grep -q "data-honor-grade" student.html
      - name: Commit patched student page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate YR smart honor board'
          git push
