name: Fix B2 lesson 1 workshop access check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-b2-workshop-access-check.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch workshop visibility to use protected backend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          old="""    \"renderProfileMeta();const b2Lesson1WorkshopButton=$('openB2Lesson1Workshop');if(b2Lesson1WorkshopButton)b2Lesson1WorkshopButton.classList.toggle('hidden',!['N2-A','K2-A'].includes(String(profile?.group_code||'')));const lecture3WorkshopButton=$('openLecture3Workshop');if(lecture3WorkshopButton)lecture3WorkshopButton.classList.toggle('hidden',gradeLabel(profile?.grade_level)!=='الصف الثالث الثانوي');const chapterJourneyButton=$('openChapterJourney');\""""
          new="""    \"renderProfileMeta();const b2Lesson1WorkshopButton=$('openB2Lesson1Workshop');if(b2Lesson1WorkshopButton){b2Lesson1WorkshopButton.classList.add('hidden');sb.functions.invoke('b2-lesson1-workshop',{body:{action:'ping'}}).then(({data,error})=>{b2Lesson1WorkshopButton.classList.toggle('hidden',!!error||!data?.ok)}).catch(()=>b2Lesson1WorkshopButton.classList.add('hidden'));}const lecture3WorkshopButton=$('openLecture3Workshop');if(lecture3WorkshopButton)lecture3WorkshopButton.classList.toggle('hidden',gradeLabel(profile?.grade_level)!=='الصف الثالث الثانوي');const chapterJourneyButton=$('openChapterJourney');\""""
          if old not in s:
              raise SystemExit('B2 visibility target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "YR Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.html
          git diff --cached --quiet && exit 0
          git commit -m "Use protected B2 workshop access check"
          git push
