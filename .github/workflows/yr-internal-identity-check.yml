name: Validate YR internal identity
on:
  push:
    branches: ["design/yr-internal-identity-phase1-20261030"]
  pull_request:
    paths:
      - "student-base.html"
      - "student-internal-identity-v1.css"
      - "tools/tests/yr-internal-identity.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal-identity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preserve exact student application contracts
        run: node --test tools/tests/yr-internal-identity.test.mjs
      - name: Ensure Pages compiles the actual redesigned dashboard
        run: |
          node tools/build_pages_artifact.mjs _site_identity
          grep -q 'student-internal-identity-v1.css' _site_identity/student.html
          grep -q 'yrDashboardHero' _site_identity/student.html
          grep -q 'yrInternalTop' _site_identity/student.html
          test -s _site_identity/student-internal-identity-v1.css
