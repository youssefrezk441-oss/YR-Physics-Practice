name: Add admin honor board navigation
on:
  push:
    paths:
      - '.github/workflows/add-admin-honor-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add honor board card to admin home
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-home.html')
          s=p.read_text(encoding='utf-8')
          marker='<a id="managersCard" class="dashCard hidden" href="managers-admin.html">'
          if 'id="honorCard"' not in s:
              card='''<a id="honorCard" class="dashCard hidden" href="admin-honor.html"><div class="iconBox gold"><svg viewBox="0 0 24 24"><path d="M8 4h8v3a4 4 0 0 1-8 0z"/><path d="M9 19h6M12 11v8M8 5H4v1a4 4 0 0 0 4 4M16 5h4v1a4 4 0 0 1-4 4"/><path d="M9 22h6"/></svg></div><div><h3>لوحة الشرف</h3><p>متابعة ترتيب تانية وتالتة ثانوي، منصة التتويج، Top 10 وأبطال الفئات والمجموعات.</p></div><span class="arrow">‹</span></a>\n'''
              if marker not in s: raise SystemExit('manager card marker not found')
              s=s.replace(marker,card+marker,1)
          old="const content=['questions','trainings','structure','question_assets','essay_reviews'].some(s=>canView(ctx,s)),follow=['students','class_sessions'].some(s=>canView(ctx,s));$('contentCard').classList.toggle('hidden',!content);$('followCard').classList.toggle('hidden',!follow);$('managersCard').classList.toggle('hidden',!ctx.isOwner);$('empty').classList.toggle('hidden',content||follow||ctx.isOwner)"
          new="const content=['questions','trainings','structure','question_assets','essay_reviews'].some(s=>canView(ctx,s)),follow=['students','class_sessions'].some(s=>canView(ctx,s)),honor=ctx.isOwner||(canView(ctx,'students')&&canView(ctx,'class_sessions'));$('contentCard').classList.toggle('hidden',!content);$('followCard').classList.toggle('hidden',!follow);$('honorCard').classList.toggle('hidden',!honor);$('managersCard').classList.toggle('hidden',!ctx.isOwner);$('empty').classList.toggle('hidden',content||follow||honor||ctx.isOwner)"
          if old not in s:
              if "$('honorCard').classList.toggle" not in s: raise SystemExit('admin open logic marker not found')
          else:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate admin honor navigation
        run: |
          grep -q 'id="honorCard"' admin-home.html
          grep -q 'href="admin-honor.html"' admin-home.html
          grep -q "canView(ctx,'students')&&canView(ctx,'class_sessions')" admin-home.html
      - name: Commit navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-home.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expose honor board from admin dashboard'
          git push
