name: Fix assessment mobile CSS
on:
  push:
    paths:
      - '.github/triggers/fix-assessment-mobile-css.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing media brace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          old='@media(max-width:760px){.assessmentGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.assessmentSplit{grid-template-columns:1fr}\n</style>'
          new='@media(max-width:760px){.assessmentGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.assessmentSplit{grid-template-columns:1fr}}\n</style>'
          if old not in s:
              raise SystemExit('assessment CSS target missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        run: grep -Fq '.assessmentSplit{grid-template-columns:1fr}}' student.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html
          git commit -m 'Fix assessment mobile CSS closure'
          git push
