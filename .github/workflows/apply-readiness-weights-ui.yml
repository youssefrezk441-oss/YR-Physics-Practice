name: Apply readiness score UI
on:
  push:
    paths:
      - '.github/triggers/readiness-weights-ui.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply readiness UI patch
        run: python .github/scripts/apply_readiness_weights_ui.py
      - name: Validate markers
        run: |
          grep -q "assessmentReadinessCalc" student.html
          grep -q "adminReadiness" assessment-admin.html
          grep -q "40% كويزات" assessment-admin.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html assessment-admin.html
          git diff --cached --quiet || git commit -m "Apply 40-30-20-10 readiness scoring"
          git push
