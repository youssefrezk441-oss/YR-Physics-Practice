name: Rebuild student login hero

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild and verify hero image
        shell: bash
        run: |
          cat assets/hero-chunk-1.txt assets/hero-chunk-2.txt assets/hero-chunk-3.txt assets/hero-chunk-4.txt assets/hero-chunk-5.txt assets/hero-chunk-6.txt assets/hero-chunk-7.txt > /tmp/student-login-hero.b64
          base64 -d /tmp/student-login-hero.b64 > assets/student-login-hero.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/student-login-hero.webp')
          b = p.read_bytes()
          assert len(b) == 24428, f'unexpected image size: {len(b)}'
          assert b[:4] == b'RIFF', b[:12]
          assert b[8:12] == b'WEBP', b[:12]
          print('Verified WEBP:', len(b), 'bytes')
          PY

      - name: Commit fixed image and clean temporary files
        shell: bash
        run: |
          rm -f assets/hero-chunk-1.txt assets/hero-chunk-2.txt assets/hero-chunk-3.txt assets/hero-chunk-4.txt assets/hero-chunk-5.txt assets/hero-chunk-6.txt assets/hero-chunk-7.txt assets/student-login-hero.b64
          rm -f .github/workflows/rebuild-student-login-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix student login hero image"
          git push
