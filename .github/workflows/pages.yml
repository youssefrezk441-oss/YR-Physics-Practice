      - name: Validate student module syntax
        run: |
          python - <<'PY'
          import re
          s=open('student.html',encoding='utf-8').read()
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('no student module script found')
          open('/tmp/student-module.mjs','w',encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/student-module.mjs
