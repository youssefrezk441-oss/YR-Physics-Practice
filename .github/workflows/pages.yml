name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source pages
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              'student.html',
              'reviews-admin.html',
              'sessions-admin.html',
              'content-admin.html',
              'index.html',
          ]
          found = []
          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'missing required page: {filename}')
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
              for i, block in enumerate(blocks):
                  out = Path('/tmp') / f'{path.stem}-{i}.mjs'
                  out.write_text(block, encoding='utf-8')
                  found.append(str(out))
          print('\n'.join(found))
          PY
          for f in /tmp/student-*.mjs /tmp/reviews-admin-*.mjs /tmp/sessions-admin-*.mjs /tmp/content-admin-*.mjs /tmp/index-*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

      - name: Inject B2 workshop responsive stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('b2-lesson1-workshop.html')
          css=Path('b2-workshop-mobile.css')
          if not page.exists():
              raise SystemExit('missing b2-lesson1-workshop.html')
          if not css.exists():
              raise SystemExit('missing b2-workshop-mobile.css')
          text=page.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="./b2-workshop-mobile.css?v=20260911-1">'
          if link not in text:
              if '</head>' not in text:
                  raise SystemExit('missing </head> in workshop page')
              text=text.replace('</head>',link+'\n</head>',1)
              page.write_text(text,encoding='utf-8')
          print('B2 responsive stylesheet linked for deployment')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
