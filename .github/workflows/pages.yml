name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source pages
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              'student.html',
              'reviews-admin.html',
              'sessions-admin.html',
              'content-admin.html',
              'index.html',
          ]
          found = []
          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'missing required page: {filename}')
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
              for i, block in enumerate(blocks):
                  out = Path('/tmp') / f'{path.stem}-{i}.mjs'
                  out.write_text(block, encoding='utf-8')
                  found.append(str(out))
          print('\n'.join(found))
          PY
          for f in /tmp/student-*.mjs /tmp/reviews-admin-*.mjs /tmp/sessions-admin-*.mjs /tmp/content-admin-*.mjs /tmp/index-*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

      - name: Prepare B2 workshop for deployment
        run: |
          python - <<'PY'
          from pathlib import Path

          page=Path('b2-lesson1-workshop.html')
          css=Path('b2-workshop-mobile.css')
          if not page.exists():
              raise SystemExit('missing b2-lesson1-workshop.html')
          if not css.exists():
              raise SystemExit('missing b2-workshop-mobile.css')

          text=page.read_text(encoding='utf-8')

          # Mobile responsive stylesheet
          link='<link rel="stylesheet" href="./b2-workshop-mobile.css?v=20260911-2">'
          if 'b2-workshop-mobile.css' not in text:
              if '</head>' not in text:
                  raise SystemExit('missing </head> in workshop page')
              text=text.replace('</head>',link+'\n</head>',1)
          else:
              import re
              text=re.sub(r'<link rel="stylesheet" href="\./b2-workshop-mobile\.css\?v=[^"]+">',link,text,count=1)

          # Student-facing wording only — remove internal editorial/source note.
          old='ورشة واحدة تحتوي على قسم الحصة والتدريب المنزلي. الأسئلة من المصدرين المعتمدين دون تأليف أو إعادة صياغة.'
          new='تدريب شامل على أفكار الدرس الأول، مع متابعة تقدمك في كل مهارة.'
          if old in text:
              text=text.replace(old,new,1)

          page.write_text(text,encoding='utf-8')

          # Cache-bust the workshop navigation link in the deployed student page.
          student=Path('student.html')
          if student.exists():
              s=student.read_text(encoding='utf-8')
              s=s.replace("./b2-lesson1-workshop.html'","./b2-lesson1-workshop.html?v=20260911-2'" )
              s=s.replace('./b2-lesson1-workshop.html"','./b2-lesson1-workshop.html?v=20260911-2"')
              student.write_text(s,encoding='utf-8')

          print('B2 workshop deployment prepared')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
