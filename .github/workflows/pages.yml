name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24 for TypeScript contract tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate source pages
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              'student.html',
              'reviews-admin.html',
              'sessions-admin.html',
              'content-admin.html',
              'index.html',
              'admin-home.html',
              'admin-l4-workshop-analytics.html',
              'admin-l5-workshop-analytics.html',
              'admin-l6-workshop-analytics.html',
          ]
          found = []
          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'missing required page: {filename}')
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
              for i, block in enumerate(blocks):
                  out = Path('/tmp') / f'{path.stem}-{i}.mjs'
                  out.write_text(block, encoding='utf-8')
                  found.append(str(out))
          print('\n'.join(found))
          PY
          for f in /tmp/student-*.mjs /tmp/reviews-admin-*.mjs /tmp/sessions-admin-*.mjs /tmp/content-admin-*.mjs /tmp/index-*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done
          for f in /tmp/admin-home-*.mjs /tmp/admin-l4-workshop-analytics-*.mjs /tmp/admin-l5-workshop-analytics-*.mjs /tmp/admin-l6-workshop-analytics-*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done
          node --check lecture4-workshop.js
          node --check lecture6-workshop.js
          node tools/check_l4_workshop_contract.mjs

      - name: Verify B2 workshops are deployment-ready
        run: |
          grep -q 'b2-workshop-mobile.css' b2-lesson1-workshop.html
          grep -q 'b2-workshop-mobile.css' b2-lesson2-workshop.html
          grep -q 'b2-lesson2-platform.js' b2-lesson2-workshop.html
          grep -q 'openB2Lesson2Workshop' student.html
          node tools/check_public_answer_keys.mjs
      - name: Validate client and data contracts
        run: |
          node tools/check_inline_scripts.mjs
          node tools/check_workshop_input_guards.mjs
          node tools/check_supabase_security_contracts.mjs
          node tools/check_submission_safety.mjs
          node tools/check_public_answer_keys.mjs
          node tools/check_l4_workshop_contract.mjs
          node tools/check_unified_workshop_content.mjs

      - name: Run synthetic security tests
        run: |
          node --test tools/tests/*.test.mjs

      - name: Build public artifact
        run: |
          node tools/build_pages_artifact.mjs _site
          test ! -e _site/azhar-comprehensive-exam.html
          test ! -e _site/chemsteroo
          test ! -e _site/supabase
          test ! -e _site/.github
          test ! -e _site/.grading
          test ! -e _site/tools
          test ! -e _site/whatsapp-bridge
          test ! -e _site/WORKSHOP_SYSTEM_ARCHITECTURE.md
          test -e _site/azhar-exam-submissions-admin.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
