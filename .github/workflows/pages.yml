name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source pages
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              'student.html',
              'reviews-admin.html',
              'sessions-admin.html',
              'content-admin.html',
              'index.html',
          ]
          found = []
          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f'missing required page: {filename}')
              text = path.read_text(encoding='utf-8')
              blocks = re.findall(r'<script type="module">(.*?)</script>', text, re.S)
              for i, block in enumerate(blocks):
                  out = Path('/tmp') / f'{path.stem}-{i}.mjs'
                  out.write_text(block, encoding='utf-8')
                  found.append(str(out))
          print('\n'.join(found))
          PY
          for f in /tmp/student-*.mjs /tmp/reviews-admin-*.mjs /tmp/sessions-admin-*.mjs /tmp/content-admin-*.mjs /tmp/index-*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
