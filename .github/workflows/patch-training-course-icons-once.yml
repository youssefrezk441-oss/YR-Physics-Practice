name: Patch training course navigation once

on:
  push:
    paths:
      - '.github/workflows/patch-training-course-icons-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch student training UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('student.html')
          s=p.read_text(encoding='utf-8')

          # 1) Replace the training menu with course-specific cards.
          new_menu='''<section id="trainingMenuView" class="hidden"><div class="studentSubHead"><div><h2>📝 التدريبات</h2><p class="sectionIntro">اختر الكورس الذي تريد التدريب عليه.</p></div><button class="btn secondary studentBack" data-go-home>العودة للرئيسية</button></div><div class="studentSubGrid"><button id="openChapterTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">⚡</div><h3>تدريبات الفصل الأول</h3><p>تدريبات كهربية الفصل الأول للصف الثالث الثانوي.</p></button><button id="openFoundationTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">🧰</div><h3>تدريبات الكورس التأسيسي</h3><p>كل تدريبات الكورس التأسيسي في مكان واحد.</p></button><button id="openCompleted" class="card studentNavCard" type="button"><div class="studentNavIcon">✅</div><h3>التدريبات المكتملة</h3><p>راجع محاولاتك السابقة ونتائجك وتصحيحها.</p></button></div></section>'''
          s,n=re.subn(r'<section id="trainingMenuView" class="hidden">.*?</section>(?=\s*<section id="indicatorsMenuView")',new_menu,s,count=1,flags=re.S)
          assert n==1, 'trainingMenuView replacement failed'

          # 2) Make the available-training heading dynamic per course.
          new_available='''<section id="availableTrainingsView" class="hidden"><div class="studentSubHead"><div><h2 id="availableTrainingsTitle">🚀 التدريبات المتاحة</h2><p id="availableTrainingsIntro" class="sectionIntro">اختر التدريب وابدأ الحل.</p></div><button id="backTrainingMenu1" class="btn secondary studentBack">العودة للتدريبات</button></div><div class="card"><div id="setsList"></div></div></section>'''
          s,n=re.subn(r'<section id="availableTrainingsView" class="hidden">.*?</section>(?=\s*<section id="completedTrainingsView")',new_available,s,count=1,flags=re.S)
          assert n==1, 'availableTrainingsView replacement failed'

          # 3) Preserve the selected course while the student is inside its trainings.
          marker='let profile=null,sets=[],history=[],attemptId=null,currentSet=null,questions=[],answers={},qIndex=0,timerId=null,deadline=null;'
          assert marker in s, 'state marker not found'
          s=s.replace(marker,'let profile=null,sets=[],history=[],selectedTrainingCourse=null,attemptId=null,currentSet=null,questions=[],answers={},qIndex=0,timerId=null,deadline=null;',1)

          # 4) Surface the Arabic response body for expected Edge Function errors.
          old_fn="async function fn(body){const{data,error}=await sb.functions.invoke('student-practice',{body});if(error)throw new Error(error.message||'تعذر الاتصال');if(data?.error)throw new Error(data.message||data.error);return data}"
          new_fn="async function fn(body){const{data,error}=await sb.functions.invoke('student-practice',{body});if(error){let message=error.message||'تعذر الاتصال';try{if(error.context&&typeof error.context.json==='function'){const payload=await error.context.json();message=payload?.message||payload?.error||message}}catch{}throw new Error(message)}if(data?.error)throw new Error(data.message||data.error);return data}"
          assert old_fn in s, 'fn wrapper not found'
          s=s.replace(old_fn,new_fn,1)

          # 5) Show only the selected course's sets; backend already orders newest first.
          new_render='''function renderSets(){const visibleSets=selectedTrainingCourse?sets.filter(s=>String(s.course_slug||'')===String(selectedTrainingCourse)):sets;if(!visibleSets.length){$('setsList').innerHTML='<div class="empty">لا توجد تدريبات نشطة في هذا الكورس حاليًا.</div>';return}$('setsList').innerHTML=visibleSets.map(s=>{const remain=s.remaining_attempts==null?'غير محدود':s.remaining_attempts,locked=!!s.is_locked,attemptsDone=s.remaining_attempts===0,disabled=locked||attemptsDone,buttonText=locked?'🔒 مقفول':attemptsDone?'انتهت المحاولات':'ابدأ التدريب',lockNote=locked?'<div class="small muted" style="margin-top:8px;line-height:1.7">🔒 '+esc(s.lock_reason||('يلزم الحصول على '+Number(s.unlock_threshold||80)+'% في التدريب السابق.'))+(s.prerequisite_best_percentage!=null?' أفضل نتيجة حالية: '+Number(s.prerequisite_best_percentage)+'%.':'')+'</div>':'';return '<div class="set"><h3>'+esc(s.title)+'</h3><div class="muted small">'+esc(s.description||'')+'</div><div class="meta"><span class="pill">'+s.question_count+' سؤال</span><span class="pill">'+Number(s.max_score||0)+' درجة</span><span class="pill">المحاولات المتبقية: '+remain+'</span>'+(s.best_percentage!=null?'<span class="pill">أفضل نتيجة: '+Number(s.best_percentage)+'%</span>':'')+(locked?'<span class="pill">الفتح عند '+Number(s.unlock_threshold||80)+'%</span>':'')+'</div>'+lockNote+'<button class="btn primary startSet" data-slug="'+esc(s.slug)+'" '+(disabled?'disabled':'')+' style="margin-top:10px">'+buttonText+'</button></div>'}).join('');document.querySelectorAll('.startSet:not(:disabled)').forEach(b=>b.onclick=()=>startSet(b.dataset.slug))}'''
          s,n=re.subn(r'function renderSets\(\)\{.*?\}\nfunction historyStatusLabel',new_render+'\nfunction historyStatusLabel',s,count=1,flags=re.S)
          assert n==1, 'renderSets replacement failed'

          # 6) Course-card navigation.
          old_click="$('openAvailable').onclick=()=>showOnly('availableTrainingsView');$('openCompleted').onclick=()=>showOnly('completedTrainingsView');$('backTrainingMenu1').onclick=()=>showOnly('trainingMenuView');$('backTrainingMenu2').onclick=()=>showOnly('trainingMenuView');"
          new_click="function openCourseTrainings(slug,title,icon){selectedTrainingCourse=slug;$('availableTrainingsTitle').textContent=(icon||'📘')+' '+title;$('availableTrainingsIntro').textContent='أحدث تدريبات الكورس تظهر أولًا.';renderSets();showOnly('availableTrainingsView')}$('openChapterTrainings').onclick=()=>openCourseTrainings('third-secondary-electricity-chapter-1','تدريبات الفصل الأول','⚡');$('openFoundationTrainings').onclick=()=>openCourseTrainings('foundation-physics','تدريبات الكورس التأسيسي','🧰');$('openCompleted').onclick=()=>showOnly('completedTrainingsView');$('backTrainingMenu1').onclick=()=>{selectedTrainingCourse=null;showOnly('trainingMenuView')};$('backTrainingMenu2').onclick=()=>showOnly('trainingMenuView');"
          assert old_click in s, 'training click bindings not found'
          s=s.replace(old_click,new_click,1)

          p.write_text(s,encoding='utf-8')
          PY

          git config user.name "YR Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.html
          git commit -m "Separate course training icons and improve function errors"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/patch-training-course-icons-once.yml
          git commit -m "Remove one-time training course patch workflow"
          git push
