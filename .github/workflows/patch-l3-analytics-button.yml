name: Patch L3 Analytics Button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-l3-analytics-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run targeted patch
        run: python tools/patch_l3_analytics_button.py

      - name: Review targeted diff
        shell: bash
        run: |
          echo '--- git diff -- admin-home.html ---'
          git diff -- admin-home.html
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No file changed; nothing to commit.'
            exit 0
          fi
          if [ "$changed" != "admin-home.html" ]; then
            echo "ERROR: unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          grep -F 'تحليل ورشة المحاضرة الثالثة' admin-home.html >/dev/null
          grep -F './admin-l3-workshop-analytics.html' admin-home.html >/dev/null

      - name: Commit and push only target file
        shell: bash
        run: |
          if git diff --quiet -- admin-home.html; then
            echo 'No target change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-home.html
          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "admin-home.html" ]; then
            echo "ERROR: staged files are not exactly admin-home.html: $staged"
            exit 1
          fi
          git commit -m 'Add L3 workshop analytics admin button'
          git push origin HEAD:main
