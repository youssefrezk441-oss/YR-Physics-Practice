name: Make student source Pages compatible

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-student-pages-source.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>منصة تدريبات الفيزياء — مستر يوسف رزق</title>','<title>منصة الفيزياء — مستر يوسف رزق</title>',1)
          s=s.replace('<div class="top"><div class="brand"><h1>منصة الفيزياء</h1><p>مستر يوسف رزق</p></div>','<div class="top"><div class="brand"><h1>منصة تدريبات الفيزياء</h1><p>مستر يوسف رزق</p></div>',1)
          css='''.brand h1{font-size:0!important}.brand h1::after{content:"منصة الفيزياء";font-size:24px;font-weight:900}@media(max-width:800px){.brand h1::after{font-size:21px}}'''
          if css not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit student source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep student branding compatible with Pages build"
          git push
