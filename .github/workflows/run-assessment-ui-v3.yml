name: Run assessment UI v3
on:
  push:
    paths:
      - '.github/triggers/assessment-ui-v3.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: python .github/scripts/apply_assessment_cycle_ui.py
      - name: Validate
        run: |
          grep -q 'id="openAssessmentCycle"' student.html
          grep -q 'student-assessment-cycle' student.html
          grep -q 'value="precutoff"' reviews-admin.html
          grep -q 'assessment-admin.html' admin-home.html
          grep -q 'assessment-admin.html' admin-followup-menu.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('student.html').read_text(encoding='utf-8')
          Path('/tmp/student.js').write_text('\n'.join(re.findall(r'<script type="module">([\s\S]*?)</script>',s)),encoding='utf-8')
          PY
          node --check /tmp/student.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html reviews-admin.html admin-home.html admin-followup-menu.html
          git commit -m 'Add assessment cycle student and admin UI'
          git push
