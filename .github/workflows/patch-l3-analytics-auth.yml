name: Patch L3 Analytics Auth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-l3-analytics-auth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply targeted patch
        run: python tools/patch_l3_analytics_auth.py
      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- admin-l3-workshop-analytics.html
          changed="$(git diff --name-only)"
          test "$changed" = "admin-l3-workshop-analytics.html"
          grep -F '@supabase/supabase-js@2.105.0/+esm' admin-l3-workshop-analytics.html >/dev/null
          grep -F 'Authorization:`Bearer ${session.access_token}`' admin-l3-workshop-analytics.html >/dev/null
      - name: Commit and push target only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-l3-workshop-analytics.html
          test "$(git diff --cached --name-only)" = "admin-l3-workshop-analytics.html"
          git commit -m 'Fix L3 analytics admin session auth'
          git push origin HEAD:main
