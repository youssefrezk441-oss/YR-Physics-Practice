name: Finalize answer image flow

on:
  push:
    paths:
      - '.github/workflows/finalize-answer-image-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image flow
        run: python .github/scripts/finalize_answer_image_flow.py
      - name: Verify patch
        run: |
          grep -q 'answerImageUploads' student-base.html
          grep -q 'انتظر حتى يكتمل حفظ الصورة قبل تسليم التدريب' student-base.html
          grep -q 'loadStudentReviewAnswerImages' student-base.html
          grep -q 'studentReviewImageGrid' student-base.html
          grep -q 'reviews-answer-images.js' reviews-admin.html
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student-base.html reviews-admin.html
          git commit -m 'Finalize handwritten answer image flow'
          git push
