# trigger-fixed-v2
name: Update evaluation gap rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-evaluation-gap-rules.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch student evaluation comparison override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          start_marker='/* evaluation-gap-v2:start */'
          end_marker='/* evaluation-gap-v2:end */'
          if start_marker in s and end_marker in s:
              a=s.index(start_marker)
              b=s.index(end_marker,a)+len(end_marker)
              s=s[:a]+s[b:]
          override=r'''
/* evaluation-gap-v2:start */
courseCompare=function(compPct,readiness,p){
  if(compPct==null||readiness==null)return{kind:'neutral',icon:'➖',title:'المقارنة غير متاحة بعد',diff:null,reasons:['سيظهر الفرق بين الشامل والاستعداد بمجرد اكتمال البيانات.'],consult:false};
  const diff=Math.round((compPct-readiness+1e-9)*10)/10,ad=Math.abs(diff),platform=courseNum(p.platform?.score),platformWeight=.30,reasons=[];
  if(ad<=10)return{kind:'match',icon:'✅',title:'الفرق طبيعي ومتوافق مع درجة الاستعداد',diff,reasons:['فرق يصل إلى 10 نقاط مئوية أعلى أو أقل يُعتبر طبيعيًا بين مؤشر الاستعداد ونتيجة امتحان واحد.'],consult:false};
  if(diff>10){
    const platformEffect=platform==null?null:(compPct-platform)*platformWeight;
    const platformLikely=platformEffect!=null&&platformEffect>=Math.max(4,ad*.40);
    if(platformLikely){
      reasons.push('مؤشر تدريبات المنصة كان '+coursePct(platform)+' مقابل '+coursePct(compPct)+' في الشامل، وده غالبًا خفّض درجة الاستعداد عن المستوى اللي ظهر في الامتحان.');
      return{kind:'up',icon:'📈',title:'نتيجة الشامل أعلى من درجة الاستعداد بوضوح',diff,reasons,consult:false};
    }
    reasons.push('الفرق كبير، لكن مؤشر تدريبات المنصة لا يفسّره بشكل كافٍ من البيانات المسجلة.');
    reasons.push('💬 تواصل مع مستر يوسف وقوله: أنا شايف إن نتيجتي في الشامل أعلى من المتوقع بكتير، إيه أفضل حاجة شايف إنها أدت للنتيجة غير المتوقعة دي؟');
    return{kind:'up',icon:'📈',title:'نتيجة الشامل أعلى من درجة الاستعداد بوضوح',diff,reasons,consult:false};
  }
  const platformEffect=platform==null?null:(platform-compPct)*platformWeight;
  const platformLikely=platformEffect!=null&&platformEffect>=Math.max(4,ad*.40);
  if(platformLikely){
    reasons.push('مؤشر تدريبات المنصة كان '+coursePct(platform)+' مقابل '+coursePct(compPct)+' في الشامل، وده غالبًا رفع درجة الاستعداد عن المستوى اللي ظهر في الامتحان.');
    return{kind:'down',icon:'📉',title:'نتيجة الشامل أقل من درجة الاستعداد بوضوح',diff,reasons,consult:false};
  }
  reasons.push('الفرق كبير، لكن مؤشر تدريبات المنصة لا يفسّره بشكل كافٍ من البيانات المسجلة.');
  reasons.push('⚠️ تواصل مع مستر يوسف ضروري وقوله: أنا شايف إن نتيجتي في الشامل أقل من المتوقع بكتير، إيه أكتر مشكلة ممكن تكون قابلتني وأدت للنتيجة غير المتوقعة دي؟');
  return{kind:'down',icon:'📉',title:'نتيجة الشامل أقل من درجة الاستعداد بوضوح',diff,reasons,consult:false};
};
/* evaluation-gap-v2:end */
'''
          marker="const{data:{session}}=await sb.auth.getSession();"
          if marker not in s:
              raise SystemExit('student init marker missing')
          s=s.replace(marker,override+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate student module
        run: |
          python - <<'PY'
          import re
          s=open('student.html',encoding='utf-8').read()
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('no module script found')
          open('/tmp/student.mjs','w',encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/student.mjs

      - name: Commit student override
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          if git diff --cached --quiet; then
            echo "No student.html changes needed"
          else
            git commit -m "Use 10 point natural range for comprehensive comparison"
            git push
          fi

      - name: Deploy GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
