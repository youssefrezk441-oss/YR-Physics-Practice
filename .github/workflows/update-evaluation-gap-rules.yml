# manual-run-ready
name: Update evaluation gap rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-evaluation-gap-rules.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch student evaluation comparison rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8')
          start=s.index('function courseCompare(compPct,readiness,p){')
          end=s.index('function courseCompareStyle(kind){',start)
          new='''function courseCompare(compPct,readiness,p){
            if(compPct==null||readiness==null)return{kind:'neutral',icon:'➖',title:'المقارنة غير متاحة بعد',diff:null,reasons:['سيظهر الفرق بين الشامل والاستعداد بمجرد اكتمال البيانات.'],consult:false,prompt:''};
            const diff=Math.round((compPct-readiness+1e-9)*10)/10,ad=Math.abs(diff),platform=courseNum(p.platform?.score),platformWeight=.30,reasons=[];
            if(ad<=10)return{kind:'match',icon:'✅',title:'الفرق طبيعي ومتوافق مع درجة الاستعداد',diff,reasons:['فرق يصل إلى 10 نقاط مئوية أعلى أو أقل يُعتبر طبيعيًا بين مؤشر الاستعداد ونتيجة امتحان واحد.'],consult:false,prompt:''};
            if(diff>10){
              const platformEffect=platform==null?null:(compPct-platform)*platformWeight;
              const platformLikely=platformEffect!=null&&platformEffect>=Math.max(4,ad*.40);
              if(platformLikely){
                reasons.push('مؤشر تدريبات المنصة كان '+coursePct(platform)+' مقابل '+coursePct(compPct)+' في الشامل، وده غالبًا خفّض درجة الاستعداد عن المستوى اللي ظهر في الامتحان.');
                return{kind:'up',icon:'📈',title:'نتيجة الشامل أعلى من درجة الاستعداد بوضوح',diff,reasons,consult:false,prompt:''};
              }
              reasons.push('الفرق كبير، لكن مؤشر تدريبات المنصة لا يفسّره بشكل كافٍ من البيانات المسجلة.');
              return{kind:'up',icon:'📈',title:'نتيجة الشامل أعلى من درجة الاستعداد بوضوح',diff,reasons,consult:true,prompt:'💬 تواصل مع مستر يوسف وقوله: أنا شايف إن نتيجتي في الشامل أعلى من المتوقع بكتير، إيه أفضل حاجة شايف إنها أدت للنتيجة غير المتوقعة دي؟'};
            }
            const platformEffect=platform==null?null:(platform-compPct)*platformWeight;
            const platformLikely=platformEffect!=null&&platformEffect>=Math.max(4,ad*.40);
            if(platformLikely){
              reasons.push('مؤشر تدريبات المنصة كان '+coursePct(platform)+' مقابل '+coursePct(compPct)+' في الشامل، وده غالبًا رفع درجة الاستعداد عن المستوى اللي ظهر في الامتحان.');
              return{kind:'down',icon:'📉',title:'نتيجة الشامل أقل من درجة الاستعداد بوضوح',diff,reasons,consult:false,prompt:''};
            }
            reasons.push('الفرق كبير، لكن مؤشر تدريبات المنصة لا يفسّره بشكل كافٍ من البيانات المسجلة.');
            return{kind:'down',icon:'📉',title:'نتيجة الشامل أقل من درجة الاستعداد بوضوح',diff,reasons,consult:true,prompt:'⚠️ تواصل مع مستر يوسف ضروري وقوله: أنا شايف إن نتيجتي في الشامل أقل من المتوقع بكتير، إيه أكتر مشكلة ممكن تكون قابلتني وأدت للنتيجة غير المتوقعة دي؟'};
          }
          '''
          new=new.replace('\n','\n          ')
          s=s[:start]+new+s[end:]
          old="${cmp.consult?'<div class=\"courseTeacherNote\">💬 لمعرفة سبب الفرق بدقة، اتكلم مع مستر يوسف؛ بيانات المنصة تساعد في تحديد مكان الخلل أو سبب التفوق، لكنها لا تسجل كل ظروف يوم الامتحان.</div>':''}"
          newmsg="${cmp.consult?'<div class=\"courseTeacherNote\">'+esc(cmp.prompt||'')+'</div>':''}"
          if old not in s: raise SystemExit('teacher note target missing')
          s=s.replace(old,newmsg,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit comparison rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml
          if git diff --cached --quiet; then
            echo "No pages.yml changes needed"
          else
            git commit -m "Use 10 point natural range for comprehensive comparison"
            git push
          fi
      - name: Deploy updated Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
