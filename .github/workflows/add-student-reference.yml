name: Add student explanation reference

on:
  push:
    paths:
      - '.github/workflows/add-student-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build student reference
        run: python3 scripts/add_student_reference.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html references/second-secondary/lesson-1-relative-velocity.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add student explanation reference"
            git push
          fi
