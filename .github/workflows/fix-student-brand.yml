name: Fix student brand deploy compatibility

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-student-brand.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix brand references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('منصة تدريبات الفيزياء','منصة الفيزياء')
          p.write_text(s,encoding='utf-8')

          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>منصة تدريبات الفيزياء — مستر يوسف رزق</title>','<title>منصة الفيزياء — مستر يوسف رزق</title>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml student.html
          git diff --cached --quiet && exit 0
          git commit -m "Align student brand and Pages deploy"
          git push
