name: Apply assessment UI v2
on:
  push:
    paths:
      - '.github/workflows/apply-assessment-ui-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pages
        run: |
          python - <<'PY'
          from pathlib import Path

          # reviews
          p=Path('reviews-admin.html'); s=p.read_text(encoding='utf-8')
          if '.cycleBadge{' not in s:
              s=s.replace('.aiBadge{background:#f3e8ff;color:#6b21a8}', '.aiBadge{background:#f3e8ff;color:#6b21a8}.cycleBadge{background:#fff1f3;color:#c01048;border:1px solid #fecdd3;font-weight:900}.cycleRow{background:linear-gradient(90deg,#fff8f8,transparent)}',1)
          if 'value="precutoff"' not in s:
              s=s.replace('<option value="pending">في انتظار المراجعة</option>', '<option value="pending">في انتظار المراجعة</option><option value="precutoff">🔴 قبل الشامل — أولوية</option>',1)
          if "const pre=p.filter(x=>x.affects_cycle_evaluation)" not in s:
              s=s.replace("function renderStats(){const p=all.filter(x=>x.grading_status==='review');const r=", "function renderStats(){const p=all.filter(x=>x.grading_status==='review');const pre=p.filter(x=>x.affects_cycle_evaluation);const r=",1)
              old="$('stats').innerHTML='<div class=\"c4 stat\"><b>'+p.length+'</b><span class=\"muted small\">إجابة تنتظر المراجعة</span></div><div class=\"c4 stat\"><b>'+new Set(p.map(x=>x.attempt_id)).size+'</b><span class=\"muted small\">محاولة معلقة</span></div><div class=\"c4 stat\"><b>'+r.length+'</b><span class=\"muted small\">إجابة تمت مراجعتها</span></div>';"
              new="$('stats').innerHTML='<div class=\"c3 stat\"><b>'+p.length+'</b><span class=\"muted small\">إجابة تنتظر المراجعة</span></div><div class=\"c3 stat\" style=\"border-color:#fecdd3;background:#fff1f3\"><b>'+pre.length+'</b><span class=\"small\" style=\"color:#c01048\">تؤثر على تقييم الشامل</span></div><div class=\"c3 stat\"><b>'+new Set(p.map(x=>x.attempt_id)).size+'</b><span class=\"muted small\">محاولة معلقة</span></div><div class=\"c3 stat\"><b>'+r.length+'</b><span class=\"muted small\">إجابة تمت مراجعتها</span></div>';"
              s=s.replace(old,new,1)
          if "mode==='precutoff'" not in s:
              s=s.replace("(mode==='pending'&&x.grading_status==='review')||(mode==='reviewed'", "(mode==='pending'&&x.grading_status==='review')||(mode==='precutoff'&&x.grading_status==='review'&&x.affects_cycle_evaluation)||(mode==='reviewed'",1)
          if 'view.sort((a,b)=>Number(Boolean(b.affects_cycle_evaluation))' not in s:
              s=s.replace("return m&&s});$('rows').innerHTML=", "return m&&s});view.sort((a,b)=>Number(Boolean(b.affects_cycle_evaluation))-Number(Boolean(a.affects_cycle_evaluation))||new Date(a.submitted_at||0)-new Date(b.submitted_at||0));$('rows').innerHTML=",1)
          if 'cycleRow' not in s.split('function renderRows()',1)[-1]:
              s=s.replace("view.map(x=>'<div class=\"reviewrow\"><div><b>'+esc(x.student_name)", "view.map(x=>'<div class=\"reviewrow '+(x.affects_cycle_evaluation&&x.grading_status===\"review\"?\"cycleRow\":\"\")+'\"><div><b>'+esc(x.student_name)",1)
          if '🔴 قبل الشامل</span>' not in s:
              s=s.replace("<span class=\"pill\">'+esc(x.student_code)+'</span><div class=\"muted small\"", "<span class=\"pill\">'+esc(x.student_code)+'</span>'+(x.affects_cycle_evaluation&&x.grading_status==='review'?'<span class=\"pill cycleBadge\" style=\"margin-right:5px\">🔴 قبل الشامل</span>':'')+'<div class=\"muted small\"",1)
          if "get('mode')==='precutoff'" not in s:
              s=s.replace("$('userEmail').textContent=session.user.email||'';load().catch", "$('userEmail').textContent=session.user.email||'';if(new URLSearchParams(location.search).get('mode')==='precutoff')$('mode').value='precutoff';load().catch",1)
          p.write_text(s,encoding='utf-8')

          # student
          p=Path('student.html'); s=p.read_text(encoding='utf-8')
          if '.assessmentHero{' not in s:
              css='.assessmentHero{background:linear-gradient(135deg,#111c44,#000073);color:#fff;border:0}.assessmentHero h2{margin:0 0 7px}.assessmentHero p{color:#dbe4ff;line-height:1.8;margin:0}.assessmentCutoff{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px}.assessmentGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.assessmentMetric{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px}.assessmentMetric b{display:block;font-size:25px;margin:6px 0}.assessmentSplit{display:grid;grid-template-columns:1fr 1fr;gap:12px}.assessmentAlert{border:1px solid #fedf89;background:#fffaeb;color:#93370d;border-radius:13px;padding:12px;line-height:1.75}.assessmentAfter{border:1px solid #bfdbfe;background:#eff6ff;border-radius:13px;padding:14px;line-height:1.75}.assessmentOutcome{border:1px solid #e4e7ec;border-radius:14px;padding:16px;text-align:center}.assessmentOutcome b{font-size:30px;display:block;margin:5px}.assessmentRule{font-size:12px;color:#667085;line-height:1.8}html[data-theme="dark"] .assessmentMetric,html[data-theme="dark"] .assessmentOutcome{background:#111827;border-color:#334155}html[data-theme="dark"] .assessmentAlert{background:#422006;border-color:#a16207;color:#fde68a}html[data-theme="dark"] .assessmentAfter{background:#172554;border-color:#1d4ed8}html[data-theme="dark"] .assessmentRule{color:#9ca3af}@media(max-width:760px){.assessmentGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.assessmentSplit{grid-template-columns:1fr}'
              s=s.replace('</style>',css+'\n</style>',1)
          if 'id="openAssessmentCycle"' not in s:
              anchor='<button id="openPlatformIndicators" class="card studentNavCard"'
              card='<button id="openAssessmentCycle" class="card studentNavCard" type="button"><div class="studentNavIcon">🎓</div><h3>تقييمي قبل الشامل</h3><p>رحلة أدائك قبل الشامل منفصلة عن أي نشاط تم بعده.</p></button>'
              s=s.replace(anchor,card+anchor,1)
              s=s.replace('متوسط الدرجات، أفضل نتيجة، اتجاه الأداء وتفاصيل كل اختبار.','حصيلة الدرجات الفعلية، أفضل نتيجة واتجاه الأداء.',1)
          if 'id="assessmentCycleView"' not in s:
              view='<section id="assessmentCycleView" class="hidden"><div class="studentSubHead"><div><h2>🎓 تقييمي قبل الشامل</h2><p class="sectionIntro">صورة أدائك وقت دخول الشامل؛ نشاطك اللاحق لا يغير الماضي.</p></div><button id="backAssessmentMenu" class="btn secondary studentBack">العودة لمؤشراتي</button></div><div id="assessmentLoading" class="card"><div class="empty">جاري تحميل دورة التقييم...</div></div><div id="assessmentBody" class="hidden"></div></section>\n'
              s=s.replace('<section id="classTestsView" class="hidden">',view+'<section id="classTestsView" class="hidden">',1)
          if "'assessmentCycleView'" not in s:
              s=s.replace("'classTestsView','honorView'", "'classTestsView','assessmentCycleView','honorView'",1)
          if 'async function assessmentCycleFn()' not in s:
              marker='function testPctMeta(v)'
              fn="async function assessmentCycleFn(){const{data,error}=await sb.functions.invoke('student-assessment-cycle',{body:{action:'summary'}});if(error)throw new Error(error.message||'تعذر تحميل تقييم ما قبل الشامل');if(data?.error)throw new Error(data.message||data.error);return data}\n"
              s=s.replace(marker,fn+marker,1)
          if 'function renderAssessmentCycle(d)' not in s:
              render="""function assessmentPct(v){return v==null?'—':Number(v)+'%'}
function assessmentDate(v){return v?new Date(v).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'medium',timeStyle:'short'}):'—'}
function renderAssessmentCycle(d){if(!d.cycle){$('assessmentBody').innerHTML='<div class=\"card empty\">'+esc(d.message||'لا توجد دورة تقييم متاحة.')+'</div>';return}const c=d.cycle,p=d.pre_comprehensive||{},a=p.attendance||{},h=p.homework||{},q=p.quizzes||{},pl=p.platform||{},after=d.after_comprehensive||{},comp=(d.comprehensive||[])[0]||{},pending=Number(p.pending_essay_answers||0),outcome=comp.status==='scored'?Number(comp.score)+' / '+Number(comp.max_score):comp.status==='absent'?'غائب':'لم تُدخل درجة الشامل بعد';$('assessmentBody').innerHTML='<div class=\"card assessmentHero\"><h2>'+esc(c.title)+'</h2><p>هذه البيانات متوقفة عند لحظة الإغلاق؛ أي تدريب بعد الشامل يظهر منفصلًا ولا يغيّر تقييمك السابق.</p><span class=\"assessmentCutoff\">إغلاق التقييم: '+esc(assessmentDate(c.cutoff_at))+'</span></div>'+(pending?'<div class=\"assessmentAlert\" style=\"margin-bottom:13px\"><b>⏳ التقييم ما زال مبدئيًا</b><br>لديك '+pending+' إجابة مقالية من تدريبات سُلّمت قبل الشامل وما زالت تنتظر التصحيح. وقت اعتماد التصحيح لا يغيّر تاريخ إنجازك.</div>':'')+'<div class=\"assessmentGrid\" style=\"margin-bottom:13px\"><div class=\"assessmentMetric\"><span>📅 الحضور</span><b>'+assessmentPct(a.rate)+'</b><div class=\"small muted\">'+(a.present||0)+' حضور · '+(a.absent||0)+' غياب</div></div><div class=\"assessmentMetric\"><span>📚 الواجب</span><b>'+assessmentPct(h.rate)+'</b><div class=\"small muted\">'+(h.done||0)+' كامل · '+(h.partial||0)+' ناقص · '+(h.not_submitted||0)+' لم يسلم'+(h.unknown?' · '+h.unknown+' غير مسجل':'')+'</div></div><div class=\"assessmentMetric\"><span>🧪 الكويزات</span><b>'+(q.possible_score?q.earned_score+' / '+q.possible_score:'—')+'</b><div class=\"small muted\">متوسط فعلي '+(q.average_actual_score??'—')+' / '+(q.average_actual_max??'—')+' · '+(q.absent_tests||0)+' غياب</div></div><div class=\"assessmentMetric\"><span>🚀 المنصة قبل الشامل</span><b>'+(pl.completed_trainings||0)+' / '+(pl.available_trainings||0)+'</b><div class=\"small muted\">إكمال '+assessmentPct(pl.completion_rate)+(pl.quality_ratio==null?'':' · جودة '+assessmentPct(pl.quality_ratio))+'</div></div></div><div class=\"assessmentSplit\"><div class=\"card\"><h3 style=\"margin-top:0\">📌 نتيجة الشامل</h3><div class=\"assessmentOutcome\"><span class=\"small muted\">النتيجة النهائية للدورة</span><b>'+esc(outcome)+'</b><span class=\"small muted\">سنقارنها بمؤشرات الرحلة بعد إدخال الدرجة.</span></div></div><div class=\"card\"><h3 style=\"margin-top:0\">🔵 نشاط بعد الشامل</h3><div class=\"assessmentAfter\"><b>'+(after.attempts||0)+' محاولة بعد الإغلاق</b><br>'+(after.completed_trainings||0)+' تدريب تم العمل عليه بعد الشامل · '+(after.new_trainings_after_cutoff||0)+' تدريب جديد.<br><b>هذا النشاط لا يؤثر على تقييم الجولة السابقة.</b></div></div></div><div class=\"card\"><h3 style=\"margin-top:0\">كيف يتم الحساب؟</h3><div class=\"assessmentRule\">• تاريخ التدريب هو وقت تسليم التدريب كاملًا، لا وقت اعتماد التصحيح.<br>• الكويزات: مجموع الدرجات الفعلية / مجموع نهايات الاختبارات التي لها درجة.<br>• غياب الكويز يظهر منفصلًا ولا يتحول تلقائيًا إلى صفر أكاديمي.<br>• الأوزان النهائية لمؤشر الاستعداد لم تعتمد بعد.</div></div>'}
async function openAssessmentCycleView(){clearMsg();showOnly('assessmentCycleView');$('assessmentLoading').classList.remove('hidden');$('assessmentBody').classList.add('hidden');try{const d=await assessmentCycleFn();renderAssessmentCycle(d);$('assessmentLoading').classList.add('hidden');$('assessmentBody').classList.remove('hidden')}catch(e){$('assessmentLoading').innerHTML='<div class=\"msg err\">'+esc(e.message||'تعذر تحميل التقييم')+'</div>'}}
"""
              s=s.replace('function renderClassTests(d){',render+'function renderClassTests(d){',1)
          if "avg=s.score_ratio??s.average_percentage" not in s:
              s=s.replace("avg=s.average_percentage,m=testPctMeta(avg);$('testsAverage').textContent=pctText(avg);", "avg=s.score_ratio??s.average_percentage,m=testPctMeta(avg);$('testsAverage').textContent=s.total_possible_score?String(s.total_earned_score)+'/'+String(s.total_possible_score):'—';",1)
              s=s.replace('<div class="testsScoreLabel">متوسط الدرجات</div>','<div class="testsScoreLabel">حصيلة الدرجات</div>',1)
              s=s.replace("$('testsScoredDetail').textContent=`من ${s.total_tests||0} اختبار مرتبط بحصصك`;", "$('testsScoredDetail').textContent=s.average_actual_max?`متوسط فعلي ${s.average_actual_score} / ${s.average_actual_max} · من ${s.total_tests||0} اختبار`:`من ${s.total_tests||0} اختبار مرتبط بحصصك`;",1)
              s=s.replace('${pctText(x.avg_percentage)}</b><div class="small muted">${Number(x.scored||0)} بدرجة','${x.possible_score?esc(Number(x.earned_score)+\' / \'+Number(x.possible_score)):\'—\'}</b><div class="small muted">${x.score_ratio==null?\'\':pctText(x.score_ratio)+\' · \' }${Number(x.scored||0)} بدرجة',1)
              s=s.replace("$('testsFootnote').textContent='متوسط الدرجات يُحسب من الاختبارات التي لها درجة مسجلة فقط. الغياب يظهر منفصلًا ولا يُحوّل تلقائيًا إلى درجة صفر داخل المتوسط.'", "$('testsFootnote').textContent='الحصيلة الأكاديمية = مجموع درجات الاختبارات المسجلة ÷ مجموع نهاياتها. لا نأخذ متوسط النسب المنفصلة، والغياب يظهر مستقلًا ولا يتحول تلقائيًا إلى صفر.'",1)
          if "$('openAssessmentCycle').onclick" not in s:
              s=s.replace("$('openClassTests').onclick=()=>openClassTestsView();$('backClassTestsMenu').onclick=()=>showOnly('indicatorsMenuView');", "$('openClassTests').onclick=()=>openClassTestsView();$('backClassTestsMenu').onclick=()=>showOnly('indicatorsMenuView');$('openAssessmentCycle').onclick=()=>openAssessmentCycleView();$('backAssessmentMenu').onclick=()=>showOnly('indicatorsMenuView');",1)
          p.write_text(s,encoding='utf-8')

          # followup
          p=Path('admin-followup-menu.html'); s=p.read_text(encoding='utf-8')
          if 'href="assessment-admin.html"' not in s:
              item='<a class="item" data-section="students" data-min="view" href="assessment-admin.html"><div class="icon"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 16l4-4 3 2 5-7"/></svg></div><h2>دورات التقييم</h2><p>صورة الطالب قبل الشامل، الكويزات بالدرجات الفعلية والنشاط بعد الشامل.</p></a>\n'
              s=s.replace('<a class="item" data-section="class_sessions" data-min="view" href="sessions-admin.html?view=history">',item+'<a class="item" data-section="class_sessions" data-min="view" href="sessions-admin.html?view=history">',1)
          p.write_text(s,encoding='utf-8')

          # admin home
          p=Path('admin-home.html'); s=p.read_text(encoding='utf-8')
          if 'id="assessmentCard"' not in s:
              item='<a id="assessmentCard" class="dashCard hidden" href="assessment-admin.html"><div class="iconBox green"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 16l4-4 3 2 5-7"/></svg></div><div><h3>دورات التقييم</h3><p>تثبيت رحلة الطالب قبل الشامل، ثم مقارنة النتيجة النهائية بأدائه.</p></div><span class="arrow">‹</span></a>\n'
              s=s.replace('<a id="honorCard"',item+'<a id="honorCard"',1)
              s=s.replace("$('followCard').classList.toggle('hidden',!follow);$('honorCard').classList.toggle('hidden',!honor);", "$('followCard').classList.toggle('hidden',!follow);$('assessmentCard').classList.toggle('hidden',!honor);$('honorCard').classList.toggle('hidden',!honor);",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate result
        run: |
          grep -q 'id="openAssessmentCycle"' student.html
          grep -q 'student-assessment-cycle' student.html
          grep -q 'id="assessmentCycleView"' student.html
          grep -q 'value="precutoff"' reviews-admin.html
          grep -q 'affects_cycle_evaluation' reviews-admin.html
          grep -q 'assessment-admin.html' admin-home.html
          grep -q 'assessment-admin.html' admin-followup-menu.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('student.html').read_text(encoding='utf-8')
          x='\n'.join(re.findall(r'<script type="module">([\s\S]*?)</script>',s))
          Path('/tmp/student.js').write_text(x,encoding='utf-8')
          PY
          node --check /tmp/student.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html reviews-admin.html admin-home.html admin-followup-menu.html
          git commit -m 'Add assessment cycle student and admin UI'
          git push
