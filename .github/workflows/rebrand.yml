name: Apply approved platform branding

on:
  push:
    paths:
      - '.github/workflows/rebrand.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update visible branding
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('<title>YR Physics Practice — Admin</title>', '<title>منصة تدريبات الفيزياء — الإدارة | مستر يوسف رزق</title>'),
                  ('<div class="brand"><h1>YR Physics Practice</h1><p>لوحة إدارة بنك تدريبات الفيزياء</p></div>', '<div class="brand"><h1>منصة تدريبات الفيزياء</h1><p>مستر يوسف رزق — لوحة الإدارة</p></div>'),
              ],
              'student.html': [
                  ('<title>YR Physics Practice — الطالب</title>', '<title>منصة تدريبات الفيزياء — مستر يوسف رزق</title>'),
                  ('<div class="top"><div class="brand"><h1>YR Physics Practice</h1><p>تدريبات الفيزياء التفاعلية</p></div>', '<div class="top"><div class="brand"><h1>منصة تدريبات الفيزياء</h1><p>مستر يوسف رزق</p></div>'),
              ],
              'students-admin.html': [
                  ('<title>YR Physics Practice — إدارة الطلاب</title>', '<title>منصة تدريبات الفيزياء — إدارة الطلاب | مستر يوسف رزق</title>'),
                  ('<div class="top"><div class="brand"><h1>إدارة طلاب YR Physics Practice</h1><p>حسابات مستقلة خاصة بمنصة التدريبات</p></div>', '<div class="top"><div class="brand"><h1>منصة تدريبات الفيزياء</h1><p>مستر يوسف رزق — إدارة الطلاب</p></div>'),
              ],
          }

          for filename, reps in replacements.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Expected branding text not found in {filename}: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          Path('.github/workflows/rebrand.yml').unlink()
          PY

      - name: Commit branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html student.html students-admin.html .github/workflows/rebrand.yml
          git commit -m "Adopt Arabic platform branding"
          git push
