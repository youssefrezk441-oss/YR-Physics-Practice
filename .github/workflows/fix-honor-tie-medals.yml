name: Fix honor tie medals
on:
  push:
    paths:
      - '.github/workflows/fix-honor-tie-medals.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix podium medals for tied ranks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"function honorPodiumCard\(s,rank\)\{.*?\}\nfunction honorMetricCell"
          replacement="""function honorPodiumCard(s,slotRank){if(!s)return '<div></div>';const actualRank=Number(s.rank||slotRank),visualRank=actualRank===1?1:actualRank===2?2:3,medal=actualRank===1?'🥇':actualRank===2?'🥈':'🥉';return `<div class=\"podiumCard rank${visualRank}\"><div class=\"podiumMedal\">${medal}</div><div class=\"podiumAvatar podiumSymbol\" aria-hidden=\"true\">${honorPodiumSymbol(actualRank)}</div><div class=\"podiumName\">${esc(s.full_name)}</div><div class=\"podiumGroup\">${esc(s.group_code||'')}</div><div class=\"podiumScore\"><strong>${honorPct(s.overall)}</strong><span>مؤشر التميز</span></div><div class=\"podiumBadges\">${honorBadges(s.badges)}</div></div>`}
          function honorMetricCell"""
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'podium replacement count={n}')
          ns=ns.replace('إتمام التدريبات ومتوسط الدرجات وأفضل نتيجة.','إتمام التدريبات ومتوسط أفضل نتيجة معتمدة وأفضل أداء.',1)
          ns=ns.replace('مكوّن تدريبات المنصة يجمع بين إكمال التدريبات وجودة الأداء.','مكوّن تدريبات المنصة يجمع بين إكمال التدريبات النشطة وجودة أفضل نتيجة معتمدة لكل تدريب.',1)
          p.write_text(ns,encoding='utf-8')
          PY
      - name: Validate tie-aware podium
        run: |
          grep -q 'const actualRank=Number(s.rank||slotRank)' student.html
          grep -q "actualRank===2?'🥈'" student.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make honor podium tie-aware'
          git push
