name: Build assessment cycle UI once
on:
  push:
    paths:
      - '.github/workflows/build-assessment-cycle-ui-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch assessment cycle UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              return s.replace(old,new,1)

          # ---- reviews admin ----
          p=Path('reviews-admin.html'); s=p.read_text(encoding='utf-8')
          s=once(s,'.aiBadge{background:#f3e8ff;color:#6b21a8}', '.aiBadge{background:#f3e8ff;color:#6b21a8}.cycleBadge{background:#fff1f3;color:#c01048;border:1px solid #fecdd3;font-weight:900}.cycleRow{background:linear-gradient(90deg,#fff8f8,transparent)}','review css')
          s=once(s,'<option value="pending">في انتظار المراجعة</option><option value="reviewed">تمت مراجعتها</option><option value="all">الكل</option>', '<option value="pending">في انتظار المراجعة</option><option value="precutoff">🔴 قبل الشامل — أولوية</option><option value="reviewed">تمت مراجعتها</option><option value="all">الكل</option>','review filter')
          old="function renderStats(){const p=all.filter(x=>x.grading_status==='review');const r=all.filter(x=>['correct','incorrect','partial'].includes(x.grading_status));$('stats').innerHTML='<div class=\"c4 stat\"><b>'+p.length+'</b><span class=\"muted small\">إجابة تنتظر المراجعة</span></div><div class=\"c4 stat\"><b>'+new Set(p.map(x=>x.attempt_id)).size+'</b><span class=\"muted small\">محاولة معلقة</span></div><div class=\"c4 stat\"><b>'+r.length+'</b><span class=\"muted small\">إجابة تمت مراجعتها</span></div>';"
          new="function renderStats(){const p=all.filter(x=>x.grading_status==='review');const pre=p.filter(x=>x.affects_cycle_evaluation);const r=all.filter(x=>['correct','incorrect','partial'].includes(x.grading_status));$('stats').innerHTML='<div class=\"c3 stat\"><b>'+p.length+'</b><span class=\"muted small\">إجابة تنتظر المراجعة</span></div><div class=\"c3 stat\" style=\"border-color:#fecdd3;background:#fff1f3\"><b>'+pre.length+'</b><span class=\"small\" style=\"color:#c01048\">تؤثر على تقييم الشامل</span></div><div class=\"c3 stat\"><b>'+new Set(p.map(x=>x.attempt_id)).size+'</b><span class=\"muted small\">محاولة معلقة</span></div><div class=\"c3 stat\"><b>'+r.length+'</b><span class=\"muted small\">إجابة تمت مراجعتها</span></div>';"
          s=once(s,old,new,'review stats')
          old="const m=mode==='all'||(mode==='pending'&&x.grading_status==='review')||(mode==='reviewed'&&['correct','incorrect','partial'].includes(x.grading_status));"
          new="const m=mode==='all'||(mode==='pending'&&x.grading_status==='review')||(mode==='precutoff'&&x.grading_status==='review'&&x.affects_cycle_evaluation)||(mode==='reviewed'&&['correct','incorrect','partial'].includes(x.grading_status));"
          s=once(s,old,new,'review filter logic')
          old="view=all.filter(x=>{const m="
          new="view=all.filter(x=>{const m="
          # keep marker; prioritize pre-cutoff pending after filtering
          old2="return m&&s});$('rows').innerHTML=view.map(x=>'<div class=\"reviewrow\">"
          new2="return m&&s});view.sort((a,b)=>Number(Boolean(b.affects_cycle_evaluation))-Number(Boolean(a.affects_cycle_evaluation))||new Date(a.submitted_at||0)-new Date(b.submitted_at||0));$('rows').innerHTML=view.map(x=>'<div class=\"reviewrow '+(x.affects_cycle_evaluation&&x.grading_status==='review'?'cycleRow':'')+'\">"
          s=once(s,old2,new2,'review priority sort')
          old="<b>'+esc(x.student_name)+'</b> <span class=\"pill\">'+esc(x.student_code)+'</span><div class=\"muted small\""
          new="<b>'+esc(x.student_name)+'</b> <span class=\"pill\">'+esc(x.student_code)+'</span>'+(x.affects_cycle_evaluation&&x.grading_status==='review'?'<span class=\"pill cycleBadge\" style=\"margin-right:5px\">🔴 قبل الشامل</span>':'')+'<div class=\"muted small\""
          s=once(s,old,new,'review row badge')
          old="const {data:{session}}=await sb.auth.getSession();if(session?.user?.app_metadata?.role==='admin'){$('gate').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=session.user.email||'';load().catch(e=>note(e.message,'err'))}"
          new="const {data:{session}}=await sb.auth.getSession();if(session?.user?.app_metadata?.role==='admin'){$('gate').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=session.user.email||'';if(new URLSearchParams(location.search).get('mode')==='precutoff')$('mode').value='precutoff';load().catch(e=>note(e.message,'err'))}"
          s=once(s,old,new,'review query mode')
          p.write_text(s,encoding='utf-8')

          # ---- student page ----
          p=Path('student.html'); s=p.read_text(encoding='utf-8')
          css='''.assessmentHero{background:linear-gradient(135deg,#111c44,#000073);color:#fff;border:0}.assessmentHero h2{margin:0 0 7px}.assessmentHero p{color:#dbe4ff;line-height:1.8;margin:0}.assessmentCutoff{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px}.assessmentGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.assessmentMetric{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px}.assessmentMetric b{display:block;font-size:25px;margin:6px 0}.assessmentMetric .small{line-height:1.65}.assessmentSplit{display:grid;grid-template-columns:1fr 1fr;gap:12px}.assessmentAlert{border:1px solid #fedf89;background:#fffaeb;color:#93370d;border-radius:13px;padding:12px;line-height:1.75}.assessmentAfter{border:1px solid #bfdbfe;background:#eff6ff;border-radius:13px;padding:14px;line-height:1.75}.assessmentOutcome{border:1px solid #e4e7ec;border-radius:14px;padding:16px;text-align:center}.assessmentOutcome b{font-size:30px;display:block;margin:5px}.assessmentRule{font-size:12px;color:#667085;line-height:1.8}html[data-theme="dark"] .assessmentMetric,html[data-theme="dark"] .assessmentOutcome{background:#111827;border-color:#334155}html[data-theme="dark"] .assessmentAlert{background:#422006;border-color:#a16207;color:#fde68a}html[data-theme="dark"] .assessmentAfter{background:#172554;border-color:#1d4ed8}html[data-theme="dark"] .assessmentRule{color:#9ca3af}@media(max-width:760px){.assessmentGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.assessmentSplit{grid-template-columns:1fr}}'''
          s=once(s,'</style>',css+'\n</style>','student assessment css')
          old='<button id="openClassTests" class="card studentNavCard" type="button"><div class="studentNavIcon">🧪</div><h3>اختبارات الحصص</h3><p>متوسط الدرجات، أفضل نتيجة، اتجاه الأداء وتفاصيل كل اختبار.</p></button><button id="openPlatformIndicators"'
          new='<button id="openClassTests" class="card studentNavCard" type="button"><div class="studentNavIcon">🧪</div><h3>اختبارات الحصص</h3><p>حصيلة الدرجات الفعلية، أفضل نتيجة واتجاه الأداء.</p></button><button id="openAssessmentCycle" class="card studentNavCard" type="button"><div class="studentNavIcon">🎓</div><h3>تقييمي قبل الشامل</h3><p>رحلة أدائك قبل الشامل منفصلة عن أي نشاط تم بعده.</p></button><button id="openPlatformIndicators"'
          s=once(s,old,new,'student assessment card')
          marker='<section id="classTestsView" class="hidden">'
          view='''<section id="assessmentCycleView" class="hidden"><div class="studentSubHead"><div><h2>🎓 تقييمي قبل الشامل</h2><p class="sectionIntro">صورة أدائك وقت دخول الشامل؛ نشاطك اللاحق لا يغير الماضي.</p></div><button id="backAssessmentMenu" class="btn secondary studentBack">العودة لمؤشراتي</button></div><div id="assessmentLoading" class="card"><div class="empty">جاري تحميل دورة التقييم...</div></div><div id="assessmentBody" class="hidden"></div></section>\n'''
          s=once(s,marker,view+marker,'student assessment view')
          old="'platformIndicatorsView','commitmentView','classTestsView','honorView'"
          new="'platformIndicatorsView','commitmentView','classTestsView','assessmentCycleView','honorView'"
          s=once(s,old,new,'student views list')
          old="async function classTestsFn(){const{data,error}=await sb.functions.invoke('student-class-tests',{body:{action:'summary'}});if(error)throw new Error(error.message||'تعذر تحميل اختبارات الحصص');if(data?.error)throw new Error(data.message||data.error);return data}"
          new=old+"\nasync function assessmentCycleFn(){const{data,error}=await sb.functions.invoke('student-assessment-cycle',{body:{action:'summary'}});if(error)throw new Error(error.message||'تعذر تحميل تقييم ما قبل الشامل');if(data?.error)throw new Error(data.message||data.error);return data}"
          s=once(s,old,new,'student assessment fn')
          render=r'''function assessmentPct(v){return v==null?'—':Number(v)+'%'}
function assessmentDate(v){return v?new Date(v).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'medium',timeStyle:'short'}):'—'}
function renderAssessmentCycle(d){if(!d.cycle){$('assessmentBody').innerHTML='<div class="card empty">'+esc(d.message||'لا توجد دورة تقييم متاحة.')+'</div>';return}const c=d.cycle,p=d.pre_comprehensive||{},a=p.attendance||{},h=p.homework||{},q=p.quizzes||{},pl=p.platform||{},after=d.after_comprehensive||{},comp=(d.comprehensive||[])[0]||{};const pending=Number(p.pending_essay_answers||0);const outcome=comp.status==='scored'?`${Number(comp.score)} / ${Number(comp.max_score)}`:comp.status==='absent'?'غائب':'لم تُدخل درجة الشامل بعد';$('assessmentBody').innerHTML=`<div class="card assessmentHero"><h2>${esc(c.title)}</h2><p>هذه البيانات متوقفة عند لحظة الإغلاق، لذلك أي تدريب حللته بعد الشامل يظهر منفصلًا ولا يغيّر تقييمك السابق.</p><span class="assessmentCutoff">إغلاق التقييم: ${esc(assessmentDate(c.cutoff_at))}</span></div>${pending?`<div class="assessmentAlert" style="margin-bottom:13px"><b>⏳ التقييم ما زال مبدئيًا</b><br>لديك ${pending} إجابة مقالية من تدريبات سُلّمت قبل الشامل وما زالت تنتظر اعتماد التصحيح. وقت اعتماد التصحيح لا يغيّر تاريخ إنجازك.</div>`:''}<div class="assessmentGrid" style="margin-bottom:13px"><div class="assessmentMetric"><span>📅 الحضور</span><b>${assessmentPct(a.rate)}</b><div class="small muted">${a.present||0} حضور · ${a.absent||0} غياب</div></div><div class="assessmentMetric"><span>📚 الواجب</span><b>${assessmentPct(h.rate)}</b><div class="small muted">${h.done||0} كامل · ${h.partial||0} ناقص · ${h.not_submitted||0} لم يسلم${h.unknown?' · '+h.unknown+' غير مسجل':''}</div></div><div class="assessmentMetric"><span>🧪 الكويزات</span><b>${q.possible_score?`${q.earned_score} / ${q.possible_score}`:'—'}</b><div class="small muted">متوسط فعلي ${q.average_actual_score??'—'} / ${q.average_actual_max??'—'} · ${q.absent_tests||0} غياب</div></div><div class="assessmentMetric"><span>🚀 المنصة قبل الشامل</span><b>${pl.completed_trainings||0} / ${pl.available_trainings||0}</b><div class="small muted">إكمال ${assessmentPct(pl.completion_rate)}${pl.quality_ratio==null?'':' · جودة '+assessmentPct(pl.quality_ratio)}</div></div></div><div class="assessmentSplit"><div class="card"><h3 style="margin-top:0">📌 نتيجة الشامل</h3><div class="assessmentOutcome"><span class="small muted">النتيجة النهائية للدورة</span><b>${esc(outcome)}</b><span class="small muted">لن تُدمج مع مؤشرات الرحلة؛ سنقارنها بها بعد إدخال الدرجة.</span></div></div><div class="card"><h3 style="margin-top:0">🔵 نشاط بعد الشامل</h3><div class="assessmentAfter"><b>${after.attempts||0} محاولة بعد الإغلاق</b><br>${after.completed_trainings||0} تدريب تم العمل عليه بعد الشامل · ${after.new_trainings_after_cutoff||0} تدريب جديد بعد الإغلاق.<br><b>هذا النشاط لا يؤثر على تقييم الجولة السابقة.</b></div></div></div><div class="card"><h3 style="margin-top:0">كيف يتم الحساب؟</h3><div class="assessmentRule">• تاريخ التدريب المعتمد هو وقت تسليمك للتدريب كاملًا، وليس وقت تصحيح المدرس.<br>• الكويزات تُعرض كدرجات فعلية: مجموع درجاتك / مجموع النهايات، وليس متوسط نسب منفصلة.<br>• غياب الكويز يظهر منفصلًا ولا يتحول تلقائيًا إلى صفر في المتوسط الأكاديمي.<br>• لم تعتمد أوزان «مؤشر الاستعداد» النهائي بعد، لذلك لا نعرض نسبة مركبة مؤقتة.</div></div>`}
async function openAssessmentCycleView(){clearMsg();showOnly('assessmentCycleView');$('assessmentLoading').classList.remove('hidden');$('assessmentBody').classList.add('hidden');$('assessmentLoading').innerHTML='<div class="empty">جاري تحميل دورة التقييم...</div>';try{const d=await assessmentCycleFn();renderAssessmentCycle(d);$('assessmentLoading').classList.add('hidden');$('assessmentBody').classList.remove('hidden')}catch(e){$('assessmentLoading').innerHTML='<div class="msg err">'+esc(e.message||'تعذر تحميل التقييم')+'</div>'}}
'''
          s=once(s,'function renderClassTests(d){',render+'function renderClassTests(d){','student assessment render')
          s=once(s,"const s=d.summary||{},perf=d.performance||{},avg=s.average_percentage,m=testPctMeta(avg);$('testsAverage').textContent=pctText(avg);", "const s=d.summary||{},perf=d.performance||{},avg=s.score_ratio??s.average_percentage,m=testPctMeta(avg);$('testsAverage').textContent=s.total_possible_score?`${s.total_earned_score}/${s.total_possible_score}`:'—';",'class test total display')
          s=once(s,"$('testsScoredDetail').textContent=`من ${s.total_tests||0} اختبار مرتبط بحصصك`;", "$('testsScoredDetail').textContent=s.average_actual_max?`متوسط فعلي ${s.average_actual_score} / ${s.average_actual_max} · من ${s.total_tests||0} اختبار`:`من ${s.total_tests||0} اختبار مرتبط بحصصك`;",'class test scored detail')
          s=once(s,"${pctText(x.avg_percentage)}</b><div class=\"small muted\">${Number(x.scored||0)} بدرجة", "${x.possible_score?esc(Number(x.earned_score)+' / '+Number(x.possible_score)):'—'}</b><div class=\"small muted\">${x.score_ratio==null?'':pctText(x.score_ratio)+' · '}${Number(x.scored||0)} بدرجة",'class type actual totals')
          s=once(s,"$('testsFootnote').textContent='متوسط الدرجات يُحسب من الاختبارات التي لها درجة مسجلة فقط. الغياب يظهر منفصلًا ولا يُحوّل تلقائيًا إلى درجة صفر داخل المتوسط.'", "$('testsFootnote').textContent='الحصيلة الأكاديمية = مجموع درجات الاختبارات المسجلة ÷ مجموع نهاياتها. لا نأخذ متوسط النسب المنفصلة، والغياب يظهر مستقلًا ولا يتحول تلقائيًا إلى صفر.'",'class footnote')
          s=once(s,'<div class="testsScoreLabel">متوسط الدرجات</div>','<div class="testsScoreLabel">حصيلة الدرجات</div>','class score label')
          old="$('openClassTests').onclick=()=>openClassTestsView();$('backClassTestsMenu').onclick=()=>showOnly('indicatorsMenuView');"
          new=old+"$('openAssessmentCycle').onclick=()=>openAssessmentCycleView();$('backAssessmentMenu').onclick=()=>showOnly('indicatorsMenuView');"
          s=once(s,old,new,'assessment handlers')
          p.write_text(s,encoding='utf-8')

          # ---- admin followup menu ----
          p=Path('admin-followup-menu.html'); s=p.read_text(encoding='utf-8')
          marker='<a class="item" data-section="class_sessions" data-min="view" href="sessions-admin.html?view=history">'
          item='<a class="item" data-section="students" data-min="view" href="assessment-admin.html"><div class="icon"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 16l4-4 3 2 5-7"/><circle cx="18" cy="7" r="1"/></svg></div><h2>دورات التقييم</h2><p>صورة الطالب قبل الشامل، المقالي المؤثر، الكويزات بالدرجات الفعلية والنشاط بعد الشامل.</p></a>\n'
          s=once(s,marker,item+marker,'followup assessment card')
          p.write_text(s,encoding='utf-8')

          # ---- admin home ----
          p=Path('admin-home.html'); s=p.read_text(encoding='utf-8')
          marker='<a id="honorCard" class="dashCard hidden" href="admin-honor.html">'
          item='<a id="assessmentCard" class="dashCard hidden" href="assessment-admin.html"><div class="iconBox green"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 16l4-4 3 2 5-7"/><path d="M6 5h12"/></svg></div><div><h3>دورات التقييم</h3><p>تثبيت رحلة الطالب قبل الشامل، ثم مقارنة النتيجة النهائية بأدائه الفعلي.</p></div><span class="arrow">‹</span></a>\n'
          s=once(s,marker,item+marker,'home assessment card')
          old="$('followCard').classList.toggle('hidden',!follow);$('honorCard').classList.toggle('hidden',!honor);"
          new="$('followCard').classList.toggle('hidden',!follow);$('assessmentCard').classList.toggle('hidden',!honor);$('honorCard').classList.toggle('hidden',!honor);"
          s=once(s,old,new,'home assessment visibility')
          old="$('empty').classList.toggle('hidden',content||follow||honor||ctx.isOwner)"
          new="$('empty').classList.toggle('hidden',content||follow||honor||ctx.isOwner)"
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate patched pages
        run: |
          grep -q "openAssessmentCycle" student.html
          grep -q "student-assessment-cycle" student.html
          grep -q "حصيلة الدرجات" student.html
          grep -q "affects_cycle_evaluation" reviews-admin.html
          grep -q "precutoff" reviews-admin.html
          grep -q "assessment-admin.html" admin-home.html
          grep -q "assessment-admin.html" admin-followup-menu.html
          test -f assessment-admin.html
      - name: Validate student JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('student.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script type="module">([\s\S]*?)</script>',s)
          Path('/tmp/student-module.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/student-module.js
      - name: Commit assessment cycle UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html reviews-admin.html admin-home.html admin-followup-menu.html
          git commit -m 'Add pre-comprehensive assessment cycle UI'
          git push
