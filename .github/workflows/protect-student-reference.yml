name: Protect student explanation reference

on:
  push:
    paths:
      - '.github/workflows/protect-student-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch student reference access
        run: python3 scripts/protect_student_reference.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Protect student explanation reference"
            git push
          fi
