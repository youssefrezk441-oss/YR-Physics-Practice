name: Protect student explanation reference

on:
  push:
    paths:
      - '.github/workflows/protect-student-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch student reference access
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('student.html')
          text=p.read_text(encoding='utf-8')

          old_anchor='''<a id="refB2Lesson1" class="card studentNavCard referenceLessonCard" href="./references/second-secondary/lesson-1-relative-velocity.html" target="_blank" rel="noopener"><div class="studentNavIcon">🧭</div><h3>الدرس الأول</h3><p>متجهات السرعة والسرعة النسبية — الصف الثاني الثانوي.</p><span class="referenceBadge">متاح الآن</span></a>'''
          new_button='''<button id="refB2Lesson1" class="card studentNavCard referenceLessonCard" type="button"><div class="studentNavIcon">🧭</div><h3>الدرس الأول</h3><p>متجهات السرعة والسرعة النسبية — الصف الثاني الثانوي.</p><span class="referenceBadge">متاح الآن</span></button>'''
          if old_anchor in text:
              text=text.replace(old_anchor,new_button,1)
          elif new_button not in text:
              raise SystemExit('Reference card not found')

          old_handler="$('openReferences').onclick=()=>{const isSecond=gradeLabel(profile?.grade_level)==='الصف الثاني الثانوي';$('refB2Lesson1').classList.toggle('hidden',!isSecond);$('referencesEmpty').classList.toggle('hidden',isSecond);showOnly('referencesView')};$('backReferences').onclick=()=>showOnly('dashboardView');$('openTrainings').onclick=()=>showOnly('trainingMenuView');"
          new_handler="$('openReferences').onclick=()=>{const isSecond=gradeLabel(profile?.grade_level)==='الصف الثاني الثانوي';$('refB2Lesson1').classList.toggle('hidden',!isSecond);$('referencesEmpty').classList.toggle('hidden',isSecond);showOnly('referencesView')};$('backReferences').onclick=()=>showOnly('dashboardView');$('refB2Lesson1').onclick=()=>openProtectedExplanationReference('lesson-1-relative-velocity');$('openTrainings').onclick=()=>showOnly('trainingMenuView');"
          if old_handler in text:
              text=text.replace(old_handler,new_handler,1)
          elif new_handler not in text:
              raise SystemExit('Reference handler not found')

          marker='async function openProtectedExplanationReference('
          if marker not in text:
              fn=r'''
  async function openProtectedExplanationReference(slug){
    const w=window.open('', '_blank');
    if(!w){alert('اسمح بفتح النوافذ المنبثقة للمنصة ثم حاول مرة أخرى.');return}
    try{
      w.document.open();
      w.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جاري فتح المرجع...</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif}.box{text-align:center;padding:30px}.spin{width:42px;height:42px;border:4px solid #334155;border-top-color:#60a5fa;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><b>جاري التحقق وفتح مرجع الشرح...</b></div></body></html>');
      w.document.close();
      const {data,error}=await sb.functions.invoke('student-explanation-reference',{body:{slug}});
      if(error){let message=error.message||'تعذر فتح مرجع الشرح';try{if(error.context&&typeof error.context.json==='function'){const payload=await error.context.json();message=payload?.message||payload?.error||message}}catch{}throw new Error(message)}
      if(!data?.ok||!data?.html)throw new Error(data?.message||'تعذر فتح مرجع الشرح');
      w.document.open();
      w.document.write(data.html);
      w.document.close();
      try{w.opener=null}catch{}
    }catch(e){
      const msg=String(e?.message||'تعذر فتح مرجع الشرح');
      try{w.document.open();w.document.write('<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>تعذر فتح المرجع</title><style>body{font-family:Arial,sans-serif;background:#0b1220;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.e{max-width:520px;padding:26px;border:1px solid #7f1d1d;background:#1f1115;border-radius:16px;line-height:1.8}</style><body><div class="e"><b>تعذر فتح مرجع الشرح.</b><br>'+msg.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</div></body></html>');w.document.close()}catch{}
    }
  }
'''
              anchor='  /* شرح الحصص patch v1 */'
              if anchor not in text: raise SystemExit('Reference patch marker not found')
              text=text.replace(anchor,fn+'\n'+anchor,1)

          p.write_text(text,encoding='utf-8')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Protect student explanation reference"
            git push
          fi
