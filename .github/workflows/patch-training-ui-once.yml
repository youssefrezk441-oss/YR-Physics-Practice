name: Patch student training UI once

on:
  push:
    paths:
      - '.github/workflows/patch-training-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student training list
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          old="""function renderSets(){if(!sets.length){$('setsList').innerHTML='<div class=\"empty\">لا توجد تدريبات نشطة حاليًا.</div>';return}$('setsList').innerHTML=sets.map(s=>{const remain=s.remaining_attempts==null?'غير محدود':s.remaining_attempts;const disabled=s.remaining_attempts===0;return '<div class=\"set\"><h3>'+esc(s.title)+'</h3><div class=\"muted small\">'+esc(s.description||'')+'</div><div class=\"meta\"><span class=\"pill\">'+s.question_count+' سؤال</span><span class=\"pill\">'+Number(s.max_score||0)+' درجة</span><span class=\"pill\">المحاولات المتبقية: '+remain+'</span>'+(s.best_percentage!=null?'<span class=\"pill\">أفضل نتيجة: '+Number(s.best_percentage)+'%</span>':'')+'</div><button class=\"btn primary startSet\" data-slug=\"'+esc(s.slug)+'\" '+(disabled?'disabled':'')+'>'+(disabled?'انتهت المحاولات':'ابدأ التدريب')+'</button></div>'}).join('');document.querySelectorAll('.startSet').forEach(b=>b.onclick=()=>startSet(b.dataset.slug))}"""
          new="""function renderSets(){if(!sets.length){$('setsList').innerHTML='<div class=\"empty\">لا توجد تدريبات نشطة حاليًا.</div>';return}const groups=[],gm=new Map;for(const s of sets){const k=String(s.course_slug||s.course_title||'course');if(!gm.has(k)){const g={title:s.course_title||'التدريبات',icon:s.training_icon||'📘',items:[]};gm.set(k,g);groups.push(g)}gm.get(k).items.push(s)}$('setsList').innerHTML=groups.map(g=>'<div style=\"margin-bottom:22px\"><div class=\"stat\" style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;text-align:right\"><span class=\"circle\">'+esc(g.icon)+'</span><div><b style=\"font-size:17px\">'+esc(g.title)+'</b><div class=\"small muted\">الأحدث يظهر أولًا</div></div></div>'+g.items.map(s=>{const remain=s.remaining_attempts==null?'غير محدود':s.remaining_attempts,locked=!!s.is_locked,attemptsDone=s.remaining_attempts===0,disabled=locked||attemptsDone,buttonText=locked?'🔒 مقفول':attemptsDone?'انتهت المحاولات':'ابدأ التدريب',lockNote=locked?'<div class=\"small muted\" style=\"margin-top:8px;line-height:1.7\">🔒 '+esc(s.lock_reason||('يلزم الحصول على '+Number(s.unlock_threshold||80)+'% في التدريب السابق.'))+(s.prerequisite_best_percentage!=null?' أفضل نتيجة حالية: '+Number(s.prerequisite_best_percentage)+'%.':'')+'</div>':'';return '<div class=\"set\"><h3>'+esc(s.title)+'</h3><div class=\"muted small\">'+esc(s.description||'')+'</div><div class=\"meta\"><span class=\"pill\">'+s.question_count+' سؤال</span><span class=\"pill\">'+Number(s.max_score||0)+' درجة</span><span class=\"pill\">المحاولات المتبقية: '+remain+'</span>'+(s.best_percentage!=null?'<span class=\"pill\">أفضل نتيجة: '+Number(s.best_percentage)+'%</span>':'')+(locked?'<span class=\"pill\">الفتح عند '+Number(s.unlock_threshold||80)+'%</span>':'')+'</div>'+lockNote+'<button class=\"btn primary startSet\" data-slug=\"'+esc(s.slug)+'\" '+(disabled?'disabled':'')+' style=\"margin-top:10px\">'+buttonText+'</button></div>'}).join('')+'</div>').join('');document.querySelectorAll('.startSet:not(:disabled)').forEach(b=>b.onclick=()=>startSet(b.dataset.slug))}"""
          if old not in s:
              raise SystemExit('renderSets target not found; no changes written')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "YR Platform Automation"
          git config user.email "actions@users.noreply.github.com"
          git add student.html
          git rm .github/workflows/patch-training-ui-once.yml
          git commit -m "Show course groups and locked sequential trainings"
          git push origin HEAD:main
