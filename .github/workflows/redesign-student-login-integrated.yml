name: Redesign student login integrated

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/redesign-student-login-integrated.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign login only
        env:
          LOGIN_CSS_B64: 
          LOGIN_HTML_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,re,base64
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Student login redesign */'
          if marker not in s: raise SystemExit('login CSS marker missing')
          a=s.index(marker); b=s.index('</style>',a)
          css=base64.b64decode(os.environ['LOGIN_CSS_B64']).decode('utf-8')
          s=s[:a]+css+'\n'+s[b:]
          html=base64.b64decode(os.environ['LOGIN_HTML_B64']).decode('utf-8')
          pat=r'<section id="loginView" class="loginShell">.*?</section>(?=\s*<section id="dashboardView")'
          s,n=re.subn(pat,html,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'login HTML replacement count={n}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git commit -m "Redesign student login as integrated dark landing page"
          git push
