name: Inspect session delete anchors
on:
  push:
    paths:
      - '.github/workflows/inspect-sessions-delete-patch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant session code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sessions-admin.html').read_text(encoding='utf-8')
          for i,line in enumerate(s.splitlines(),1):
              if any(k in line for k in ['sessionId','loadHistory','openSession','newSessionBtn','saveBtn','historyRows']):
                  print(f'{i}: {line}')
          PY
