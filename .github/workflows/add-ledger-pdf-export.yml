name: Add ledger PDF export

on:
  push:
    branches: [trigger-ledger-pdf-export]
  pull_request:
    branches: [main]
    paths:
      - '.ledger-pdf-export-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch ledger export
        run: |
          git switch -C student-ledger-export-pdf origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('student-ledger-admin.html')
          s=p.read_text(encoding='utf-8')

          css='''\n.printHeader{display:none}\n@media print{\n  @page{size:A3 landscape;margin:8mm}\n  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}\n  body{background:#fff!important}\n  .wrap{max-width:none;padding:0}\n  .top .toolbar,.filtersCard,.open,.details{display:none!important}\n  .top{margin-bottom:8px}.brand p{display:none}\n  .printHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin:0 0 8px;padding:8px 0;border-bottom:1px solid #d0d5dd;font-size:10px;color:#475467}\n  .summary{grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:7px}\n  .summaryCard{min-height:0;padding:7px;border-radius:8px;box-shadow:none!important;transform:none!important}\n  .summaryCard span{font-size:8px}.summaryCard b{font-size:17px;margin-top:2px}\n  .tableWrap{box-shadow:none;border-radius:0;overflow:visible;border:1px solid #98a2b3}\n  .head,.row{min-width:0;grid-template-columns:120px 68px minmax(150px,1.4fr) 78px 86px 72px 62px 86px 92px 100px 112px 88px 80px 92px minmax(150px,1.2fr);gap:4px;padding:5px 6px}\n  .head{position:static;font-size:7px}.sortBtn{font-size:7px;padding:1px}.sortArrow{display:none}\n  .row{font-size:7.5px;break-inside:avoid;page-break-inside:avoid}\n  .name{font-size:8px}.metric b{font-size:9px}.metric span,.small{font-size:6.5px}.pill,.decision,.delta,.actionTag{font-size:6.5px;padding:3px 4px}\n}\n'''
          if '</style>' not in s: raise SystemExit('style target missing')
          s=s.replace('</style>',css+'\n</style>',1)

          old='<div class="toolbar"><span id="who" class="muted small"></span><a class="btn secondary" href="admin-followup-menu.html">← الطلاب والمتابعة</a><button id="refresh" class="btn primary">تحديث</button></div>'
          new='<div class="toolbar"><span id="who" class="muted small"></span><a class="btn secondary" href="admin-followup-menu.html">← الطلاب والمتابعة</a><button id="exportPdf" class="btn secondary">تصدير PDF</button><button id="refresh" class="btn primary">تحديث</button></div>'
          if old not in s: raise SystemExit('toolbar target missing')
          s=s.replace(old,new,1)

          old='  <div id="msg"></div>\n\n  <div class="card">\n    <div class="filters">'
          new='  <div id="msg"></div>\n  <div id="printHeader" class="printHeader"><div><b>سجل الطلاب الشامل — تقرير القرار</b><div id="printFilters"></div></div><div id="printDate"></div></div>\n\n  <div class="card filtersCard">\n    <div class="filters">'
          if old not in s: raise SystemExit('filter card target missing')
          s=s.replace(old,new,1)

          marker='async function load(){'
          helper=r'''function currentFilterSummary(){
  const parts=[];
  const q=$('search').value.trim();if(q)parts.push('بحث: '+q);
  const labels=[['grade','الصف'],['center','السنتر'],['group','المجموعة'],['active','النشاط'],['decision','التقييم'],['quick','فلتر سريع']];
  for(const [id,label] of labels){const el=$(id);if(el&&el.value){const text=el.options?.[el.selectedIndex]?.text||el.value;parts.push(label+': '+text)}}
  const sortText=sortState.key?((columns.find(x=>x[0]===sortState.key)?.[1]||sortState.key)+' '+(sortState.dir==='asc'?'↑':'↓')):'بدون ترتيب';
  parts.push('الترتيب: '+sortText);
  return parts.join(' · ')||'كل الطلاب';
}
function exportVisiblePdf(){
  $('printFilters').textContent=currentFilterSummary();
  $('printDate').textContent='تاريخ التصدير: '+new Date().toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});
  window.print();
}
'''
          if marker not in s: raise SystemExit('load marker missing')
          s=s.replace(marker,helper+marker,1)

          old="$('refresh').onclick=()=>{detailCache.clear();load()};"
          new="$('exportPdf').onclick=exportVisiblePdf;"+old
          if old not in s: raise SystemExit('refresh handler missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import re
          s=open('student-ledger-admin.html',encoding='utf-8').read()
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('no module script found')
          open('/tmp/ledger.mjs','w',encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/ledger.mjs

      - name: Commit output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-ledger-admin.html
          git commit -m "Add PDF export to student ledger"
          git push --force origin student-ledger-export-pdf
