name: Apply student login redesign

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-student-login.yml"
      - "scripts/patch_student_login.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student login
        run: python scripts/patch_student_login.py
      - name: Commit student login
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git diff --cached --quiet && exit 0
          git commit -m "Redesign student login page"
          git push
