# trigger
name: Platform score source update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-score-source-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align student platform indicator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')

          old='<section id="platformIndicatorsView" class="hidden"><div class="studentSubHead"><div><h2>📈 مؤشر تدريبات المنصة</h2><p class="sectionIntro">الإكمال محسوب من التدريبات النشطة، وجودة الأداء = مجموع أفضل الدرجات الفعلية ÷ مجموع نهاياتها.</p></div><button id="backIndicatorsMenu" class="btn secondary studentBack">العودة لمؤشراتي</button></div><div class="card"><div class="metricGrid"><div class="stat"><b id="completedStat">0</b><span class="small muted">تدريب مكتمل</span></div><div class="stat"><b id="completionStat">0%</b><span class="small muted">نسبة الإكمال</span></div><div class="stat"><b id="attemptsStat">0</b><span class="small muted">محاولة مكتملة</span></div><div class="stat"><b id="averageStat">—</b><span class="small muted">جودة أفضل النتائج</span></div><div class="stat"><b id="bestStat">—</b><span class="small muted">أفضل نتيجة</span></div></div></div></section>'
          new='<section id="platformIndicatorsView" class="hidden"><div class="studentSubHead"><div><h2>📈 مؤشر تدريبات المنصة</h2><p class="sectionIntro">المؤشر الأساسي = مجموع أفضل درجاتك في التدريبات المكتملة ÷ مجموع درجات كل التدريبات النشطة. التدريب غير المكتمل تأثيره صفر.</p></div><button id="backIndicatorsMenu" class="btn secondary studentBack">العودة لمؤشراتي</button></div><div class="card"><div class="metricGrid"><div class="stat"><b id="completedStat">0</b><span class="small muted">تدريب مكتمل</span></div><div class="stat"><b id="completionStat">0%</b><span class="small muted">نسبة الإكمال</span></div><div class="stat"><b id="attemptsStat">0</b><span class="small muted">محاولة مكتملة</span></div><div class="stat"><b id="averageStat">—</b><span class="small muted">مؤشر المنصة</span></div><div class="stat"><b id="bestStat">—</b><span class="small muted">جودة التدريبات المكتملة</span></div></div></div></section>'
          if old not in s: raise SystemExit('platform indicator html target missing')
          s=s.replace(old,new,1)

          start=s.index('function renderPlatformIndicators(){')
          end=s.index('function renderSets(){',start)
          newfn="""function renderPlatformIndicators(){const activeSlugs=new Set(sets.map(x=>String(x.slug||''))),activeHistory=history.filter(x=>activeSlugs.has(String(x.slug||''))),completed=activeHistory.filter(x=>x.status!=='in_progress'),graded=activeHistory.filter(x=>x.status==='graded'&&x.percentage!=null),completedSets=new Set(completed.map(x=>String(x.slug||x.title||x.id)));$('attemptsStat').textContent=completed.length;$('completedStat').textContent=completedSets.size;const ratio=sets.length?Math.min(100,Math.round(((completedSets.size/sets.length*100)+1e-9)*10)/10):0;$('completionStat').textContent=(Number.isInteger(ratio)?String(ratio):ratio.toFixed(1))+'%';const bestBySet=new Map;graded.forEach(x=>{const k=String(x.slug||x.title||x.id),v=Number(x.percentage),score=Number(x.score),max=Number(x.max_score);if(!Number.isFinite(v)||!Number.isFinite(score)||!Number.isFinite(max)||max<=0)return;const old=bestBySet.get(k);if(!old||score>old.score||(score===old.score&&v>old.percentage))bestBySet.set(k,{percentage:v,score,max})});const bestValues=[...bestBySet.values()],sumScore=bestValues.reduce((a,x)=>a+x.score,0),sumCompletedMax=bestValues.reduce((a,x)=>a+x.max,0),quality=sumCompletedMax?sumScore/sumCompletedMax*100:null,totalPossible=sets.reduce((a,x)=>{const m=Number(x.max_score);return a+(Number.isFinite(m)&&m>0?m:0)},0),platformScore=totalPossible?sumScore/totalPossible*100:null;$('averageStat').textContent=platformScore==null?'—':(Math.round((platformScore+1e-9)*10)/10).toFixed(1)+'%';$('bestStat').textContent=quality==null?'—':(Math.round((quality+1e-9)*10)/10).toFixed(1)+'%'}
"""
          s=s[:start]+newfn+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate student module
        run: |
          python - <<'PY'
          import re
          s=open('student.html',encoding='utf-8').read()
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('no module script')
          open('/tmp/student.mjs','w',encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/student.mjs
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git diff --cached --quiet && exit 0
          git commit -m "Use unified platform score in student indicator"
          git push
