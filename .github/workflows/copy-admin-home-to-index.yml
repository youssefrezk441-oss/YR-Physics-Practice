name: Sync admin home to root

on:
  push:
    paths:
      - '.github/workflows/copy-admin-home-to-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy actual admin home to index
        run: cp admin-home.html index.html
      - name: Commit root admin page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Show teacher references on main admin page"
            git push
          fi
