name: Patch grade 3 student reference
on:
  push:
    paths:
      - '.github/workflows/patch-b3-student-reference.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student reference menu
        run: python tools/patch_b3_student_reference.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git commit -m "Add grade three lecture two student reference"
          git push
