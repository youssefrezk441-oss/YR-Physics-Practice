name: Update student comparison messages

on:
  pull_request:
    branches: [main]
    paths:
      - '.message-update-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch messages only
        run: |
          git switch -C student-message-update origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          old_up="💬 تواصل مع مستر يوسف وقوله: أنا شايف إن نتيجتي في الشامل أعلى من المتوقع بكتير، إيه أفضل حاجة شايف إنها أدت للنتيجة غير المتوقعة دي؟"
          new_up="🌟 النتيجة أعلى من المتوقع بوضوح. تواصل مع مستر يوسف وشاركه إيه اللي شايف إنك عملته بشكل مختلف أو إيه اللي ساعدك تحقق النتيجة دي، حتى لو كان سبب المنصة مش قادرة تعرفه، عشان نحدد معًا إيه اللي نجح ونحافظ عليه ونكرره."
          old_down="⚠️ تواصل مع مستر يوسف ضروري وقوله: أنا شايف إن نتيجتي في الشامل أقل من المتوقع بكتير، إيه أكتر مشكلة ممكن تكون قابلتني وأدت للنتيجة غير المتوقعة دي؟"
          new_down="⚠️ النتيجة أقل من المتوقع بوضوح. تواصل مع مستر يوسف وشاركه أنت شايف إيه اللي حصل معاك في الامتحان، حتى لو كان سبب المنصة مش قادرة تعرفه، وبعدها نحدد معًا إيه اللي محتاج يتغير."
          if old_up not in s: raise SystemExit('high-result message target missing')
          if old_down not in s: raise SystemExit('low-result message target missing')
          s=s.replace(old_up,new_up,1).replace(old_down,new_down,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate student JavaScript
        run: |
          python - <<'PY'
          import re
          s=open('student.html',encoding='utf-8').read()
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('no module script')
          open('/tmp/student.mjs','w',encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/student.mjs

      - name: Commit output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git commit -m "Update student comparison guidance messages"
          git push --force origin student-message-update
