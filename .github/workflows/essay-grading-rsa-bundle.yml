name: Essay grading RSA bundle bridge

on:
  push:
    branches: [main]
    paths:
      - '.grading/rsa_request.json'
      - '.github/workflows/essay-grading-rsa-bundle.yml'

permissions:
  contents: read
  id-token: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: request
        shell: bash
        run: |
          if [ ! -f .grading/rsa_request.json ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '.request_id and .recipient_spki_b64' .grading/rsa_request.json >/dev/null
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "request_id=$(jq -r '.request_id' .grading/rsa_request.json)" >> "$GITHUB_OUTPUT"
          echo "max_responses=$(jq -r '.max_responses // 250' .grading/rsa_request.json)" >> "$GITHUB_OUTPUT"
          echo "recipient_spki_b64=$(jq -r '.recipient_spki_b64' .grading/rsa_request.json)" >> "$GITHUB_OUTPUT"
      - id: oidc
        if: steps.request.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('yr-essay-grading-bundle');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Build RSA-encrypted bundle
        if: steps.request.outputs.present == 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          MAX_RESPONSES: ${{ steps.request.outputs.max_responses }}
          RECIPIENT_SPKI_B64: ${{ steps.request.outputs.recipient_spki_b64 }}
        shell: bash
        run: |
          payload=$(jq -nc --arg request_id "$REQUEST_ID" --arg recipient_spki_b64 "$RECIPIENT_SPKI_B64" --argjson max_responses "$MAX_RESPONSES" '{request_id:$request_id,max_responses:$max_responses,recipient_spki_b64:$recipient_spki_b64}')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            --output grading-bundle-rsa.json \
            'https://ltjdhconuiqblxfjzpzj.supabase.co/functions/v1/essay-grading-rsa-bundle'
          test -s grading-bundle-rsa.json
      - name: Upload RSA-encrypted grading bundle
        if: steps.request.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: essay-grading-rsa-${{ steps.request.outputs.request_id }}
          path: grading-bundle-rsa.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
