name: Fix B2 lesson 1 workshop card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-b2-workshop-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve B2 workshop card next to references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')

          old="""      '<div class=\"studentHomeGrid\"><button id=\"openReferences\" class=\"card studentNavCard referenceHomeCard\" type=\"button\"><div class=\"studentNavIcon\">📖</div><h3>مرجع الشرح</h3><p>راجع أفكار وقوانين كل حصة بعد الشرح.</p></button>'"""
          new="""      '<div class=\"studentHomeGrid\"><button id=\"openB2Lesson1Workshop\" class=\"card studentNavCard hidden\" type=\"button\"><div class=\"studentNavIcon\">🧭</div><h3>ورشة الدرس الأول</h3><p>متجهات السرعة والسرعة النسبية — ورشة الحصة والتدريب المنزلي.</p></button><button id=\"openReferences\" class=\"card studentNavCard referenceHomeCard\" type=\"button\"><div class=\"studentNavIcon\">📖</div><h3>مرجع الشرح</h3><p>راجع أفكار وقوانين كل حصة بعد الشرح.</p></button>'"""
          if old not in s:
              raise SystemExit('references replacement target not found')
          s=s.replace(old,new,1)

          # Also make the click binding null-safe so a future layout change cannot break the whole student page.
          old_click="""    \"$('openB2Lesson1Workshop').onclick=()=>{window.location.href='./b2-lesson1-workshop.html'};$('openLecture3Workshop').onclick=()=>{window.location.href='./lecture3-workshop.html'};$('openTrainings').onclick=()=>showOnly('trainingMenuView');\""""
          new_click="""    \"const b2w=$('openB2Lesson1Workshop');if(b2w)b2w.onclick=()=>{window.location.href='./b2-lesson1-workshop.html'};const l3w=$('openLecture3Workshop');if(l3w)l3w.onclick=()=>{window.location.href='./lecture3-workshop.html'};$('openTrainings').onclick=()=>showOnly('trainingMenuView');\""""
          if old_click in s:
              s=s.replace(old_click,new_click,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "YR Platform Bot"
          git config user.email "actions@users.noreply.github.com"
          git add student.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix B2 workshop card visibility"
          git push
