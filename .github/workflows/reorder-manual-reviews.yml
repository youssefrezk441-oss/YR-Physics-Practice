name: Reorder manual reviews
on:
  push:
    paths:
      - '.github/workflows/reorder-manual-reviews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder reviews oldest first
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reviews-admin.html')
          s=p.read_text(encoding='utf-8')
          old=".order('submitted_at',{ascending:false,nullsFirst:false})"
          new=".order('submitted_at',{ascending:true,nullsFirst:false})"
          if old not in s:
              raise SystemExit('review ordering target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews-admin.html
          git commit -m "Show oldest essay reviews first"
          git push
