name: Validate unified honor UI
on:
  push:
    paths:
      - '.github/triggers/validate-unified-honor-ui.txt'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract module scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for fn in ['student.html','assessment-admin.html','admin-honor.html']:
              text=Path(fn).read_text(encoding='utf-8')
              parts=re.findall(r'<script[^>]*type=["\']module["\'][^>]*>(.*?)</script>',text,re.S|re.I)
              if not parts:
                  raise SystemExit(f'No module scripts found in {fn}')
              for i,part in enumerate(parts):
                  Path(f'/tmp/{Path(fn).stem}-{i}.mjs').write_text(part,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          for f in /tmp/*.mjs; do echo "Checking $f"; node --check "$f"; done
      - name: Check required rules
        run: |
          grep -q "غياب أي كويز أو امتحان" student.html
          grep -q "honorPhaseMeta" student.html
          grep -q "80%" admin-honor.html
          grep -q "r.readiness_score" assessment-admin.html
      - name: Mark validation success
        run: |
          mkdir -p .github/validation
          echo "ok $(date -u +%FT%TZ)" > .github/validation/unified-honor-ui-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/validation/unified-honor-ui-ok.txt
          git commit -m "Validate unified honor UI syntax"
          git push
