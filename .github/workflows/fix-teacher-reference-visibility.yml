name: Fix teacher reference visibility

on:
  push:
    paths:
      - '.github/workflows/fix-teacher-reference-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch visibility
        run: python3 scripts/fix_teacher_reference_visibility.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-home.html teacher-references.html teacher-reference-lesson1.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix teacher reference visibility"
            git push
          fi
