name: Validate student commitment indicator
on:
  push:
    paths:
      - '.github/workflows/build-student-commitment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix copy and extract module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8').replace('قريب مم مستوى','قريب من مستوى')
          assert 'id="commitmentView"' in s
          assert "student-commitment" in s
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/student.mjs').write_text(s[start:end],encoding='utf-8')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/student.mjs
      - name: Commit copy fix if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          if git diff --cached --quiet; then echo 'No copy fix needed'; else git commit -m "Validate student commitment UI" && git push; fi
