name: Build student commitment indicator
on:
  push:
    paths:
      - '.github/workflows/build-student-commitment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode UI fragments
        run: |
          echo '' | base64 -d > /tmp/commitment.css
          echo '' | base64 -d > /tmp/commitment-view.html
          echo '' | base64 -d > /tmp/commitment.js
      - name: Patch student page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html');s=p.read_text(encoding='utf-8')
          css=Path('/tmp/commitment.css').read_text();view=Path('/tmp/commitment-view.html').read_text();extra=Path('/tmp/commitment.js').read_text()
          anchor='/* Student login redesign */';assert anchor in s;s=s.replace(anchor,css+'\n'+anchor,1)
          old='<button id="openCommitment" class="card studentNavCard" type="button"><div class="studentNavIcon">🎯</div><h3>مؤشر الالتزام</h3><p>الحضور والواجب والالتزام بالحصة.</p><span class="soonBadge">قريبًا</span></button>'
          new='<button id="openCommitment" class="card studentNavCard" type="button"><div class="studentNavIcon">🎯</div><h3>مؤشر الالتزام</h3><p>الحضور والواجب واتجاه التزامك من بيانات حصصك الفعلية.</p></button>'
          assert old in s;s=s.replace(old,new,1)
          before='<section id="comingSoonView" class="hidden">';assert before in s;s=s.replace(before,view+before,1)
          oldv="['loginView','dashboardView','trainingMenuView','indicatorsMenuView','availableTrainingsView','completedTrainingsView','platformIndicatorsView','comingSoonView','practiceView','resultView','reviewView']"
          newv="['loginView','dashboardView','trainingMenuView','indicatorsMenuView','availableTrainingsView','completedTrainingsView','platformIndicatorsView','commitmentView','comingSoonView','practiceView','resultView','reviewView']"
          assert oldv in s;s=s.replace(oldv,newv,1)
          f="async function fn(body){const{data,error}=await sb.functions.invoke('student-practice',{body});if(error)throw new Error(error.message||'تعذر الاتصال');if(data?.error)throw new Error(data.message||data.error);return data}";assert f in s;s=s.replace(f,f+'\n'+extra,1)
          oldc="$('openCommitment').onclick=()=>openSoon('🎯 مؤشر الالتزام','قريبًا — سيتم تفعيل المؤشر بعد ربط بيانات الحضور والواجب المسجلة في الحصص بصفحة الطالب.','indicatorsMenuView');"
          newc="$('openCommitment').onclick=()=>openCommitmentView();$('backCommitmentMenu').onclick=()=>showOnly('indicatorsMenuView');"
          assert oldc in s;s=s.replace(oldc,newc,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          grep -q 'id="commitmentView"' student.html
          grep -q "student-commitment" student.html
          grep -q "openCommitmentView" student.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git commit -m "Activate student commitment indicator"
          git push
