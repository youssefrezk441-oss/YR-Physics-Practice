name: Verify Live Lesson 2 Homework Assets
on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify-live-assets:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 115 deployed image URLs and SHA256 hashes
        run: python tools/check_l2_live_images.py
