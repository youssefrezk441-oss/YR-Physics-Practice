name: Apply student dashboard patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-student-dashboard.yml"
      - "scripts/patch_student_dashboard.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student page
        run: python scripts/patch_student_dashboard.py
      - name: Commit student page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git diff --cached --quiet && exit 0
          git commit -m "Build student hierarchical dashboard"
          git push
