name: Refine honor podium visuals
on:
  push:
    paths:
      - '.github/workflows/refine-honor-podium.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine honor podium
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          old="function honorInitials(name){const p=String(name||'طالب').trim().split(/\\s+/).filter(Boolean);return ((p[0]?.[0]||'ط')+(p[1]?.[0]||'')).toUpperCase()}"
          new="function honorPodiumSymbol(rank){return rank===1?'👑':rank===2?'★':'◆'}"
          if old not in s: raise SystemExit('honor initials function target missing')
          s=s.replace(old,new,1)
          old="function honorPodiumCard(s,rank){if(!s)return '<div></div>';const medal=rank===1?'🥇':rank===2?'🥈':'🥉';return `<div class=\"podiumCard rank${rank}\"><div class=\"podiumMedal\">${medal}</div><div class=\"podiumAvatar\">${esc(honorInitials(s.full_name))}</div><div class=\"podiumName\">${esc(s.full_name)}</div><div class=\"podiumGroup\">${esc(s.group_code||'')}</div><div class=\"podiumScore\">${honorPct(s.overall)} <small>مؤشر التميز</small></div><div class=\"podiumBadges\">${honorBadges(s.badges)}</div></div>`}"
          new="function honorPodiumCard(s,rank){if(!s)return '<div></div>';const medal=rank===1?'🥇':rank===2?'🥈':'🥉';return `<div class=\"podiumCard rank${rank}\"><div class=\"podiumMedal\">${medal}</div><div class=\"podiumAvatar podiumSymbol\" aria-hidden=\"true\">${honorPodiumSymbol(rank)}</div><div class=\"podiumName\">${esc(s.full_name)}</div><div class=\"podiumGroup\">${esc(s.group_code||'')}</div><div class=\"podiumScore\"><strong>${honorPct(s.overall)}</strong><span>مؤشر التميز</span></div><div class=\"podiumBadges\">${honorBadges(s.badges)}</div></div>`}"
          if old not in s: raise SystemExit('honor podium card target missing')
          s=s.replace(old,new,1)
          css='''\n/* Honor podium visual refinement */\n.honorPodium{gap:16px;padding:12px 6px 6px}\n.podiumCard{padding:17px 14px 14px;min-height:0!important;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}\n.podiumCard.rank1{padding-top:20px;background:radial-gradient(circle at 50% 15%,rgba(246,196,83,.22),transparent 36%),linear-gradient(180deg,#fffaf0,#fff 68%);box-shadow:0 22px 48px rgba(217,155,40,.18)}\n.podiumMedal{font-size:27px;line-height:1;margin-bottom:7px}\n.podiumAvatar{width:70px;height:70px;margin:6px auto 12px;border-width:3px;background:linear-gradient(145deg,#f8fbff,#e4edff)}\n.rank1 .podiumAvatar{width:82px;height:82px;margin-top:7px}\n.podiumSymbol{font-size:31px;line-height:1;color:#183b73;font-family:Arial,sans-serif}\n.rank1 .podiumSymbol{font-size:37px}\n.rank2 .podiumSymbol{color:#667085}.rank3 .podiumSymbol{color:#a65f25}\n.podiumName{min-height:0;font-size:16px;line-height:1.55;margin:0 0 3px}\n.rank1 .podiumName{font-size:18px}\n.podiumGroup{margin:3px 0 9px;font-size:11px}\n.podiumScore{margin:0 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}\n.podiumScore strong{font-size:30px;font-weight:950;letter-spacing:-.5px}\n.rank1 .podiumScore strong{font-size:36px}\n.podiumScore span{display:block;font-size:10px;color:#667085;font-weight:850;margin-top:4px}\n.podiumBadges{margin-top:auto;gap:5px}\n.podiumBadges .honorBadge{font-size:9.5px;padding:4px 7px;background:#fffaf0;border-color:#efd37d}\n.podiumBadges .honorBadge:first-child{background:#f8df91;color:#5f4100;border-color:#e5b83d;font-weight:950}\n.rank1:after{content:'المتصدر';position:absolute;top:12px;right:12px;padding:4px 8px;border-radius:999px;background:#f5c84c;color:#4b3300;font-size:9px;font-weight:950;box-shadow:0 5px 14px rgba(217,155,40,.18)}\nhtml[data-theme=\"dark\"] .podiumCard.rank1{background:radial-gradient(circle at 50% 15%,rgba(246,196,83,.13),transparent 38%),linear-gradient(180deg,#2a2412,#111827 68%)}\nhtml[data-theme=\"dark\"] .podiumAvatar{background:linear-gradient(145deg,#172554,#111827)}\nhtml[data-theme=\"dark\"] .podiumScore span{color:#9ca3af}\n@media(max-width:820px){.honorPodium{gap:10px}.podiumCard{padding:15px 12px}.podiumCard.rank1{order:1}.podiumCard.rank2{order:2}.podiumCard.rank3{order:3}}\n'''
          if '</style>' not in s: raise SystemExit('style close target missing')
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate podium refinement
        run: |
          grep -q 'honorPodiumSymbol' student.html
          grep -q 'Honor podium visual refinement' student.html
          if grep -q 'honorInitials' student.html; then exit 1; fi
      - name: Commit refined podium
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine honor podium and remove Arabic initials'
          git push
