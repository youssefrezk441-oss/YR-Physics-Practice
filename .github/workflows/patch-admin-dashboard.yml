name: One-time admin dashboard patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-admin-dashboard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate patched Pages workflow
        run: python scripts/patch_pages_dashboard.py
      - name: Commit generated workflow file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-dashboard.generated.yml
          git diff --cached --quiet && exit 0
          git commit -m "Generate hierarchical dashboard Pages workflow"
          git push
