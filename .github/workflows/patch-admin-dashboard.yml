name: One-time admin dashboard patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-admin-dashboard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Pages workflow
        run: python scripts/patch_pages_dashboard.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m "Build hierarchical admin dashboard"
          git push
