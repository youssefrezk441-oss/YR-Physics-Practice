name: Consolidate generated source

on:
  pull_request:
    branches: [main]
    paths:
      - '.source-consolidation-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reproduce stable pre-evaluation build steps
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, tempfile

          lines=Path('.github/workflows/pages.yml').read_text(encoding='utf-8').splitlines()
          runs=[]
          i=0
          stop_name='Align student platform indicator with unified score'
          while i < len(lines):
              if lines[i].startswith('      - name: '):
                  name=lines[i][14:].strip()
                  if name==stop_name:
                      break
                  j=i+1
                  script=None
                  while j < len(lines) and not lines[j].startswith('      - name: '):
                      if lines[j].startswith('        run: |'):
                          k=j+1
                          buf=[]
                          while k < len(lines) and not lines[k].startswith('      - name: '):
                              line=lines[k]
                              if line.startswith('          '):
                                  buf.append(line[10:])
                              elif line.strip()=='':
                                  buf.append('')
                              k+=1
                          script='\n'.join(buf).rstrip()+'\n'
                          j=k
                          break
                      j+=1
                  if script is not None:
                      runs.append((name,script))
                  i=max(j,i+1)
              else:
                  i+=1

          for name,script in runs:
              print(f'--- running stable build step: {name}')
              with tempfile.NamedTemporaryFile('w',encoding='utf-8',suffix='.sh',delete=False) as f:
                  f.write('set -euo pipefail\n'+script)
                  path=f.name
              subprocess.run(['bash',path],check=True)
          PY

      - name: Align student platform indicator with unified score
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('student.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('الإكمال محسوب من التدريبات النشطة، وجودة الأداء = مجموع أفضل الدرجات الفعلية ÷ مجموع نهاياتها.','المؤشر الأساسي = مجموع أفضل درجاتك في التدريبات المكتملة ÷ مجموع درجات كل التدريبات النشطة. التدريب غير المكتمل تأثيره صفر.')
          s=s.replace('<span class="small muted">جودة أفضل النتائج</span>','<span class="small muted">مؤشر المنصة</span>',1)
          s=s.replace('<span class="small muted">أفضل نتيجة</span>','<span class="small muted">جودة التدريبات المكتملة</span>',1)
          start=s.index('function renderPlatformIndicators(){')
          end=s.index('function renderSets(){',start)
          newfn="""function renderPlatformIndicators(){const activeSlugs=new Set(sets.map(x=>String(x.slug||''))),activeHistory=history.filter(x=>activeSlugs.has(String(x.slug||''))),completed=activeHistory.filter(x=>x.status!=='in_progress'),graded=activeHistory.filter(x=>x.status==='graded'&&x.percentage!=null),completedSets=new Set(completed.map(x=>String(x.slug||x.title||x.id)));$('attemptsStat').textContent=completed.length;$('completedStat').textContent=completedSets.size;const ratio=sets.length?Math.min(100,Math.round(((completedSets.size/sets.length*100)+1e-9)*10)/10):0;$('completionStat').textContent=(Number.isInteger(ratio)?String(ratio):ratio.toFixed(1))+'%';const bestBySet=new Map;graded.forEach(x=>{const k=String(x.slug||x.title||x.id),v=Number(x.percentage),score=Number(x.score),max=Number(x.max_score);if(!Number.isFinite(v)||!Number.isFinite(score)||!Number.isFinite(max)||max<=0)return;const old=bestBySet.get(k);if(!old||score>old.score||(score===old.score&&v>old.percentage))bestBySet.set(k,{percentage:v,score,max})});const bestValues=[...bestBySet.values()],sumScore=bestValues.reduce((a,x)=>a+x.score,0),sumCompletedMax=bestValues.reduce((a,x)=>a+x.max,0),quality=sumCompletedMax?sumScore/sumCompletedMax*100:null,totalPossible=sets.reduce((a,x)=>{const m=Number(x.max_score);return a+(Number.isFinite(m)&&m>0?m:0)},0),platformScore=totalPossible?sumScore/totalPossible*100:null;$('averageStat').textContent=platformScore==null?'—':(Math.round((platformScore+1e-9)*10)/10).toFixed(1)+'%';$('bestStat').textContent=quality==null?'—':(Math.round((quality+1e-9)*10)/10).toFixed(1)+'%'}
"""
          s=s[:start]+newfn+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build final foundation course evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('student.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<h3>تقييمي قبل الشامل</h3>','<h3>تقييمي في الكورس التأسيسي</h3>')
          s=s.replace('رحلة أدائك قبل الشامل منفصلة عن أي نشاط تم بعده.','نتيجة الشامل ومؤشر الاستعداد وأهم مؤشرات أدائك في الكورس.')
          s=s.replace('<h2>🎓 تقييمي قبل الشامل</h2>','<h2>🎓 تقييمي في الكورس التأسيسي</h2>')
          s=s.replace('صورة أدائك وقت دخول الشامل؛ نشاطك اللاحق لا يغير الماضي.','نتيجة الشامل أولًا، ثم مؤشر الاستعداد وأهم مكونات أدائك في الكورس.')
          s=s.replace('جاري تحميل دورة التقييم...','جاري تحميل تقييم الكورس...')
          s=s.replace('تعذر تحميل تقييم ما قبل الشامل','تعذر تحميل تقييم الكورس التأسيسي')

          css=r'''
          /* Foundation course evaluation v3 */
          .courseEval{display:grid;gap:14px}.courseResultHero{position:relative;overflow:hidden;text-align:center;padding:30px 20px;border:0;background:radial-gradient(circle at 18% 8%,rgba(255,211,90,.16),transparent 32%),linear-gradient(135deg,#06162f,#000073);color:#fff}.courseResultHero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(255,255,255,.08);border-radius:50%;left:-80px;bottom:-110px}.courseResultLabel{font-size:13px;color:#dbe7ff;font-weight:800}.courseResultScore{font-size:58px;font-weight:950;line-height:1;margin:10px 0 7px;letter-spacing:-1px}.courseResultPct{font-size:30px;font-weight:950;color:#f6c453}.courseResultName{font-size:12px;color:#aebfe8;margin-top:8px}.courseReadinessCard{padding:21px;border:1px solid #c7d2fe;background:linear-gradient(135deg,#f8faff,#eef2ff)}.courseReadinessTop{display:flex;align-items:center;justify-content:space-between;gap:16px}.courseReadinessTitle{font-weight:950;color:#000073}.courseReadinessValue{font-size:43px;font-weight:950;color:#000073;line-height:1}.courseQuizStrip{margin-top:15px;padding-top:13px;border-top:1px solid #dbe4ff;display:flex;align-items:center;justify-content:space-between;gap:12px}.courseQuizStrip b{font-size:18px}.courseQuizStrip span{font-size:12px;color:#667085}.courseMetricGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.courseMetricCard{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px}.courseMetricCard .courseMetricIcon{font-size:23px}.courseMetricCard .courseMetricTitle{font-size:12px;color:#667085;margin-top:6px}.courseMetricCard .courseMetricValue{font-size:29px;font-weight:950;margin:6px 0}.courseMetricCard .courseMetricDetail{font-size:12px;line-height:1.7;color:#667085}.courseCompare{padding:20px;border-radius:18px;border:1px solid var(--cmp-border,#bfdbfe);background:var(--cmp-bg,#eff6ff)}.courseCompareTop{display:flex;align-items:center;gap:13px}.courseCompareIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:27px;background:#fff;border:1px solid rgba(0,0,0,.06);flex:0 0 auto}.courseCompare h3{margin:0 0 4px;font-size:20px}.courseCompareDiff{font-size:12px;color:#667085}.courseReasons{margin-top:14px;padding-top:13px;border-top:1px solid rgba(100,116,139,.18)}.courseReasons b{display:block;margin-bottom:6px}.courseReasons ul{margin:0;padding-right:20px;line-height:1.8;color:#475467}.courseTeacherNote{margin-top:12px;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid rgba(0,0,0,.07);font-weight:850}.coursePending{padding:28px;text-align:center}.coursePending .big{font-size:48px;margin-bottom:8px}
          html[data-theme="dark"] .courseReadinessCard{background:linear-gradient(135deg,#111c3b,#101827);border-color:#314a7d}html[data-theme="dark"] .courseReadinessTitle,html[data-theme="dark"] .courseReadinessValue{color:#c7d2fe}html[data-theme="dark"] .courseQuizStrip{border-color:#334155}html[data-theme="dark"] .courseQuizStrip span,html[data-theme="dark"] .courseMetricCard .courseMetricTitle,html[data-theme="dark"] .courseMetricCard .courseMetricDetail,html[data-theme="dark"] .courseCompareDiff{color:#9ca3af}html[data-theme="dark"] .courseMetricCard{background:#111827;border-color:#334155}html[data-theme="dark"] .courseCompare{background:#111827!important;border-color:#334155!important}html[data-theme="dark"] .courseCompareIcon,html[data-theme="dark"] .courseTeacherNote{background:#0f172a;border-color:#334155}html[data-theme="dark"] .courseReasons ul{color:#cbd5e1}
          @media(max-width:700px){.courseResultScore{font-size:49px}.courseResultPct{font-size:26px}.courseReadinessTop{align-items:flex-start;flex-direction:column}.courseQuizStrip{align-items:flex-start;flex-direction:column}.courseMetricGrid{grid-template-columns:1fr}.courseMetricCard .courseMetricValue{font-size:27px}}
          '''
          s=s.replace('</style>',css+'\n</style>',1)

          block=r'''function courseNum(v){const n=Number(v);return Number.isFinite(n)?n:null}
          function coursePct(v){const n=courseNum(v);if(n==null)return'—';const x=Math.round((n+1e-9)*10)/10;return x.toFixed(x%1?1:0)+'%'}
          function courseScoreText(score,max,status){if(status==='absent')return '0 / '+Number(max||0)+' — غياب';if(status!=='scored')return 'لم تُعلن بعد';return Number(score||0)+' / '+Number(max||0)}
          function courseCompPct(comp){if(comp?.status==='absent')return 0;const s=courseNum(comp?.score),m=courseNum(comp?.max_score);return comp?.status==='scored'&&m>0?Math.round((s/m*100+1e-9)*10)/10:null}
          function courseCompare(compPct,readiness,p){
            if(compPct==null||readiness==null)return{kind:'neutral',icon:'➖',title:'المقارنة غير متاحة بعد',diff:null,reasons:['سيظهر الفرق بين الشامل والاستعداد بمجرد اكتمال البيانات.'],consult:false,prompt:''};
            const diff=Math.round((compPct-readiness+1e-9)*10)/10,ad=Math.abs(diff),platform=courseNum(p.platform?.score),platformWeight=.30,reasons=[];
            if(ad<=10)return{kind:'match',icon:'✅',title:'الفرق طبيعي ومتوافق مع درجة الاستعداد',diff,reasons:['فرق يصل إلى 10 نقاط مئوية أعلى أو أقل يُعتبر طبيعيًا بين مؤشر الاستعداد ونتيجة امتحان واحد.'],consult:false,prompt:''};
            if(diff>10){
              const platformEffect=platform==null?null:(compPct-platform)*platformWeight;
              const platformLikely=platformEffect!=null&&platformEffect>=Math.max(4,ad*.40);
              if(platformLikely){
                reasons.push('مؤشر تدريبات المنصة كان '+coursePct(platform)+' مقابل '+coursePct(compPct)+' في الشامل، وده غالبًا خفّض درجة الاستعداد عن المستوى اللي ظهر في الامتحان.');
                return{kind:'up',icon:'📈',title:'نتيجة الشامل أعلى من درجة الاستعداد بوضوح',diff,reasons,consult:false,prompt:''};
              }
              reasons.push('الفرق كبير، لكن مؤشر تدريبات المنصة لا يفسّره بشكل كافٍ من البيانات المسجلة.');
              return{kind:'up',icon:'📈',title:'نتيجة الشامل أعلى من درجة الاستعداد بوضوح',diff,reasons,consult:true,prompt:'💬 تواصل مع مستر يوسف وقوله: أنا شايف إن نتيجتي في الشامل أعلى من المتوقع بكتير، إيه أفضل حاجة شايف إنها أدت للنتيجة غير المتوقعة دي؟'};
            }
            const platformEffect=platform==null?null:(platform-compPct)*platformWeight;
            const platformLikely=platformEffect!=null&&platformEffect>=Math.max(4,ad*.40);
            if(platformLikely){
              reasons.push('مؤشر تدريبات المنصة كان '+coursePct(platform)+' مقابل '+coursePct(compPct)+' في الشامل، وده غالبًا رفع درجة الاستعداد عن المستوى اللي ظهر في الامتحان.');
              return{kind:'down',icon:'📉',title:'نتيجة الشامل أقل من درجة الاستعداد بوضوح',diff,reasons,consult:false,prompt:''};
            }
            reasons.push('الفرق كبير، لكن مؤشر تدريبات المنصة لا يفسّره بشكل كافٍ من البيانات المسجلة.');
            return{kind:'down',icon:'📉',title:'نتيجة الشامل أقل من درجة الاستعداد بوضوح',diff,reasons,consult:true,prompt:'⚠️ تواصل مع مستر يوسف ضروري وقوله: أنا شايف إن نتيجتي في الشامل أقل من المتوقع بكتير، إيه أكتر مشكلة ممكن تكون قابلتني وأدت للنتيجة غير المتوقعة دي؟'};
          }
          function courseCompareStyle(kind){if(kind==='up')return'--cmp-bg:#eff6ff;--cmp-border:#93c5fd';if(kind==='down')return'--cmp-bg:#fff1f2;--cmp-border:#fecdd3';if(kind==='match')return'--cmp-bg:#ecfdf3;--cmp-border:#a7f3d0';return'--cmp-bg:#f8fafc;--cmp-border:#e4e7ec'}
          function renderAssessmentCycle(d){
            const box=$('assessmentBody');if(!box)return;if(!d.cycle){box.innerHTML='<div class="card coursePending"><div class="big">📭</div><b>لا يوجد تقييم متاح للكورس حاليًا.</b></div>';return}
            const p=d.pre_comprehensive||{},a=p.attendance||{},h=p.homework||{},q=p.quizzes||{},pl=p.platform||{},comp=(d.comprehensive||[])[0]||{},status=comp.status||'not_entered';
            const compPct=courseCompPct(comp),readiness=courseNum(p.readiness_score),cmp=courseCompare(compPct,readiness,p),diffText=cmp.diff==null?'—':(cmp.diff>0?'+':'')+cmp.diff+' نقطة',result=status==='scored'||status==='absent';
            const examName=comp.test_name||comp.title||'الامتحان الشامل على الكورس التأسيسي';
            const attendanceTotal=Number(a.present||0)+Number(a.absent||0),attendanceDetail=Number(a.present||0)+' حضور من '+attendanceTotal+' حصة';
            const homeworkDetail=Number(h.done||0)+' كامل · '+Number(h.partial||0)+' ناقص · '+Number(h.not_submitted||0)+' لم يسلم';
            const quizScore=q.possible_score?Number(q.earned_score||0)+' / '+Number(q.possible_score):'لا توجد درجات كافية';
            const platformDetail=Number(pl.completed_trainings||0)+' من '+Number(pl.available_trainings||0)+' تدريب مكتمل',platformQuality=pl.quality_ratio==null?'—':coursePct(pl.quality_ratio);
            box.innerHTML=`<div class="courseEval">
              <div class="card courseResultHero"><div class="courseResultLabel">🏆 نتيجة الامتحان الشامل</div><div class="courseResultScore">${esc(courseScoreText(comp.score,comp.max_score,status))}</div><div class="courseResultPct">${result?coursePct(compPct):'بانتظار الإعلان'}</div><div class="courseResultName">${esc(examName)}</div></div>
              <div class="card courseReadinessCard"><div class="courseReadinessTop"><div><div class="courseReadinessTitle">🎯 درجة الاستعداد قبل الشامل</div><div class="courseReadinessValue">${coursePct(readiness)}</div></div></div><div class="courseQuizStrip"><div><b>🧪 الكويزات ${coursePct(q.score_ratio)}</b></div><span>${esc(quizScore)} درجة</span></div></div>
              <div class="courseMetricGrid">
                <div class="courseMetricCard"><div class="courseMetricIcon">📅</div><div class="courseMetricTitle">الحضور</div><div class="courseMetricValue">${coursePct(a.rate)}</div><div class="courseMetricDetail">${esc(attendanceDetail)}</div></div>
                <div class="courseMetricCard"><div class="courseMetricIcon">📚</div><div class="courseMetricTitle">الواجب</div><div class="courseMetricValue">${coursePct(h.rate)}</div><div class="courseMetricDetail">${esc(homeworkDetail)}</div></div>
                <div class="courseMetricCard"><div class="courseMetricIcon">🚀</div><div class="courseMetricTitle">تدريبات المنصة</div><div class="courseMetricValue">${coursePct(pl.score)}</div><div class="courseMetricDetail">${esc(platformDetail)}<br>جودة الأداء ${platformQuality}</div></div>
              </div>
              <div class="courseCompare" style="${courseCompareStyle(cmp.kind)}"><div class="courseCompareTop"><div class="courseCompareIcon">${cmp.icon}</div><div><h3>${esc(cmp.title)}</h3><div class="courseCompareDiff">الفرق بين نسبة الشامل والاستعداد: ${esc(diffText)}</div></div></div><div class="courseReasons"><b>قراءة محتملة للنتيجة</b><ul>${cmp.reasons.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>${cmp.consult?'<div class="courseTeacherNote">'+esc(cmp.prompt||'')+'</div>':''}</div></div>
            </div>`;
          }
          async function openAssessmentCycleView(){clearMsg();showOnly('assessmentCycleView');$('assessmentLoading').innerHTML='<div class="empty">جاري تحميل تقييم الكورس...</div>';$('assessmentLoading').classList.remove('hidden');$('assessmentBody').classList.add('hidden');try{const d=await assessmentCycleFn();renderAssessmentCycle(d);$('assessmentLoading').classList.add('hidden');$('assessmentBody').classList.remove('hidden')}catch(e){$('assessmentLoading').innerHTML='<div class="msg err">'+esc(e.message||'تعذر تحميل تقييم الكورس التأسيسي')+'</div>'}}
          '''
          pattern=re.compile(r"function renderAssessmentCycle\(d\)\{.*?(?=function renderClassTests\(d\)\{)",re.S)
          if not pattern.search(s):
              raise SystemExit('assessment function block not found')
          s=pattern.sub(block+'\n',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate consolidated student JavaScript
        run: |
          python - <<'PY'
          import re
          s=open('student.html',encoding='utf-8').read()
          blocks=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('no student module script found')
          open('/tmp/student-consolidated.mjs','w',encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/student-consolidated.mjs

      - name: Commit consolidated files to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C consolidated-source-output
          git add student.html reviews-admin.html index.html content-admin.html sessions-admin.html
          echo 'Consolidated source changes:'
          git status --short
          if git diff --cached --quiet; then
            echo 'No source changes generated.'
            exit 1
          fi
          git commit -m "Consolidate generated Pages output into source files"
          git push --force origin consolidated-source-output
