name: Patch Lecture 3 Workshop Button
on:
  push:
    paths:
      - '.github/workflows/patch-lecture3-workshop-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student workshop button
        run: python tools/patch_lecture3_workshop_button.py
      - name: Commit changes
        run: |
          if git diff --quiet -- student.html; then
            echo "No student.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git commit -m "Add Lecture 3 workshop button for third secondary"
          git push
