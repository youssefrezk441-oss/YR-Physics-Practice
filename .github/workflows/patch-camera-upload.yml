name: Fix mobile handwritten image saving

on:
  push:
    paths:
      - '.github/workflows/patch-camera-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student image upload
        run: python .github/scripts/fix_mobile_answer_images.py
      - name: Verify patch
        run: |
          for f in student-base.html student.html; do
            grep -q 'answerCameraBtn' "$f"
            grep -q 'answerGalleryBtn' "$f"
            grep -q 'answerImageNativeInput' "$f"
            grep -q '✅ تم الحفظ' "$f"
            grep -q 'createSignedUrl(path,3600)' "$f"
            grep -q 'input.click()' "$f"
            grep -q 'function answerImageDataUrl(file)' "$f"
            grep -q 'readAsDataURL' "$f"
            ! grep -q 'URL.createObjectURL' "$f"
            ! grep -q 'URL.revokeObjectURL' "$f"
          done
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student-base.html student.html
          git commit -m 'Fix mobile image loading with FileReader'
          git push
