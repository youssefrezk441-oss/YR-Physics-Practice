name: Fix mobile handwritten image saving

on:
  push:
    paths:
      - '.github/workflows/patch-camera-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student image upload
        run: python .github/scripts/fix_mobile_answer_images.py
      - name: Verify patch
        run: |
          grep -q 'answerCameraBtn' student-base.html
          grep -q 'answerGalleryBtn' student-base.html
          grep -q 'answerImageNativeInput' student-base.html
          grep -q '✅ تم الحفظ' student-base.html
          grep -q 'createSignedUrl(path,3600)' student-base.html
          grep -q 'input.click()' student-base.html
          grep -q 'function answerImageDataUrl(file)' student-base.html
          grep -q 'readAsDataURL' student-base.html
          ! grep -q 'URL.createObjectURL' student-base.html
          ! grep -q 'URL.revokeObjectURL' student-base.html
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student-base.html
          git commit -m 'Fix mobile image loading with FileReader'
          git push
