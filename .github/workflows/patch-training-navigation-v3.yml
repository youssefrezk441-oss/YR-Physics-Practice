name: Patch training navigation v3

on:
  push:
    paths:
      - '.patch-training-nav-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student training navigation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('student.html')
          s = p.read_text(encoding='utf-8')

          old_html = '''<section id="trainingMenuView" class="hidden"><div class="studentSubHead"><div><h2>📝 التدريبات</h2><p class="sectionIntro">اختر الكورس الذي تريد التدريب عليه.</p></div><button class="btn secondary studentBack" data-go-home>العودة للرئيسية</button></div><div class="studentSubGrid"><button id="openChapterTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">⚡</div><h3>تدريبات الفصل الأول</h3><p>تدريبات كهربية الفصل الأول للصف الثالث الثانوي.</p></button><button id="openFoundationTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">🧰</div><h3>تدريبات الكورس التأسيسي</h3><p>كل تدريبات الكورس التأسيسي في مكان واحد.</p></button><button id="openCompleted" class="card studentNavCard" type="button"><div class="studentNavIcon">✅</div><h3>التدريبات المكتملة</h3><p>راجع محاولاتك السابقة ونتائجك وتصحيحها.</p></button></div></section>'''
          new_html = '''<section id="trainingMenuView" class="hidden"><div class="studentSubHead"><div><h2>📝 التدريبات</h2><p class="sectionIntro">اختر ما تريد عرضه.</p></div><button class="btn secondary studentBack" data-go-home>العودة للرئيسية</button></div><div class="studentSubGrid two"><button id="openAvailable" class="card studentNavCard" type="button"><div class="studentNavIcon">🚀</div><h3>التدريبات المتاحة</h3><p>ابدأ تدريبًا جديدًا من التدريبات المتاحة لك.</p></button><button id="openCompleted" class="card studentNavCard" type="button"><div class="studentNavIcon">✅</div><h3>التدريبات المكتملة</h3><p>راجع محاولاتك السابقة ونتائجك وتصحيحها.</p></button></div></section>
<section id="trainingCoursesView" class="hidden"><div class="studentSubHead"><div><h2>🚀 التدريبات المتاحة</h2><p class="sectionIntro">اختر الكورس الذي تريد التدريب عليه.</p></div><button id="backTrainingCourses" class="btn secondary studentBack">العودة للتدريبات</button></div><div class="studentSubGrid two"><button id="openFoundationTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">🧰</div><h3>تدريبات الكورس التأسيسي</h3><p>كل تدريبات الكورس التأسيسي في مكان واحد.</p></button><button id="openChapterTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">⚡</div><h3>تدريبات الفصل الأول</h3><p>تدريبات كهربية الفصل الأول للصف الثالث الثانوي.</p></button></div></section>'''
          if old_html not in s:
              raise SystemExit('trainingMenuView block not found')
          s = s.replace(old_html, new_html, 1)

          old_views = "const STUDENT_VIEWS=['loginView','dashboardView','trainingMenuView','indicatorsMenuView','availableTrainingsView','completedTrainingsView','platformIndicatorsView','commitmentView','classTestsView','assessmentCycleView','honorView','comingSoonView','practiceView','resultView','reviewView'];"
          new_views = "const STUDENT_VIEWS=['loginView','dashboardView','trainingMenuView','trainingCoursesView','indicatorsMenuView','availableTrainingsView','completedTrainingsView','platformIndicatorsView','commitmentView','classTestsView','assessmentCycleView','honorView','comingSoonView','practiceView','resultView','reviewView'];"
          if old_views not in s:
              raise SystemExit('STUDENT_VIEWS not found')
          s = s.replace(old_views, new_views, 1)

          old_handlers = "let soonReturnView='dashboardView';function openSoon(title,text,back='dashboardView'){$('soonTitle').textContent=title;$('soonText').textContent=text;soonReturnView=back;showOnly('comingSoonView')}$('openTrainings').onclick=()=>showOnly('trainingMenuView');$('openIndicators').onclick=()=>showOnly('indicatorsMenuView');$('openHonor').onclick=()=>openHonorView();$('honorBackBtn').onclick=()=>showOnly('dashboardView');document.querySelectorAll('[data-honor-grade]').forEach(b=>b.onclick=()=>renderHonorGrade(b.dataset.honorGrade));document.querySelectorAll('[data-go-home]').forEach(b=>b.onclick=()=>showOnly('dashboardView'));function openCourseTrainings(slug,title,icon){selectedTrainingCourse=slug;$('availableTrainingsTitle').textContent=(icon||'📘')+' '+title;$('availableTrainingsIntro').textContent='أحدث تدريبات الكورس تظهر أولًا.';renderSets();showOnly('availableTrainingsView')}$('openChapterTrainings').onclick=()=>openCourseTrainings('third-secondary-electricity-chapter-1','تدريبات الفصل الأول','⚡');$('openFoundationTrainings').onclick=()=>openCourseTrainings('foundation-physics','تدريبات الكورس التأسيسي','🧰');$('openCompleted').onclick=()=>showOnly('completedTrainingsView');$('backTrainingMenu1').onclick=()=>{selectedTrainingCourse=null;showOnly('trainingMenuView')};$('backTrainingMenu2').onclick=()=>showOnly('trainingMenuView');"
          new_handlers = "let soonReturnView='dashboardView';function openSoon(title,text,back='dashboardView'){$('soonTitle').textContent=title;$('soonText').textContent=text;soonReturnView=back;showOnly('comingSoonView')}$('openTrainings').onclick=()=>showOnly('trainingMenuView');$('openIndicators').onclick=()=>showOnly('indicatorsMenuView');$('openHonor').onclick=()=>openHonorView();$('honorBackBtn').onclick=()=>showOnly('dashboardView');document.querySelectorAll('[data-honor-grade]').forEach(b=>b.onclick=()=>renderHonorGrade(b.dataset.honorGrade));document.querySelectorAll('[data-go-home]').forEach(b=>b.onclick=()=>showOnly('dashboardView'));function updateTrainingCourseButtons(){const foundation=$('openFoundationTrainings'),chapter=$('openChapterTrainings');if(foundation)foundation.classList.toggle('hidden',!sets.some(s=>String(s.course_slug||'')==='foundation-physics'));if(chapter)chapter.classList.toggle('hidden',!sets.some(s=>String(s.course_slug||'')==='third-secondary-electricity-chapter-1'))}function openCourseTrainings(slug,title,icon){selectedTrainingCourse=slug;$('availableTrainingsTitle').textContent=(icon||'📘')+' '+title;$('availableTrainingsIntro').textContent='أحدث تدريبات الكورس تظهر أولًا.';renderSets();showOnly('availableTrainingsView')}$('openAvailable').onclick=()=>{selectedTrainingCourse=null;updateTrainingCourseButtons();showOnly('trainingCoursesView')};$('openChapterTrainings').onclick=()=>openCourseTrainings('third-secondary-electricity-chapter-1','تدريبات الفصل الأول','⚡');$('openFoundationTrainings').onclick=()=>openCourseTrainings('foundation-physics','تدريبات الكورس التأسيسي','🧰');$('openCompleted').onclick=()=>showOnly('completedTrainingsView');$('backTrainingCourses').onclick=()=>{selectedTrainingCourse=null;showOnly('trainingMenuView')};$('backTrainingMenu1').onclick=()=>{selectedTrainingCourse=null;updateTrainingCourseButtons();showOnly('trainingCoursesView')};$('backTrainingMenu2').onclick=()=>showOnly('trainingMenuView');"
          if old_handlers not in s:
              raise SystemExit('training handlers block not found')
          s = s.replace(old_handlers, new_handlers, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix training menu nesting and third-secondary visibility"
          git push