name: Verify Lesson 2 Paper Homework
on:
  pull_request:
    paths:
      - "lesson2-book-homework.html"
      - "student.html"
      - "student-base.html"
      - "student-workspace-navigation-v1.js"
      - "tools/tests/l2-workspace-visibility.test.mjs"
      - "student-ch2-mistakes.js"
      - "tools/tests/lesson2-mistake-transfer.test.mjs"
      - "lecture1-homework.js"
      - "tools/tests/lesson2-book-homework-gate.test.mjs"
      - "tools/tests/lesson2-public-assets.test.mjs"
      - "workshops/third-secondary-term-2-lesson-2-book-homework/**"
      - "assets/workshops/ch2-l2-book-homework/**"
      - ".github/workflows/ch2-l2-paper-homework-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lesson2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify authenticated launcher, UI contract, and key separation
        run: node --test tools/tests/lesson2-book-homework-gate.test.mjs tools/tests/lesson2-public-assets.test.mjs tools/tests/lesson2-mistake-transfer.test.mjs
      - name: Browser E2E of the actual published student workspace navigation
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          export CHROMIUM_PATH="$(node -e "const{chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          node --test tools/tests/l2-workspace-visibility.test.mjs

