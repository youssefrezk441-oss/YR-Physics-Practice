name: Foundation evaluation redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/foundation-eval-v3.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redesign foundation course evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('student.html')
          s=p.read_text(encoding='utf-8')

          # Keep the entry point simple and student-focused.
          s=s.replace('<h3>تقييمي قبل الشامل</h3>','<h3>تقييمي في الكورس التأسيسي</h3>')
          s=s.replace('رحلة أدائك قبل الشامل منفصلة عن أي نشاط تم بعده.','نتيجة الشامل ومؤشر الاستعداد وأهم مؤشرات أدائك في الكورس.')
          s=s.replace('<h2>🎓 تقييمي قبل الشامل</h2>','<h2>🎓 تقييمي في الكورس التأسيسي</h2>')
          s=s.replace('صورة أدائك وقت دخول الشامل؛ نشاطك اللاحق لا يغير الماضي.','نتيجة الشامل أولًا، ثم مؤشر الاستعداد وأهم مكونات أدائك في الكورس.')
          s=s.replace('جاري تحميل دورة التقييم...','جاري تحميل تقييم الكورس...')
          s=s.replace('تعذر تحميل تقييم ما قبل الشامل','تعذر تحميل تقييم الكورس التأسيسي')

          css=r'''
/* Foundation course evaluation v3 */
.courseEval{display:grid;gap:14px}.courseResultHero{position:relative;overflow:hidden;text-align:center;padding:30px 20px;border:0;background:radial-gradient(circle at 18% 8%,rgba(255,211,90,.16),transparent 32%),linear-gradient(135deg,#06162f,#000073);color:#fff}.courseResultHero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(255,255,255,.08);border-radius:50%;left:-80px;bottom:-110px}.courseResultLabel{font-size:13px;color:#dbe7ff;font-weight:800}.courseResultScore{font-size:58px;font-weight:950;line-height:1;margin:10px 0 7px;letter-spacing:-1px}.courseResultPct{font-size:30px;font-weight:950;color:#f6c453}.courseResultName{font-size:12px;color:#aebfe8;margin-top:8px}.courseReadinessCard{padding:21px;border:1px solid #c7d2fe;background:linear-gradient(135deg,#f8faff,#eef2ff)}.courseReadinessTop{display:flex;align-items:center;justify-content:space-between;gap:16px}.courseReadinessTitle{font-weight:950;color:#000073}.courseReadinessValue{font-size:43px;font-weight:950;color:#000073;line-height:1}.courseQuizStrip{margin-top:15px;padding-top:13px;border-top:1px solid #dbe4ff;display:flex;align-items:center;justify-content:space-between;gap:12px}.courseQuizStrip b{font-size:18px}.courseQuizStrip span{font-size:12px;color:#667085}.courseMetricGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.courseMetricCard{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px}.courseMetricCard .courseMetricIcon{font-size:23px}.courseMetricCard .courseMetricTitle{font-size:12px;color:#667085;margin-top:6px}.courseMetricCard .courseMetricValue{font-size:29px;font-weight:950;margin:6px 0}.courseMetricCard .courseMetricDetail{font-size:12px;line-height:1.7;color:#667085}.courseCompare{padding:20px;border-radius:18px;border:1px solid var(--cmp-border,#bfdbfe);background:var(--cmp-bg,#eff6ff)}.courseCompareTop{display:flex;align-items:center;gap:13px}.courseCompareIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:27px;background:#fff;border:1px solid rgba(0,0,0,.06);flex:0 0 auto}.courseCompare h3{margin:0 0 4px;font-size:20px}.courseCompareDiff{font-size:12px;color:#667085}.courseReasons{margin-top:14px;padding-top:13px;border-top:1px solid rgba(100,116,139,.18)}.courseReasons b{display:block;margin-bottom:6px}.courseReasons ul{margin:0;padding-right:20px;line-height:1.8;color:#475467}.courseTeacherNote{margin-top:12px;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid rgba(0,0,0,.07);font-weight:850}.coursePending{padding:28px;text-align:center}.coursePending .big{font-size:48px;margin-bottom:8px}
html[data-theme="dark"] .courseReadinessCard{background:linear-gradient(135deg,#111c3b,#101827);border-color:#314a7d}html[data-theme="dark"] .courseReadinessTitle,html[data-theme="dark"] .courseReadinessValue{color:#c7d2fe}html[data-theme="dark"] .courseQuizStrip{border-color:#334155}html[data-theme="dark"] .courseQuizStrip span,html[data-theme="dark"] .courseMetricCard .courseMetricTitle,html[data-theme="dark"] .courseMetricCard .courseMetricDetail,html[data-theme="dark"] .courseCompareDiff{color:#9ca3af}html[data-theme="dark"] .courseMetricCard{background:#111827;border-color:#334155}html[data-theme="dark"] .courseCompare{background:#111827!important;border-color:#334155!important}html[data-theme="dark"] .courseCompareIcon,html[data-theme="dark"] .courseTeacherNote{background:#0f172a;border-color:#334155}html[data-theme="dark"] .courseReasons ul{color:#cbd5e1}
@media(max-width:700px){.courseResultScore{font-size:49px}.courseResultPct{font-size:26px}.courseReadinessTop{align-items:flex-start;flex-direction:column}.courseQuizStrip{align-items:flex-start;flex-direction:column}.courseMetricGrid{grid-template-columns:1fr}.courseMetricCard .courseMetricValue{font-size:27px}}
'''
          if '/* Foundation course evaluation v3 */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          block=r'''function courseNum(v){const n=Number(v);return Number.isFinite(n)?n:null}
function coursePct(v){const n=courseNum(v);return n==null?'—':(Math.round((n+1e-9)*10)/10).toFixed((Math.round((n+1e-9)*10)/10)%1?1:0)+'%'}
function courseScoreText(score,max,status){if(status==='absent')return '0 / '+Number(max||0)+' — غياب';if(status!=='scored')return 'لم تُعلن بعد';return Number(score||0)+' / '+Number(max||0)}
function courseCompPct(comp){if(comp?.status==='absent')return 0;const s=courseNum(comp?.score),m=courseNum(comp?.max_score);return comp?.status==='scored'&&m>0?Math.round((s/m*100+1e-9)*10)/10:null}
function courseCompare(compPct,readiness,p){
  if(compPct==null||readiness==null)return{kind:'neutral',icon:'➖',title:'المقارنة غير متاحة بعد',diff:null,reasons:['سيظهر الفرق بين الشامل والاستعداد بمجرد اكتمال البيانات.'],consult:false};
  const diff=Math.round((compPct-readiness+1e-9)*10)/10,ad=Math.abs(diff),q=courseNum(p.quizzes?.score_ratio),pq=courseNum(p.platform?.quality_ratio),att=courseNum(p.attendance?.rate),hw=courseNum(p.homework?.rate),reasons=[];
  if(ad<=5)return{kind:'match',icon:'✅',title:'نتيجة الشامل متوافقة مع درجة الاستعداد',diff,reasons:['الفرق بسيط، ونتيجة الامتحان قريبة من المستوى الذي كانت تشير إليه بيانات الكورس.'],consult:false};
  if(diff>5){
    if(q!=null&&compPct-q>=8)reasons.push('نتيجة الشامل أعلى بوضوح من مستوى الكويزات؛ قد يكون حصل تحسن قوي مع المراجعة النهائية أو أداء أفضل يوم الامتحان.');
    if(pq!=null&&compPct-pq>=8)reasons.push('نتيجة الشامل أعلى من جودة تدريبات المنصة؛ قد يكون تركيزك وتنفيذك في الامتحان كانا أفضل من التدريبات السابقة.');
    if(!reasons.length)reasons.push('بيانات المنصة لا تُظهر سببًا مباشرًا للتفوق غير المتوقع؛ قد تكون المراجعة النهائية أو أداء يوم الامتحان أحدثا الفرق.');
    return{kind:'up',icon:'📈',title:'نتيجة الشامل أعلى من درجة الاستعداد',diff,reasons:reasons.slice(0,2),consult:true};
  }
  if(q!=null&&q-compPct>=8)reasons.push('مستوى الكويزات كان أعلى من نتيجة الشامل؛ الانخفاض ظهر بشكل أساسي في الامتحان الشامل نفسه.');
  if(pq!=null&&pq-compPct>=8)reasons.push('جودة تدريبات المنصة كانت أعلى من نتيجة الشامل؛ قد يكون هناك فرق بين الأداء أثناء التدريب والتنفيذ داخل الامتحان.');
  const academic=[q,pq].filter(x=>x!=null);const acad=academic.length?academic.reduce((a,b)=>a+b,0)/academic.length:null;
  if(att!=null&&hw!=null&&att>=90&&hw>=90&&acad!=null&&Math.abs(acad-compPct)+3<Math.abs(readiness-compPct))reasons.push('الحضور والواجب المرتفعان ساهما في رفع درجة الاستعداد، بينما مؤشرات الأداء الأكاديمي أقرب لنتيجة الشامل.');
  if(!reasons.length)reasons.push('مؤشرات ما قبل الشامل كانت أعلى، لكن البيانات لا تسجل سبب الانخفاض مباشرة؛ قد يرتبط بإدارة الوقت أو التركيز أو أخطاء في التنفيذ داخل الامتحان.');
  return{kind:'down',icon:'📉',title:'نتيجة الشامل أقل من درجة الاستعداد',diff,reasons:reasons.slice(0,2),consult:true};
}
function courseCompareStyle(kind){if(kind==='up')return'--cmp-bg:#eff6ff;--cmp-border:#93c5fd';if(kind==='down')return'--cmp-bg:#fff1f2;--cmp-border:#fecdd3';if(kind==='match')return'--cmp-bg:#ecfdf3;--cmp-border:#a7f3d0';return'--cmp-bg:#f8fafc;--cmp-border:#e4e7ec'}
function renderAssessmentCycle(d){
  const box=$('assessmentBody');if(!box)return;if(!d.cycle){box.innerHTML='<div class="card coursePending"><div class="big">📭</div><b>لا يوجد تقييم متاح للكورس حاليًا.</b></div>';return}
  const p=d.pre_comprehensive||{},a=p.attendance||{},h=p.homework||{},q=p.quizzes||{},pl=p.platform||{},comp=(d.comprehensive||[])[0]||{},status=comp.status||'not_entered';
  const compPct=courseCompPct(comp),readiness=courseNum(p.readiness_score),cmp=courseCompare(compPct,readiness,p),diffText=cmp.diff==null?'—':(cmp.diff>0?'+':'')+cmp.diff+' نقطة';
  const result=status==='scored'||status==='absent';
  const examName=comp.test_name||comp.title||'الامتحان الشامل على الكورس التأسيسي';
  const attendanceDetail=(a.present||0)+' حضور من '+((a.present||0)+(a.absent||0))+' حصة';
  const homeworkDetail=(h.done||0)+' كامل · '+(h.partial||0)+' ناقص · '+(h.not_submitted||0)+' لم يسلم';
  const quizScore=q.possible_score?Number(q.earned_score||0)+' / '+Number(q.possible_score):'لا توجد درجات كافية';
  const platformDetail=(pl.completed_trainings||0)+' من '+(pl.available_trainings||0)+' تدريب مكتمل';
  const platformQuality=pl.quality_ratio==null?'—':coursePct(pl.quality_ratio);
  const platformCompletion=pl.completion_rate==null?'—':coursePct(pl.completion_rate);
  box.innerHTML=`<div class="courseEval">
    <div class="card courseResultHero"><div class="courseResultLabel">🏆 نتيجة الامتحان الشامل</div><div class="courseResultScore">${esc(courseScoreText(comp.score,comp.max_score,status))}</div><div class="courseResultPct">${result?coursePct(compPct):'بانتظار الإعلان'}</div><div class="courseResultName">${esc(examName)}</div></div>
    <div class="card courseReadinessCard"><div class="courseReadinessTop"><div><div class="courseReadinessTitle">🎯 درجة الاستعداد قبل الشامل</div><div class="courseReadinessValue">${coursePct(readiness)}</div></div></div><div class="courseQuizStrip"><div><b>🧪 الكويزات ${coursePct(q.score_ratio)}</b></div><span>${esc(quizScore)} درجة</span></div></div>
    <div class="courseMetricGrid">
      <div class="courseMetricCard"><div class="courseMetricIcon">📅</div><div class="courseMetricTitle">الحضور</div><div class="courseMetricValue">${coursePct(a.rate)}</div><div class="courseMetricDetail">${esc(attendanceDetail)}</div></div>
      <div class="courseMetricCard"><div class="courseMetricIcon">📚</div><div class="courseMetricTitle">الواجب</div><div class="courseMetricValue">${coursePct(h.rate)}</div><div class="courseMetricDetail">${esc(homeworkDetail)}</div></div>
      <div class="courseMetricCard"><div class="courseMetricIcon">🚀</div><div class="courseMetricTitle">تدريبات المنصة</div><div class="courseMetricValue">${coursePct(pl.score)}</div><div class="courseMetricDetail">${esc(platformDetail)}<br>الإكمال ${platformCompletion} · الجودة ${platformQuality}</div></div>
    </div>
    <div class="courseCompare" style="${courseCompareStyle(cmp.kind)}"><div class="courseCompareTop"><div class="courseCompareIcon">${cmp.icon}</div><div><h3>${esc(cmp.title)}</h3><div class="courseCompareDiff">الفرق بين نسبة الشامل والاستعداد: ${esc(diffText)}</div></div></div><div class="courseReasons"><b>قراءة محتملة للنتيجة</b><ul>${cmp.reasons.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>${cmp.consult?'<div class="courseTeacherNote">💬 لمعرفة سبب الفرق بدقة، اتكلم مع مستر يوسف؛ بيانات المنصة تساعد في تحديد مكان الخلل أو سبب التفوق، لكنها لا تسجل كل ظروف يوم الامتحان.</div>':''}</div></div>
  </div>`;
}
async function openAssessmentCycleView(){clearMsg();showOnly('assessmentCycleView');$('assessmentLoading').innerHTML='<div class="empty">جاري تحميل تقييم الكورس...</div>';$('assessmentLoading').classList.remove('hidden');$('assessmentBody').classList.add('hidden');try{const d=await assessmentCycleFn();renderAssessmentCycle(d);$('assessmentLoading').classList.add('hidden');$('assessmentBody').classList.remove('hidden')}catch(e){$('assessmentLoading').innerHTML='<div class="msg err">'+esc(e.message||'تعذر تحميل تقييم الكورس التأسيسي')+'</div>'}}
'''
          pattern=re.compile(r"function renderAssessmentCycle\(d\)\{.*?(?=function renderClassTests\(d\)\{)",re.S)
          if not pattern.search(s):
              raise SystemExit('assessment function block not found')
          s=pattern.sub(block+'\n',s,count=1)
          p.write_text(s,encoding='utf-8')

          # The student source now contains the final evaluation UI, so remove the old build-time patch.
          wf=Path('.github/workflows/pages.yml')
          w=wf.read_text(encoding='utf-8')
          start='      - name: Unify foundation course evaluation for students\n'
          end='      - name: Validate student module syntax\n'
          if start in w:
              i=w.index(start);j=w.index(end,i);w=w[:i]+w[j:]
          wf.write_text(w,encoding='utf-8')

          # Validate inline module syntax before committing.
          modules=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if not modules:
              raise SystemExit('student module not found')
          Path('/tmp/student-module.mjs').write_text('\n'.join(modules),encoding='utf-8')
          PY
          node --check /tmp/student-module.mjs

      - name: Commit final source and clean temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/foundation-eval-v3.yml
          git add student.html .github/workflows/pages.yml .github/workflows/foundation-eval-v3.yml
          git commit -m "Simplify foundation course student evaluation"
          git push

      - name: Deploy updated Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 2
          gh workflow run pages.yml --ref main
