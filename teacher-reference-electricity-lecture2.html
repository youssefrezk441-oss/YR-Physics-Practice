<style>

order-bottom:1px solid var(--line)}.list{padding:7px;overflow:auto}.stageBtn{width:100%;border:1px solid transparent;background:#fff;border-radius:11px;padding:9px;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:right;cursor:pointer;margin-bottom:4px;color:#14233a}.stageBtn:hover{background:#f7f9fc}.stageBtn.active{background:#edf4ff;border-color:#cfe0f6;color:#123d6b}.num{width:27px;height:27px;border-radius:8px;background:#edf1f6;display:grid;place-items:center;font-size:11px;font-weight:900}.stageBtn.active .num{background:var(--blue);color:#fff}.stageBtn b{font-size:12px;line-height:1.4}.main{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto 1fr;gap:10px}.head{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 15px}.kicker{font-size:10px;color:var(--blue);font-weight:900}.head h2{margin:3px 0;color:var(--navy);font-size:23px}.goal{font-size:12px;color:var(--muted);line-height:1.5}.cue{background:linear-gradient(135deg,#102f52,#173f69);color:#fff;border-radius:19px;padding:18px 21px;box-shadow:0 16px 35px rgba(16,47,82,.16)}.cue small{display:block;color:#bdd3e9;font-weight:900;margin-bottom:6px}.cue div{font-size:clamp(25px,3vw,44px);font-weight:950;line-height:1.25}.grid{min-height:0;display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.board,.col>section{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 14px;box-shadow:0 7px 20px rgba(22,50,79,.04);overflow:auto}.board h3,.col h3{margin:0 0 8px;color:var(--navy);font-size:13px}.boardGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.zone{border:1px solid #dbe5f0;background:#fbfdff;border-radius:12px;padding:9px;min-height:120px}.zone b{font-size:10px;color:#6f8197}.item{margin-top:6px;padding:7px 8px;border-radius:9px;background:#f1f6fc;font-size:12px;line-height:1.5;font-weight:800}.item.keep{background:#eef8f2;color:#155a41}.item.temp{background:#f5f1ff;color:#4d4270}.item.erase{background:#fff5e7;color:#934700}.col{min-height:0;display:grid;grid-template-rows:repeat(3,1fr);gap:10px}.ask{background:#f8fbff!important}.trap{background:var(--warnbg)!important;border-color:#f0d6af!important}.trap h3{color:var(--warn)!important}.move{background:var(--goodbg)!important;border-color:#cee9dc!important}.move h3{color:var(--good)!important}.qs{margin:0;padding:0;list-style:none;display:grid;gap:6px}.qs li{background:#fff;border:1px solid #e4eaf2;border-radius:9px;padding:7px 8px;font-size:12px;line-height:1.45;font-weight:800}.txt{font-size:12px;line-height:1.6;font-weight:800}.check,.bridge{margin-top:7px;background:#fff;border:1px solid #ead5b0;border-radius:9px;padding:7px 8px;font-size:11px;line-height:1.5}.bridge{border-color:#cfe7da;color:#315f4f}.math{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;white-space:nowrap}.frac{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;line-height:1.04;margin:0 .1em}.frac .n{border-bottom:1.4px solid currentColor;padding:0 .14em .05em;text-align:center}.frac .d{padding:.05em .14em 0;text-align:center}.math sub{font-size:.7em}.math sup{font-size:.68em}.bottom{background:#fff;border-top:1px solid var(--line);padding:8px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.nav{border:0;border-radius:11px;padding:10px 17px;min-width:110px;background:var(--navy);color:#fff;font-weight:900;cursor:pointer}.nav.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.nav:disabled{opacity:.35}.keys{text-align:center;color:var(--muted);font-size:10px}kbd{background:#fff;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:4px;padding:1px 4px}@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.work{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.col{grid-template-rows:auto}.boardGrid{grid-template-columns:1fr}.progress{min-width:120px}.title p,.keys{display:none}.bottom{position:sticky;bottom:0}.cue div{font-size:30px}}

<script>
const M=(s)=>`<span class="math">${s}</span>`,F=(n,d)=>`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const stages=[
{t:'الطاقة من اللي نعرفه',g:'الطالب يستنتج علاقة الطاقة بنفسه بدل استقبال قانون جديد.',c:'«معانا V و I و t… نجيب الطاقة من غير ما أحفظك قانون جديد إزاي؟»',b:[['يمين — البداية',M('V = '+F('W','Q')),M('Q = It')],['وسط — الاستنتاج',M('W = VQ'),M('W = VIt')],['يسار — تثبيت','الطاقة = «كم انتقل؟»','امسح الاشتقاق بعد التثبيت']],q:['فرق الجهد معناه طاقة بالنسبة لإيه؟','لو مش معايا Q أجيبها منين؟','لو الزمن اتضاعف وV وI ثابتين، الطاقة تعمل إيه؟'],tr:'حفظ W = VIt كقانون منفصل.',ch:'اكشفه: «لو نسيت القانون، تقدر تبنيه قدامي في خطوتين؟»',m:'أغلب الطلاب يصلون إلى W = VIt من العلاقتين دون تلقين.',br:'«عرفنا كمية الطاقة… طب لو جهازين استهلكوا نفس الطاقة، مين فيهم أقوى؟»'},
{t:'نفس الطاقة… مين أقوى؟',g:'الفصل بين كمية الطاقة ومعدل استهلاكها والوصول إلى القدرة.',c:'«جهازان استهلكا نفس الطاقة… واحد خلصها أسرع. هل هما نفس القدرة؟»',b:[['يمين — الموقف','600 J في 20 s','600 J في 40 s'],['وسط — المعنى',M('P = '+F('W','t')),M('P = VI')],['يسار — الصور الأومية',M('P = I<sup>2</sup>R'),M('P = '+F('V<sup>2</sup>','R'))]],q:['نفس الطاقة + زمن أقل = قدرة أكبر ولا أصغر؟','الوات يقيس كمية طاقة ولا معدل؟','من W = VIt كيف نصل إلى P = VI؟'],tr:'الخلط بين الطاقة والقدرة أو اعتبار الواط وحدة طاقة.',ch:'اكشفه: «جهازان استهلكا 600 J. هل لازم قدرتهم متساوية؟»',m:'الطالب يقول: القدرة تعتمد على الطاقة والزمن، وليست الطاقة نفسها.',br:'«طيب لو غيّرنا المقاومة… القدرة تزيد ولا تقل؟ الإجابة مش واحدة!»'},
{t:'قبل التناسب: إيه الثابت؟',g:'منع التناسب المطلق بين القدرة والمقاومة.',c:'«المقاومة الأكبر قدرتها أكبر ولا أصغر؟»',b:[['نفس I',M('P = I<sup>2</sup>R'),M('P ∝ R')],['نفس V',M('P = '+F('V<sup>2</sup>','R')),M('P ∝ '+F('1','R'))],['الرسم','P مقابل I²','الميل = R']],q:['R₁ > R₂… مين قدرته أكبر؟','استنى… عند ثبوت إيه؟','في رسم P مع I²، الميل يمثل إيه؟'],tr:'قول P ∝ R أو P ∝ 1/R كقاعدة مطلقة.',ch:'اكشفه: «غيرت الشرط من نفس I لنفس V… هل إجابتك تفضل نفسها؟»',m:'أول رد يصبح: «إيه الثابت؟»',br:'«كنا بنحسب R من قانون أوم… بس هو قال لنا ليه سلكين مقاومتهم مختلفة؟»'},
{t:'من أين جاءت قيمة R؟',g:'فهم العوامل التي تحدد مقاومة الموصل.',c:'«قانون أوم حسب لنا المقاومة… لكنه قال لنا ليه السلك ده مقاومته أكبر؟»',b:[['يمين — العوامل','الطول ℓ','مساحة المقطع A'],['وسط','نوع المادة','درجة الحرارة T'],['يسار — الاستنتاج',M('R ∝ ℓ'),M('R ∝ '+F('1','A')),M('A = πr<sup>2</sup>')]],q:['لو السلك بقى أطول فقط… المقاومة؟','لو بقى أسمك فقط… المقاومة؟','لو نصف القطر اتضاعف، المساحة تعمل إيه؟','الريوستات بيغيّر إيه فعليًا؟'],tr:'استخدام R ∝ 1/r بدل 1/r².',ch:'اكشفه: «نصف القطر اتضاعف… المساحة اتضاعفت ولا أربع مرات؟»',m:'الطالب يذكر العوامل الأربعة ويستنتج أثر الطول والمساحة.',br:'«طيب غيرنا أبعاد قطعة النحاس… هل النحاس نفسه اتغير؟»'},
{t:'السلك أم المادة؟',g:'التمييز بين R وρₑ وσ.',c:'«لو غيرت طول قطعة النحاس… النحاس نفسه اتغير؟»',b:[['يمين — القانون الأم',M('R = '+F('ρ<sub>e</sub>ℓ','A'))],['وسط — المعنى','R → قطعة الموصل','ρₑ → المادة عند T معينة'],['يسار',M('σ = '+F('1','ρ<sub>e</sub>')),M('T↑ → ρ<sub>e</sub>↑ → R↑'),M('σ↓')]],q:['غيرت طول قطعة من نفس المادة… مين يتغير: R ولا ρₑ؟','ρₑ تعتمد على الأبعاد؟','في الفلز: الحرارة زادت… σ تعمل إيه؟'],tr:'استخدام المقاومة والمقاومة النوعية كأنهما نفس الكمية.',ch:'اكشفه: «قطعت السلك لنصفين… هل المادة نفسها اتغيرت؟»',m:'الطالب يقول: R تتغير بالأبعاد، ρₑ لا تتغير بالأبعاد وحدها.',br:'«القانون ده مش للحساب بس… ممكن يخلّيك تقرأ أي رسم من غير حفظ.»'},
{t:'اقرأ الميل… لا تحفظه',g:'استخراج معنى الميل من القانون بدل حفظ جدول ميول.',c:'«لو نسيت معنى الميل… تقدر تطلعه من القانون قدامي؟»',b:[['يمين — المحاور','حدّد Y','حدّد X'],['وسط',M('R = ('+F('ρ<sub>e</sub>','A')+')ℓ'),M('Y = aX')],['يسار',M('slope = '+F('ρ<sub>e</sub>','A')),'اختبر برسوم أخرى']],q:['مين Y ومين X في الرسم؟','أخلي القانون على صورة Y = aX إزاي؟','لو الرسم R مع 1/A، الميل يساوي إيه؟'],tr:'حفظ ميول الرسوم أو قراءة 1/A على أنه A.',ch:'اكشفه: «متقوليش الميل من الحفظ… طلّعه من القانون.»',m:'الطالب يستخرج ميل رسم جديد لم يره.',br:'«نفس القانون يقدر يقارن سلكين حتى لو 3 عوامل اتغيروا مع بعض.»'},
{t:'سلكان؟ ابدأ من الأصل',g:'بناء نسبة المقاومتين من القانون الأساسي.',c:'«عندي 3 حاجات اتغيرت مرة واحدة… ليه أحفظ نسبة جديدة؟»',b:[['السلك 1',M('R₁ = '+F('ρ₁ℓ₁','A₁'))],['السلك 2',M('R₂ = '+F('ρ₂ℓ₂','A₂'))],['اقسم',M(F('R₁','R₂')+' = '+F('ρ₁','ρ₂')+' × '+F('ℓ₁','ℓ₂')+' × '+F('A₂','A₁')),M('A = πr<sup>2</sup>')]],q:['ليه A ظهرت بالعكس في النسبة؟','لو السلك دائري، أبدّل A بإيه؟','هل محتاج أحفظ نسبة جديدة؟'],tr:'قلب نسبة المساحات أو نسيان تربيع نصف القطر.',ch:'اكشفه: «المساحة في قانون R فوق ولا تحت؟»',m:'الطالب يبني النسبة من الصفر.',br:'«بس لو مش سلكين… لو هو السلك نفسه واتشد، هل نفس الطريقة تكفي؟»'},
{t:'السلك نفسه؟ اللعبة اتغيرت',g:'تثبيت قيد ثبات الحجم في إعادة تشكيل السلك نفسه.',c:'«شدّينا السلك نفسه وخليّناه أطول… هل أقول R ∝ ℓ وخلاص؟»',b:[['يمين — السؤال','نفس السلك؟','لا فقد من المادة؟'],['وسط — القيد',M('A₁ℓ₁ = A₂ℓ₂')],['يسار — الاستنتاج',M('R ∝ ℓ<sup>2</sup>'),M('R ∝ '+F('1','A<sup>2</sup>')),M('R ∝ '+F('1','r<sup>4</sup>'))]],q:['دي مقارنة سلكين ولا السلك نفسه؟','لو ℓ زاد، A لازم تعمل إيه؟','لو نصف القطر بقى النصف، R كام مرة؟'],tr:'تطبيق R ∝ ℓ وحدها رغم تغير A أيضًا.',ch:'اكشفه: «لو طول السلك زاد وهو نفس السلك… حجمه راح فين؟»',m:'أول سؤال للطالب: «الحجم ثابت؟»',br:'«وأحيانًا المسألة ما تديكش A أصلًا؛ بس تكون مخبيّاها جوه الكتلة أو اللفات.»'},
{t:'المعطى مستخبي فين؟',g:'استخراج البعد المفقود من الكثافة أو الحجم أو اللفات.',c:'«مش مديّني A… هل المسألة ناقصة فعلًا؟»',b:[['يمين — الكثافة',M('ρ<sub>m</sub> = '+F('m','Volume'))],['وسط — خريطة الحل','m , ρₘ → Volume → A → R',M('Volume = Aℓ')],['يسار — اللفات',M('ℓ = N(2πR<sub>turn</sub>)'),'r السلك ≠ R اللفة']],q:['أنا ناقصني A ولا ℓ؟','الكتلة والكثافة يطلعوا لي إيه أولًا؟','عدد اللفات يجيب لي طول السلك إزاي؟'],tr:'الخلط بين ρₑ وρₘ أو بين نصف قطر السلك ونصف قطر اللفة.',ch:'اكشفه: «أنهي ρ وحدتها Ω·m وأنهي واحدة kg·m⁻³؟»',m:'الطالب يرسم مسار حل قبل التعويض.',br:'«خلصنا مقاومة الموصل… دلوقتي أكتر من مقاومة: أول مهارة قراءة الدائرة.»'},
{t:'اقرأ الدائرة… مش شكلها',g:'الحكم على التوالي والتوازي من المسارات والعُقد.',c:'«لو لويت الأسلاك وغيرت شكل الرسم… نوع التوصيل يتغير؟»',b:[['يمين — اتبع المسار','مسار واحد؟','فين نقطة التفرع؟'],['وسط — العقد','هل العنصران بين نفس نقطتين؟'],['يسار — المعيار','توالي = مسار واحد بلا تفرع','توازي = نفس نقطتي التوصيل']],q:['فين نقطة التفرع؟','المقاومتان بين نفس النقطتين؟','لو لفّيت السلك على الورقة، الحكم يتغير؟'],tr:'الحكم من شكل الرسم: فوق بعض = توازي، جنب بعض = توالي.',ch:'اكشفه: ارسم نفس التوصيل بشكل مختلف واسأل «اتغيرت نقاط الاتصال؟»',m:'الطالب يذكر السبب الهندسي قبل اسم التوصيل.',br:'«عرفنا نوع التوصيل… دلوقتي كل نوع بيفرض حاجة تبقى ثابتة وحاجة تتوزع.»'},

let cur=0;const $=id=>document.getElementById(id),list=$('list');stages.forEach((s,i)=>{const b=document.createElement('button');b.className='stageBtn';b.innerHTML=`<span class="num">${i+1}</span><b>${s.t}</b>`;b.onclick=()=>show(i);list.appendChild(b)});function show(i){cur=Math.max(0,Math.min(stages.length-1,i));const s=stages[cur];[...list.children].forEach((b,j)=>b.classList.toggle('active',j===cur));$('kicker').textContent=`المرحلة ${cur+1} من ${stages.length}`;$('stageTitle').textContent=s.t;$('goal').innerHTML='<b>الهدف:</b> '+s.g;$('cue').textContent=s.c;$('asks').innerHTML=s.q.map(x=>`<li>${x}</li>`).join('');$('trap').textContent=s.tr;$('check').textContent=s.ch;$('move').textContent=s.m;$('bridge').textContent='جملة الربط: '+s.br;$('board').innerHTML=s.b.map((z,zi)=>`<div class="zone"><b>${z[0]}</b>${z.slice(1).map((x,k)=>`<div class="item ${k===0&&zi===1?'temp':''}">${x}</div>`).join('')}</div>`).join('');$('bar').style.width=((cur+1)/stages.length*100)+'%';$('count').textContent=`${cur+1} / ${stages.length}`;$('prev').disabled=cur===0;$('next').disabled=cur===stages.length-1;$('next').textContent=cur===stages.length-1?'نهاية الحصة':'التالي';history.replaceState(null,'','#stage-'+(cur+1))}$('prev').onclick=()=>show(cur-1);$('next').onclick=()=>cur<stages.length-1&&show(cur+1);document.addEventListener('keydown',e=>{if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();cur<stages.length-1&&show(cur+1)}else if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();cur>0&&show(cur-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(stages.length-1)}});const hm=location.hash.match(/stage-(\d+)/);if(hm){const n=Number(hm[1])-1;if(n>=0&&n<stages.length)cur=n}show(cur);
