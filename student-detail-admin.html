<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملف الطالب — منصة تدريبات الفيزياء</title>
<style>
:root{font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#172033}*{box-sizing:border-box}body{margin:0;background:#f5f7fb}.wrap{max-width:1180px;margin:auto;padding:20px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand h1{font-size:22px;margin:0}.brand p{margin:5px 0 0;color:#667085;font-size:13px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:17px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#1d4ed8;color:#fff}.secondary{background:#eef2ff;color:#1d4ed8}.muted{color:#667085}.small{font-size:12px}.hidden{display:none!important}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stat{padding:14px;background:#f8fafc;border:1px solid #e4e7ec;border-radius:13px}.stat b{display:block;font-size:24px;margin-bottom:3px}.profileHead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.profileName{font-size:25px;margin:0 0 6px}.pill{font-size:12px;background:#f2f4f7;border-radius:99px;padding:5px 9px;display:inline-block;margin:2px}.on{background:#ecfdf3;color:#067647}.off{background:#fff1f2;color:#b42318}.attempt{border:1px solid #e4e7ec;border-radius:14px;padding:14px;margin:10px 0}.attemptTop{display:grid;grid-template-columns:1fr 130px 130px 160px;gap:12px;align-items:center}.attemptTitle{font-weight:800}.score{font-size:19px;font-weight:900}.status-graded{color:#067647}.status-submitted{color:#b54708}.status-in_progress{color:#475467}.detailBox{margin-top:14px;padding-top:14px;border-top:1px solid #eaecf0}.questionCard{border:1px solid #e4e7ec;border-radius:13px;padding:14px;margin:10px 0;background:#fff}.questionCard.correct{border-right:5px solid #16a34a}.questionCard.partial{border-right:5px solid #d97706}.questionCard.incorrect{border-right:5px solid #e11d48}.questionCard.review{border-right:5px solid #ca8a04;background:#fffbeb}.qhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}.stem{font-size:17px;font-weight:800;line-height:1.8;margin:10px 0;white-space:pre-wrap}.answerBox{background:#f8fafc;border:1px solid #eaecf0;border-radius:10px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;line-height:1.65}.feedback{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap}.model{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap}.qasset{text-align:center;margin:12px 0}.qasset img{max-width:100%;max-height:440px;border-radius:12px;border:1px solid #e4e7ec;background:#fff}.empty{text-align:center;padding:25px;color:#667085}.msg{padding:11px 13px;border-radius:10px;margin-bottom:12px;background:#fff1f3;color:#be123c}.loading{padding:20px;text-align:center;color:#667085}@media(max-width:800px){.c8,.c6,.c4,.c3{grid-column:span 12}.top,.profileHead{align-items:flex-start;flex-direction:column}.attemptTop{grid-template-columns:1fr}.wrap{padding:12px}.profileName{font-size:22px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand"><h1>منصة تدريبات الفيزياء</h1><p>مستر يوسف رزق — ملف الطالب</p></div><div class="toolbar"><a class="btn secondary" href="students-admin.html">إدارة الطلاب</a><a class="btn secondary" href="./">لوحة الإدارة</a><button id="logoutBtn" class="btn secondary hidden">خروج</button></div></div>
<div id="msg"></div>
<section id="authView" class="card" style="max-width:520px;margin:50px auto"><h2 style="margin-top:0">تسجيل دخول المدير</h2><div style="display:grid;gap:10px"><input id="email" type="email" placeholder="البريد الإلكتروني" style="padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit"><input id="password" type="password" placeholder="كلمة المرور" style="padding:11px;border:1px solid #d0d5dd;border-radius:10px;font:inherit"><button id="loginBtn" class="btn primary">دخول</button></div></section>
<section id="mainView" class="hidden"><div id="studentHeader"></div><div id="attemptsCard" class="card"><h2 style="margin-top:0;font-size:19px">سجل المحاولات بالتفصيل</h2><div id="attempts"></div></div></section>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/+esm';
const SUPABASE_URL='https://ltjdhconuiqblxfjzpzj.supabase.co',KEY='sb_publishable_-7SIdrqTmUibqpA7mXXrgg_SHz9EJRr';
const sb=createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const userId=new URLSearchParams(location.search).get('user_id')||'';let detail=null;
function show(t){$('msg').innerHTML='<div class="msg">'+esc(t)+'</div>'}function clear(){$('msg').innerHTML=''}
async function fn(body){const{data,error}=await sb.functions.invoke('admin-student',{body});if(error)throw new Error(error.message||'تعذر الاتصال');if(data?.error)throw new Error(data.message||data.error);return data}
function statusLabel(s){return s==='graded'?'تم التصحيح':s==='submitted'?'قيد مراجعة المقالي':s==='in_progress'?'غير مكتملة':s||'—'}
function gradeLabel(s){return s==='correct'?'صحيحة':s==='partial'?'جزئية':s==='incorrect'?'غير صحيحة':s==='review'?'قيد المراجعة':'—'}
function publicAssetUrl(path){return sb.storage.from('question-assets').getPublicUrl(path).data.publicUrl}
function assetsHtml(rows){return(rows||[]).filter(a=>a.asset_type==='stem_image').map(a=>'<div class="qasset"><img src="'+esc(publicAssetUrl(a.storage_path))+'" alt="'+esc(a.alt_text||a.caption||'رسم السؤال')+'">'+(a.caption?'<div class="small muted">'+esc(a.caption)+'</div>':'')+'</div>').join('')}
async function openAdmin(){if(!userId){show('لم يتم تحديد الطالب. ارجع إلى إدارة الطلاب واختر ملف الطالب.');return}$('authView').classList.add('hidden');$('mainView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await loadStudent()}
async function loadStudent(){try{clear();detail=await fn({action:'student_detail',user_id:userId});renderStudent()}catch(e){show(e.message)}}
function renderStudent(){const p=detail.profile,s=detail.summary;$('studentHeader').innerHTML='<div class="card"><div class="profileHead"><div><h2 class="profileName">'+esc(p.full_name)+'</h2><div><span class="pill">'+esc(p.student_code)+'</span><span class="pill '+(p.is_active?'on':'off')+'">'+(p.is_active?'نشط':'موقوف')+'</span></div><div class="muted" style="margin-top:9px">'+esc(p.grade_level||'—')+' · '+esc(p.center_name||'—')+' · '+esc(p.group_code||'—')+'</div></div><div class="small muted">تاريخ إنشاء الحساب: '+new Date(p.created_at).toLocaleDateString('ar-EG')+'</div></div><div class="grid" style="margin-top:16px"><div class="c3 stat"><b>'+s.attempt_count+'</b><span class="small muted">إجمالي المحاولات</span></div><div class="c3 stat"><b>'+s.completed_count+'</b><span class="small muted">محاولات مسلّمة</span></div><div class="c3 stat"><b>'+(s.average_percentage==null?'—':Number(s.average_percentage)+'%')+'</b><span class="small muted">متوسط النتائج</span></div><div class="c3 stat"><b>'+(s.best_percentage==null?'—':Number(s.best_percentage)+'%')+'</b><span class="small muted">أفضل نتيجة</span></div></div></div>';
const rows=detail.attempts||[];$('attempts').innerHTML=rows.length?rows.map((a,i)=>'<div class="attempt" id="attempt-'+a.id+'"><div class="attemptTop"><div><div class="attemptTitle">'+esc(a.title)+'</div><div class="small muted">'+new Date(a.started_at).toLocaleString('ar-EG')+'</div></div><div><span class="status-'+esc(a.status)+'"><b>'+statusLabel(a.status)+'</b></span>'+(Number(a.pending_reviews)>0?'<div class="small muted">'+a.pending_reviews+' مقالي ينتظر المراجعة</div>':'')+'</div><div><div class="score">'+(a.score==null?'—':Number(a.score)+' / '+Number(a.max_score))+'</div><div class="small muted">'+(a.percentage==null?'—':Number(a.percentage)+'%')+'</div></div><div><button class="btn secondary attemptDetail" data-id="'+a.id+'">تفاصيل المحاولة</button></div></div><div class="detailBox hidden" id="detail-'+a.id+'"></div></div>').join(''):'<div class="empty">لا توجد محاولات لهذا الطالب حتى الآن.</div>';document.querySelectorAll('.attemptDetail').forEach(b=>b.onclick=()=>toggleAttempt(b.dataset.id,b))}
async function toggleAttempt(id,btn){const box=$('detail-'+id);if(!box.classList.contains('hidden')){box.classList.add('hidden');btn.textContent='تفاصيل المحاولة';return}if(box.dataset.loaded==='1'){box.classList.remove('hidden');btn.textContent='إخفاء التفاصيل';return}box.classList.remove('hidden');box.innerHTML='<div class="loading">جاري تحميل تفاصيل المحاولة...</div>';btn.disabled=true;try{const d=await fn({action:'attempt_detail',attempt_id:id});box.innerHTML=renderAttempt(d);box.dataset.loaded='1';btn.textContent='إخفاء التفاصيل'}catch(e){box.innerHTML='<div class="msg">'+esc(e.message)+'</div>'}finally{btn.disabled=false}}
function answerText(q){if(q.type==='mcq')return q.selected_choice_text?((q.selected_choice_label? q.selected_choice_label+' — ':'')+q.selected_choice_text):'لم يختر إجابة';if(q.type==='numeric')return q.numeric_value==null?'لم يكتب إجابة':String(q.numeric_value)+(q.unit_text?' '+q.unit_text:'');return q.text_answer||'لم يكتب إجابة'}
function correctText(q){if(q.type==='mcq')return q.correct_choice_text?((q.correct_choice_label?q.correct_choice_label+' — ':'')+q.correct_choice_text):'';if(q.type==='numeric')return q.numeric_answer==null?'':String(q.numeric_answer)+((q.accepted_units||[]).length?' '+q.accepted_units.join(' / '):'');return q.model_answer||''}
function renderAttempt(d){const a=d.attempt,qs=d.questions||[];return '<div class="grid"><div class="c4 stat"><b>'+(a.percentage==null?'—':Number(a.percentage)+'%')+'</b><span class="small muted">النسبة</span></div><div class="c4 stat"><b>'+(a.score==null?'—':Number(a.score)+' / '+Number(a.max_score))+'</b><span class="small muted">الدرجة</span></div><div class="c4 stat"><b>'+statusLabel(a.status)+'</b><span class="small muted">حالة المحاولة</span></div></div><div style="margin-top:14px">'+qs.map((q,i)=>{const st=q.grading_status||'incorrect',ans=answerText(q),correct=correctText(q);return '<div class="questionCard '+esc(st)+'"><div class="qhead"><div><b>السؤال '+(i+1)+' — '+esc(q.question_code)+'</b><div class="small muted">'+esc(q.type)+' · '+esc(q.difficulty||'')+'</div></div><div><b>'+Number(q.awarded_points||0)+' / '+Number(q.points)+' درجة</b><div class="small">'+gradeLabel(st)+'</div></div></div><div class="stem">'+esc(q.stem)+'</div>'+assetsHtml(q.assets)+'<div class="answerBox"><b>إجابة الطالب:</b><br>'+esc(ans)+'</div>'+(q.feedback?'<div class="feedback"><b>ملاحظة التصحيح:</b><br>'+esc(q.feedback)+'</div>':'')+(correct?'<div class="model"><b>'+(q.type==='short_text'?'نموذج الإجابة':'الإجابة الصحيحة')+':</b><br>'+esc(correct)+'</div>':'')+(q.explanation?'<div class="answerBox"><b>الشرح:</b><br>'+esc(q.explanation)+'</div>':'')+'</div>'}).join('')+'</div>'}
$('loginBtn').onclick=async()=>{try{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(data.user?.app_metadata?.role!=='admin'){await sb.auth.signOut();throw new Error('هذا الحساب ليس مديرًا.')}await openAdmin()}catch(e){show(e.message)}};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
const{data:{session}}=await sb.auth.getSession();if(session?.user?.app_metadata?.role==='admin')await openAdmin();
</script></body></html>
