<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة حساب الطالب</title><link rel="stylesheet" href="student-account.css"></head><body><main class="accountPage"><a href="student.html">← العودة للدخول</a><h1>استعادة الحساب</h1><p class="accountMuted">أرسل طلبًا للإدارة. لن نكشف وجود الحساب، ولا تكفي معرفة الرقم القومي أو الميلاد للاستعادة.</p><form id="form" class="accountCard accountGrid"><div class="accountField full"><label>كود الطالب أو رقم الموبايل</label><input name="identifier" required></div><div class="accountField full"><label>رقم للتواصل</label><input name="contact_phone" inputmode="tel"></div><div id="message" class="hidden full"></div><button class="accountBtn">إرسال طلب الاستعادة</button></form><section id="receipt" class="accountCard hidden"><p>رقم الطلب: <b id="reference"></b></p><textarea id="statusToken" readonly></textarea></section><section class="accountCard"><h2>لديّ رمز إعادة التعيين</h2><form id="resetForm" class="accountGrid"><div class="accountField full"><label>الرمز</label><textarea name="reset_token" required></textarea></div><div class="accountField"><label>كلمة المرور الجديدة</label><input name="password" type="password" required></div><div class="accountField"><label>تأكيدها</label><input name="confirm" type="password" required></div><button class="accountBtn">تعيين كلمة المرور</button></form></section></main><script type="module">import{identity,$,message}from'./student-identity-api.js';$('form').onsubmit=async e=>{e.preventDefault();try{const d=await identity('request_recovery',Object.fromEntries(new FormData(e.target)));message(d.message,true);$('reference').textContent=d.reference;$('statusToken').value=d.status_token;$('receipt').classList.remove('hidden')}catch(x){message(x.message)}};$('resetForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{if(b.password!==b.confirm)throw Error('كلمتا المرور غير متطابقتين.');const d=await identity('reset_password',b);message(d.message,true)}catch(x){message(x.message)}};</script></body></html>
