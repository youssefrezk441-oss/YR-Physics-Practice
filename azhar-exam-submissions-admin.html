<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسليمات الامتحان الأزهري | مستر يوسف رزق</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172b4b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px 14px 60px}h1{font-size:24px}.card{background:white;border:1px solid #dbe5ef;border-radius:14px;padding:16px;margin:12px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:10px 15px;background:#174579;color:white;font:inherit;font-weight:bold;cursor:pointer}.btn.secondary{background:white;border:1px solid #9fb6d0;color:#174579}.hidden{display:none}.muted{color:#60748a}.table{overflow:auto}.row{display:grid;grid-template-columns:minmax(200px,2fr) 90px 90px 200px 100px;gap:9px;align-items:center;min-width:740px;border-bottom:1px solid #e4eaf2;padding:9px 5px}.head{background:#e9f0f8;font-weight:bold}.answer{border-bottom:1px solid #e5e9ef;padding:11px 0;white-space:pre-wrap;line-height:1.8}.answer b{color:#174579}.err{color:#a3133d}@media(max-width:650px){.wrap{padding:12px 9px}.row{font-size:13px}}
</style></head><body><div class="wrap"><div class="toolbar"><div style="flex:1"><h1>تسليمات الامتحان الشامل الأزهري</h1><p class="muted">الإجابات محفوظة للعرض فقط؛ لا يوجد تصحيح أو درجة تلقائية. الخروج من العرض مؤشر للمراجعة، وليس دليل غش قاطعًا.</p></div><a href="./" class="btn secondary">العودة للإدارة</a></div><div id="gate" class="card">يلزم تسجيل دخول الإدارة في المنصة لعرض التسليمات.</div><div id="app" class="hidden"><div class="toolbar"><button id="refresh" class="btn">تحديث</button><button id="export" class="btn secondary">تنزيل الإجابات JSON</button><span id="summary" class="muted"></span></div><div id="msg"></div><div class="card table"><div class="row head"><div>الاسم الثلاثي</div><div>المجاب</div><div>مرات الخروج</div><div>الحالة / الوقت</div><div>الإجابات</div></div><div id="rows"></div></div><div id="detail" class="card hidden"></div></div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/+esm';
const sb=createClient('https://ltjdhconuiqblxfjzpzj.supabase.co','sb_publishable_-7SIdrqTmUibqpA7mXXrgg_SHz9EJRr',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const ENDPOINT='https://ltjdhconuiqblxfjzpzj.supabase.co/functions/v1/azhar-exam-public';const $=id=>document.getElementById(id);let attempts=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function api(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('سجّل الدخول من لوحة الإدارة أولًا.');const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'تعذر الاتصال.');return j}
function date(x){return x?new Date(x).toLocaleString('ar-EG'):'—'}
async function load(){const data=await api({action:'admin_list'});attempts=data.attempts;$('summary').textContent=attempts.length+' محاولة · '+attempts.filter(x=>x.status==='submitted').length+' مسلّمة';$('rows').innerHTML=attempts.map((a,i)=>'<div class="row"><b>'+esc(a.student_name)+'</b><span>'+Number(a.answered)+'/40</span><span>'+Number(a.exits)+'</span><span>'+(a.status==='submitted'?'مسلّم: '+date(a.submitted_at):a.status==='expired'?'انتهى الوقت':'جارٍ حتى '+date(a.deadline_at))+'</span><button class="btn secondary" data-i="'+i+'">عرض</button></div>').join('')||'<p>لا توجد محاولات بعد.</p>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>detail(attempts[Number(b.dataset.i)].name_key))}
async function detail(nameKey){try{const d=(await api({action:'admin_detail',name_key:nameKey})).attempt;$('detail').classList.remove('hidden');const activity=d.activity||[];$('detail').innerHTML='<h2>'+esc(d.student_name)+'</h2><p>بدأ: '+date(d.started_at)+' · الموعد النهائي: '+date(d.deadline_at)+' · سلّم: '+date(d.submitted_at)+'</p><h3>مغادرة الصفحة والعودة — '+activity.filter(x=>x.event_type==='hidden').length+' مرات خروج</h3><p class="muted">الوقت أدناه من ساعة هاتف الطالب؛ وقد يشمل الخروج مكالمة أو قفل الشاشة.</p>'+(activity.map(x=>'<div class="answer">'+(x.event_type==='hidden'?'غادرت الصفحة':'عادت الصفحة للعرض')+' · '+date(x.client_at)+'</div>').join('')||'<p class="muted">لم تُرصد أحداث انتقال.</p>')+'<h3>الإجابات</h3>'+Array.from({length:40},(_,i)=>'<div class="answer"><b>السؤال '+(i+1)+'</b><br>'+esc(d.answers?.[i+1]||'بلا إجابة')+'</div>').join('');$('detail').scrollIntoView({behavior:'smooth'})}catch(e){$('msg').textContent=e.message}}
$('refresh').onclick=()=>load().catch(e=>$('msg').textContent=e.message);
$('export').onclick=async()=>{try{const items=[];for(const a of attempts)items.push((await api({action:'admin_detail',name_key:a.name_key})).attempt);const b=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),link=document.createElement('a');link.href=u;link.download='azhar-exam-submissions.json';link.click();URL.revokeObjectURL(u)}catch(e){$('msg').textContent=e.message}};
try{const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('سجّل الدخول من لوحة الإدارة أولًا.');await load();$('gate').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('gate').textContent=e.message}
</script></body></html>
