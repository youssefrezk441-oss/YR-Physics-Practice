<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YR Physics Practice — إدارة الطلاب</title>
<style>
:root{font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#172033}*{box-sizing:border-box}body{margin:0;background:#f5f7fb}.wrap{max-width:1050px;margin:auto;padding:20px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand h1{font-size:22px;margin:0}.brand p{margin:5px 0 0;color:#667085;font-size:13px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:17px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 11px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#1d4ed8;color:#fff}.secondary{background:#eef2ff;color:#1d4ed8}.danger{background:#fff1f2;color:#be123c}.hidden{display:none!important}.muted{color:#667085}.small{font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.msg{padding:11px 13px;border-radius:10px;margin-bottom:12px}.ok{background:#ecfdf3;color:#027a48}.err{background:#fff1f3;color:#be123c}.row{display:grid;grid-template-columns:110px 1fr 120px 100px 130px 190px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eaecf0}.row:last-child{border:0}.pill{font-size:12px;background:#f2f4f7;border-radius:99px;padding:5px 8px;display:inline-block}.statusOn{color:#067647}.statusOff{color:#b42318}.stat{padding:12px;background:#f8fafc;border:1px solid #e4e7ec;border-radius:12px}.stat b{display:block;font-size:22px}.link{color:#1d4ed8;text-decoration:none;font-weight:800}.authbox{max-width:520px;margin:50px auto}@media(max-width:800px){.c6,.c4,.c3{grid-column:span 12}.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><h1>إدارة طلاب YR Physics Practice</h1><p>حسابات مستقلة خاصة بمنصة التدريبات</p></div><div class="toolbar"><a class="link" href="./">لوحة الإدارة</a><a class="link" href="student.html">صفحة الطالب</a><button id="logoutBtn" class="btn secondary hidden">خروج</button></div></div><div id="msg"></div>
<section id="authView" class="authbox card"><h2 style="margin-top:0">تسجيل دخول المدير</h2><div class="grid"><div class="c12"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="c12"><label>كلمة المرور</label><input id="password" type="password"></div><div class="c12"><button id="loginBtn" class="btn primary">دخول</button></div></div></section>
<section id="adminView" class="hidden">
<div class="card"><h2 style="margin-top:0;font-size:19px">إضافة طالب</h2><div class="grid"><div class="c4"><label>كود الطالب</label><input id="code" placeholder="N3-001"></div><div class="c4"><label>اسم الطالب</label><input id="name"></div><div class="c4"><label>الصف / المستوى</label><input id="grade" placeholder="3 ثانوي"></div><div class="c6"><label>كلمة المرور الأولية</label><input id="newPassword" type="text" placeholder="8 أحرف على الأقل"></div><div class="c6" style="display:flex;align-items:end"><button id="createBtn" class="btn primary" style="width:100%">إنشاء حساب الطالب</button></div></div></div>
<div class="grid" id="stats" style="margin-bottom:14px"></div>
<div class="card"><div class="toolbar" style="justify-content:space-between"><h2 style="margin:0;font-size:19px">الطلاب</h2><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو الكود" style="width:240px"><button id="refreshBtn" class="btn secondary">تحديث</button></div></div><div id="rows" style="margin-top:12px"></div></div>
</section></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/+esm';
const URL='https://ltjdhconuiqblxfjzpzj.supabase.co',KEY='sb_publishable_-7SIdrqTmUibqpA7mXXrgg_SHz9EJRr';const sb=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let students=[];
function show(t,type='ok'){$('msg').innerHTML='<div class="msg '+type+'">'+esc(t)+'</div>';setTimeout(()=>$('msg').innerHTML='',4500)}async function fn(body){const{data,error}=await sb.functions.invoke('admin-student',{body});if(error)throw new Error(error.message||'تعذر الاتصال');if(data?.error)throw new Error(data.message||data.error);return data}
$('loginBtn').onclick=async()=>{try{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(data.user?.app_metadata?.role!=='admin'){await sb.auth.signOut();throw new Error('هذا الحساب ليس مديرًا.')}await openAdmin()}catch(e){show(e.message,'err')}};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function openAdmin(){$('authView').classList.add('hidden');$('adminView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await load()}
async function load(){try{const d=await fn({action:'list_students'});students=d.students||[];render()}catch(e){show(e.message,'err')}}function render(){const q=$('search').value.trim().toLowerCase();const rows=students.filter(s=>!q||String(s.student_code||'').toLowerCase().includes(q)||String(s.full_name||'').toLowerCase().includes(q));const active=students.filter(s=>s.is_active).length;$('stats').innerHTML='<div class="c4 stat"><b>'+students.length+'</b><span class="small muted">إجمالي الطلاب</span></div><div class="c4 stat"><b>'+active+'</b><span class="small muted">نشط</span></div><div class="c4 stat"><b>'+students.reduce((n,s)=>n+Number(s.attempt_count||0),0)+'</b><span class="small muted">إجمالي المحاولات</span></div>';$('rows').innerHTML=rows.length?rows.map(s=>'<div class="row"><b>'+esc(s.student_code)+'</b><div><b>'+esc(s.full_name)+'</b><div class="small muted">'+esc(s.grade_level||'—')+'</div></div><div><span class="'+(s.is_active?'statusOn':'statusOff')+'">'+(s.is_active?'● نشط':'● موقوف')+'</span></div><div><b>'+Number(s.attempt_count||0)+'</b><div class="small muted">محاولة</div></div><div><b>'+(s.average_percentage==null?'—':Number(s.average_percentage)+'%')+'</b><div class="small muted">متوسط</div></div><div class="toolbar"><button class="btn secondary reset" data-id="'+s.user_id+'">كلمة مرور</button><button class="btn '+(s.is_active?'danger':'primary')+' toggle" data-id="'+s.user_id+'" data-active="'+s.is_active+'">'+(s.is_active?'إيقاف':'تفعيل')+'</button></div></div>').join(''):'<p class="muted">لا يوجد طلاب.</p>';document.querySelectorAll('.reset').forEach(b=>b.onclick=()=>resetPassword(b.dataset.id));document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>toggleStudent(b.dataset.id,b.dataset.active==='true'))}
$('createBtn').onclick=async()=>{try{$('createBtn').disabled=true;const d=await fn({action:'create_student',student_code:$('code').value,full_name:$('name').value,grade_level:$('grade').value,password:$('newPassword').value});show('تم إنشاء حساب '+d.student.student_code+' بنجاح.');$('code').value='';$('name').value='';$('grade').value='';$('newPassword').value='';await load()}catch(e){show(e.message,'err')}finally{$('createBtn').disabled=false}};
async function resetPassword(id){const p=prompt('اكتب كلمة المرور الجديدة (8 أحرف على الأقل):');if(!p)return;try{await fn({action:'reset_password',user_id:id,password:p});show('تم تغيير كلمة المرور.')}catch(e){show(e.message,'err')}}async function toggleStudent(id,isActive){if(!confirm(isActive?'إيقاف حساب الطالب؟':'تفعيل حساب الطالب؟'))return;try{await fn({action:'set_active',user_id:id,is_active:!isActive});await load();show(isActive?'تم إيقاف الحساب.':'تم تفعيل الحساب.')}catch(e){show(e.message,'err')}}
$('refreshBtn').onclick=load;$('search').oninput=render;const{data:{session}}=await sb.auth.getSession();if(session?.user?.app_metadata?.role==='admin')await openAdmin();
</script></body></html>
