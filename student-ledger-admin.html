<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل الطلاب الشامل — الإدارة</title>
<style>
:root{font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#172033}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#eef2ff 0,#f8fafc 35%,#f5f7fb 75%)}.wrap{max-width:1600px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand h1{margin:0;font-size:26px}.brand p{margin:6px 0 0;color:#667085}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#fff;border:1px solid #d0d5dd;color:#344054}.primary{background:#000073;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:17px;padding:16px;margin-bottom:14px}.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(150px,1fr));gap:10px}.filters input,.filters select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 11px;font:inherit;background:#fff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:13px}.stat span{color:#667085;font-size:12px}.stat b{display:block;font-size:23px;margin-top:5px}.tableWrap{background:#fff;border:1px solid #e4e7ec;border-radius:17px;overflow:auto}.head,.row{display:grid;grid-template-columns:90px minmax(210px,1.6fr) 120px 130px 100px 85px 125px 135px 150px 150px 145px 110px 145px minmax(260px,1.6fr) 90px;gap:8px;align-items:center;min-width:1900px;padding:11px 12px;border-bottom:1px solid #edf0f4}.head{position:sticky;top:0;background:#f8fafc;z-index:2;font-size:11px;font-weight:900;color:#667085}.row{font-size:12px}.row:hover{background:#fbfcff}.name{font-weight:900;font-size:13px}.muted{color:#667085}.small{font-size:11px}.pill{display:inline-block;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:900;background:#f2f4f7;color:#475467}.on{background:#ecfdf3;color:#067647}.off{background:#fff1f2;color:#b42318}.cmp{display:inline-block;padding:5px 8px;border-radius:9px;font-weight:900;font-size:10px}.cmp.aligned{background:#eff8ff;color:#175cd3}.cmp.higher{background:#ecfdf3;color:#067647}.cmp.lower{background:#fff4ed;color:#b54708}.metric b{display:block;font-size:13px}.metric span{font-size:10px;color:#667085}.reason{line-height:1.55;color:#475467}.details{min-width:1900px;background:#f8fafc;border-bottom:1px solid #dfe4ea;padding:14px 18px}.details.hidden,.hidden{display:none!important}.detailGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.mini{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:11px}.mini span{font-size:10px;color:#667085}.mini b{display:block;font-size:18px;margin-top:4px}.sectionTitle{font-size:14px;margin:16px 0 7px}.subtable{background:#fff;border:1px solid #e4e7ec;border-radius:12px;overflow:auto}.srow{display:grid;gap:7px;padding:8px 10px;border-bottom:1px solid #eef0f4;font-size:11px;align-items:center;min-width:760px}.srow:last-child{border:0}.srow.head2{background:#f8fafc;color:#667085;font-weight:900}.sessions .srow{grid-template-columns:90px 80px 1.6fr 90px 110px}.quizzes .srow{grid-template-columns:90px 1.5fr 110px 100px 90px 90px}.platform .srow{grid-template-columns:1.8fr 90px 100px 100px 110px}.comps .srow{grid-template-columns:90px 1.8fr 100px 100px 100px 110px}.empty{padding:24px;text-align:center;color:#667085}.msg{padding:12px;border-radius:11px;margin-bottom:12px}.err{background:#fff1f3;color:#be123c}.loading{padding:30px;text-align:center;color:#667085}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.detailGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.filters,.stats,.detailGrid{grid-template-columns:1fr}.wrap{padding:12px 8px 36px}.brand h1{font-size:22px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>سجل الطلاب الشامل</h1><p>كل طالب في مكان واحد: الحضور، الواجب، الكويزات، تدريبات المنصة، الشامل، الاستعداد والمقارنة.</p></div><div class="toolbar"><span id="who" class="muted small"></span><a class="btn secondary" href="admin-followup-menu.html">← الطلاب والمتابعة</a><button id="refresh" class="btn primary">تحديث</button></div></div><div id="msg"></div>
<div class="card"><div class="filters"><input id="search" placeholder="بحث بالكود أو الاسم أو السنتر أو المجموعة"><select id="grade"><option value="">كل الصفوف</option><option value="الصف الثالث الثانوي">تالتة ثانوي</option><option value="الصف الثاني الثانوي">تانية ثانوي</option></select><select id="center"><option value="">كل السناتر</option></select><select id="group"><option value="">كل المجموعات</option></select><select id="active"><option value="">نشط وغير نشط</option><option value="1">نشط فقط</option><option value="0">غير نشط فقط</option></select></div></div>
<div id="stats" class="stats" style="margin-bottom:14px"></div>
<div id="loading" class="loading card">جاري تحميل السجل المركزي...</div><div id="table" class="tableWrap hidden"><div class="head"><div>الكود</div><div>الطالب</div><div>الصف</div><div>السنتر</div><div>المجموعة</div><div>الحالة</div><div>الحضور</div><div>الواجب</div><div>الكويزات</div><div>المنصة</div><div>الشامل</div><div>الاستعداد</div><div>مقارنة الشامل</div><div>تفسير محتمل</div><div>التفاصيل</div></div><div id="rows"></div></div></div>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/+esm';import{loadAdminAccess,canView}from'./admin-access.js';const sb=createClient('https://ltjdhconuiqblxfjzpzj.supabase.co','sb_publishable_-7SIdrqTmUibqpA7mXXrgg_SHz9EJRr',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let data=[],detailCache=new Map;
function pct(v){return v==null?'—':Number(v).toFixed(Number(v)%1?1:0)+'%'}function n(v){return Number(v||0).toFixed(Number(v||0)%1?1:0)}function msg(t){$('msg').innerHTML='<div class="msg err">'+esc(t)+'</div>'}async function fn(body){const{data,error}=await sb.functions.invoke('admin-student-ledger',{body});if(error)throw new Error(error.message||'تعذر الاتصال');if(data?.error)throw new Error(data.message||data.error);return data}function gradeShort(v){return v==='الصف الثالث الثانوي'?'3 ثانوي':v==='الصف الثاني الثانوي'?'2 ثانوي':v||'—'}
function comparison(x){const c=x.comparison||{};if(!c.state)return'<span class="muted">—</span>';const sign=Number(c.delta)>0?'+':'';return `<span class="cmp ${c.state}">${esc(c.label)} · ${sign}${n(c.delta)}</span>`}
function comprehensive(x){const c=x.comprehensive;if(!c)return'<span class="muted">—</span>';if(c.status==='pending')return'<span class="muted">لم تُدخل</span>';if(c.status==='absent')return`<div class="metric"><b>0 / ${n(c.max_score)}</b><span>غياب · 0%</span></div>`;return `<div class="metric"><b>${n(c.score)} / ${n(c.max_score)}</b><span>${pct(c.percentage)}</span></div>`}
function metricRate(rate,sub){return`<div class="metric"><b>${pct(rate)}</b><span>${esc(sub)}</span></div>`}
function filtered(){const q=$('search').value.trim().toLowerCase(),g=$('grade').value,c=$('center').value,gr=$('group').value,a=$('active').value;return data.filter(x=>(!q||[x.student_code,x.full_name,x.center_name,x.group_code].some(v=>String(v||'').toLowerCase().includes(q)))&&(!g||x.grade_level===g)&&(!c||x.center_name===c)&&(!gr||x.group_code===gr)&&(!a||(a==='1')===!!x.is_active))}
function fillFilters(){const centers=[...new Set(data.map(x=>x.center_name).filter(Boolean))].sort(),groups=[...new Set(data.map(x=>x.group_code).filter(Boolean))].sort();$('center').innerHTML='<option value="">كل السناتر</option>'+centers.map(x=>`<option>${esc(x)}</option>`).join('');$('group').innerHTML='<option value="">كل المجموعات</option>'+groups.map(x=>`<option>${esc(x)}</option>`).join('')}
function render(){const rows=filtered(),active=rows.filter(x=>x.is_active).length,ready=rows.filter(x=>x.readiness!=null).length,comp=rows.filter(x=>x.comprehensive&&['scored','absent'].includes(x.comprehensive.status)).length,aligned=rows.filter(x=>x.comparison?.state==='aligned').length;$('stats').innerHTML=`<div class="stat"><span>الطلاب الظاهرون</span><b>${rows.length}</b></div><div class="stat"><span>نشط</span><b>${active}</b></div><div class="stat"><span>غير نشط</span><b>${rows.length-active}</b></div><div class="stat"><span>لهم شامل مسجل</span><b>${comp}</b></div><div class="stat"><span>الشامل متوافق مع الاستعداد</span><b>${aligned}</b></div>`;$('rows').innerHTML=rows.length?rows.map(x=>`<div class="row" data-id="${x.user_id}"><div><b>${esc(x.student_code||'—')}</b></div><div><div class="name">${esc(x.full_name)}</div></div><div>${esc(gradeShort(x.grade_level))}</div><div>${esc(x.center_name||'—')}</div><div>${esc(x.group_code||'—')}</div><div><span class="pill ${x.is_active?'on':'off'}">${x.is_active?'نشط':'غير نشط'}</span></div><div>${metricRate(x.attendance.rate,`${x.attendance.present}/${x.attendance.total} · غياب ${x.attendance.absent}`)}</div><div>${metricRate(x.homework.rate,`كامل ${x.homework.done} · ناقص ${x.homework.partial} · لم يسلم ${x.homework.not_submitted}`)}</div><div><div class="metric"><b>${x.quizzes.possible?`${n(x.quizzes.earned)} / ${n(x.quizzes.possible)}`:'—'}</b><span>${pct(x.quizzes.ratio)} · ${x.quizzes.recorded} اختبار</span></div></div><div><div class="metric"><b>${x.platform.possible?`${n(x.platform.earned)} / ${n(x.platform.possible)}`:'—'}</b><span>${pct(x.platform.ratio)} · ${x.platform.trainings} تدريب</span></div></div><div>${comprehensive(x)}</div><div><b>${pct(x.readiness)}</b></div><div>${comparison(x)}</div><div class="reason" title="${esc(x.comparison?.reason||'')}">${esc(x.comparison?.reason||'—')}</div><div><button class="btn secondary open" data-id="${x.user_id}">فتح</button></div></div><div id="d-${x.user_id}" class="details hidden"></div>`).join(''):'<div class="empty">لا يوجد طلاب مطابقون للفلاتر.</div>';document.querySelectorAll('.open').forEach(b=>b.onclick=()=>toggleDetail(b.dataset.id,b))}
function detailTable(cls,head,rows){return`<div class="subtable ${cls}"><div class="srow head2">${head.map(x=>`<div>${x}</div>`).join('')}</div>${rows||'<div class="empty">لا توجد بيانات.</div>'}</div>`}
async function toggleDetail(id,b){const box=$('d-'+id);if(!box.classList.contains('hidden')){box.classList.add('hidden');b.textContent='فتح';return}box.classList.remove('hidden');b.textContent='إغلاق';if(detailCache.has(id)){renderDetail(box,detailCache.get(id));return}box.innerHTML='<div class="loading">جاري تحميل التفاصيل...</div>';try{const d=await fn({action:'detail',user_id:id});detailCache.set(id,d);renderDetail(box,d)}catch(e){box.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
function renderDetail(box,d){const r=d.readiness||{},ss=d.sessions||[],qs=d.quizzes||[],ps=d.platform||[],cs=d.comprehensive||[];box.innerHTML=`<div class="detailGrid"><div class="mini"><span>مؤشر الاستعداد</span><b>${pct(r.score)}</b></div><div class="mini"><span>حضور دورة التقييم</span><b>${pct(r.attendance)}</b></div><div class="mini"><span>كويزات دورة التقييم</span><b>${pct(r.quizzes)}</b></div><div class="mini"><span>منصة دورة التقييم</span><b>${pct(r.platform)}</b></div></div><h3 class="sectionTitle">📅 سجل الحضور والواجب</h3>${detailTable('sessions',['التاريخ','الحصة','العنوان','الحضور','الواجب'],ss.map(x=>`<div class="srow"><div>${esc(x.session_date)}</div><div>${Number(x.session_number)}</div><div>${esc(x.title||'—')}</div><div>${x.attendance==='absent'?'غائب':'حاضر'}</div><div>${!x.has_homework?'لا يوجد':x.homework_status==='done'?'تم':x.homework_status==='partial'?'ناقص':x.homework_status==='not_submitted'?'لم يسلم':'غير مسجل'}</div></div>`).join(''))}<h3 class="sectionTitle">🧪 كل الكويزات والاختبارات المرتبطة بالحصص</h3>${detailTable('quizzes',['التاريخ','الاختبار','النوع','الدرجة','النسبة','الحالة'],qs.map(x=>`<div class="srow"><div>${esc(x.session_date)}</div><div>${esc(x.test_name||x.session_title||'اختبار')}</div><div>${esc(x.test_type||'—')}</div><div>${['scored','absent'].includes(x.status)?`${n(x.score)} / ${n(x.max_score)}`:'—'}</div><div>${pct(x.percentage)}</div><div>${x.status==='absent'?'غائب':x.status==='scored'?'مسجل':'لم تدخل'}</div></div>`).join(''))}<h3 class="sectionTitle">🚀 تدريبات المنصة — أفضل نتيجة لكل تدريب</h3>${detailTable('platform',['التدريب','المحاولات','أفضل درجة','أفضل نسبة','الحالة'],ps.map(x=>`<div class="srow"><div>${esc(x.title)}</div><div>${Number(x.attempts||0)}</div><div>${x.best_score==null?'—':`${n(x.best_score)} / ${n(x.best_max)}`}</div><div>${pct(x.best_percentage)}</div><div>${esc(x.training_status||'—')}</div></div>`).join(''))}<h3 class="sectionTitle">📌 الامتحانات الشاملة</h3>${detailTable('comps',['التاريخ','الامتحان','الدرجة','النسبة','الحالة','النشر'],cs.map(x=>`<div class="srow"><div>${esc(x.exam_date)}</div><div>${esc(x.title)}</div><div>${['scored','absent'].includes(x.status)?`${n(x.score)} / ${n(x.max_score)}`:'—'}</div><div>${pct(x.percentage)}</div><div>${x.status==='absent'?'غائب':x.status==='scored'?'مسجل':'لم تدخل'}</div><div>${x.exam_status==='approved'?'معتمد':x.exam_status==='complete'?'مكتمل':'مسودة'}</div></div>`).join(''))}`}
async function load(){try{$('loading').classList.remove('hidden');$('table').classList.add('hidden');const d=await fn({action:'list'});data=d.students||[];fillFilters();render();$('loading').classList.add('hidden');$('table').classList.remove('hidden')}catch(e){$('loading').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
['search','grade','center','group','active'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('refresh').onclick=()=>{detailCache.clear();load()};try{const ctx=await loadAdminAccess(sb);if(!canView(ctx,'students')||!canView(ctx,'class_sessions'))throw new Error('تحتاج صلاحية مشاهدة الطلاب والحصص.');$('who').textContent=ctx.user.email||'';await load()}catch(e){msg(e.message||'تعذر فتح الصفحة');$('loading').classList.add('hidden')}
</script></body></html>
