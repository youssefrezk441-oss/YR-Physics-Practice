<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل الطلاب الشامل — الإدارة</title>
<style>
:root{font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#172033;--navy:#000073;--border:#e4e7ec;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top right,#eef2ff 0,#f8fafc 35%,#f5f7fb 75%);min-height:100vh}
button,input,select{font:inherit}
.wrap{max-width:1760px;margin:auto;padding:22px 14px 50px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}
.brand h1{margin:0;font-size:27px}.brand p{margin:6px 0 0;color:var(--muted);line-height:1.65}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}
.secondary{background:#fff;border:1px solid #d0d5dd;color:#344054}.primary{background:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px rgba(15,23,42,.035)}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:11px}
.filters{display:grid;grid-template-columns:2fr repeat(6,minmax(140px,1fr));gap:10px}
.filters input,.filters select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 11px;background:#fff;color:#172033}
.filterFoot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sortInfo{font-size:12px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.summaryCard{appearance:none;text-align:right;background:#fff;border:1px solid var(--border);border-radius:15px;padding:14px;cursor:pointer;transition:.16s ease;min-height:92px}
.summaryCard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.07)}
.summaryCard.active{outline:3px solid rgba(0,0,115,.12);border-color:#818cf8}
.summaryCard span{display:block;font-size:12px;color:var(--muted);font-weight:800}.summaryCard b{display:block;font-size:27px;margin-top:6px}
.summaryCard.intervention b{color:#b42318}.summaryCard.followup b{color:#b54708}.summaryCard.higher b{color:#6941c6}.summaryCard.stable b{color:#067647}.summaryCard.missing b{color:#475467}
.tableWrap{background:#fff;border:1px solid var(--border);border-radius:17px;overflow:auto;box-shadow:0 5px 18px rgba(15,23,42,.035)}
.head,.row{display:grid;grid-template-columns:145px 92px minmax(220px,1.4fr) 105px 120px 100px 82px 120px 130px 140px 160px 125px 110px 130px minmax(220px,1.3fr);gap:8px;align-items:center;min-width:2050px;padding:10px 12px;border-bottom:1px solid #edf0f4}
.head{position:sticky;top:0;background:#f8fafc;z-index:3;padding-top:7px;padding-bottom:7px}
.sortBtn{width:100%;border:0;background:transparent;color:#667085;font-size:11px;font-weight:950;cursor:pointer;text-align:right;padding:6px 2px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:5px}
.sortBtn:hover{background:#eef2ff;color:#000073}.sortArrow{font-size:11px;min-width:13px;text-align:center}
.row{font-size:12px;transition:.12s ease}.row:hover{background:#fbfcff}.row.intervention{box-shadow:inset -4px 0 #f04438}.row.followup{box-shadow:inset -4px 0 #f79009}.row.higher{box-shadow:inset -4px 0 #7f56d9}.row.stable{box-shadow:inset -4px 0 #12b76a}.row.missing{box-shadow:inset -4px 0 #98a2b3}.row.inactive{opacity:.62}
.nameLine{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-weight:950;font-size:13px}.open{padding:6px 9px;font-size:10px;white-space:nowrap}
.pill,.decision,.delta,.actionTag{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:950;line-height:1.35}
.on{background:#ecfdf3;color:#067647}.off{background:#f2f4f7;color:#667085}
.decision.intervention{background:#fff1f3;color:#b42318}.decision.followup{background:#fffaeb;color:#b54708}.decision.higher{background:#f4f3ff;color:#6941c6}.decision.stable{background:#ecfdf3;color:#067647}.decision.missing,.decision.inactive{background:#f2f4f7;color:#475467}
.delta.normal{background:#ecfdf3;color:#067647}.delta.down{background:#fff1f3;color:#b42318}.delta.up{background:#f4f3ff;color:#6941c6}.delta.na{background:#f2f4f7;color:#667085}
.metric b{display:block;font-size:15px;line-height:1.15}.metric span{display:block;margin-top:4px;font-size:10px;color:var(--muted);line-height:1.5}
.metric.good b{color:#067647}.metric.mid b{color:#175cd3}.metric.warn b{color:#b54708}.metric.bad b{color:#b42318}
.actionTag{white-space:normal;border-radius:9px;background:#f8fafc;color:#344054;border:1px solid #e4e7ec}
.details{min-width:2050px;background:#f8fafc;border-bottom:1px solid #dfe4ea;padding:16px 18px 20px}
.decisionHero{display:grid;grid-template-columns:minmax(280px,1.3fr) repeat(3,minmax(160px,.55fr));gap:11px;margin-bottom:12px}
.decisionMain,.heroMetric{background:#fff;border:1px solid var(--border);border-radius:15px;padding:15px}
.decisionMain h3{margin:0 0 8px;font-size:18px}.decisionMain p{margin:8px 0 0;line-height:1.75;color:#475467}
.heroMetric span{font-size:11px;color:var(--muted)}.heroMetric b{display:block;font-size:28px;margin-top:7px}
.actionBox{display:grid;grid-template-columns:1.1fr 1.7fr;gap:11px;margin-bottom:12px}
.actionPanel,.reasonPanel{border-radius:14px;padding:14px;border:1px solid var(--border);background:#fff}
.actionPanel b,.reasonPanel b{display:block;margin-bottom:6px}.actionPanel p,.reasonPanel p{margin:0;line-height:1.75;color:#475467}
.detailGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
.mini{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px}.mini span{font-size:10px;color:var(--muted)}.mini b{display:block;font-size:19px;margin-top:4px}
details.block{background:#fff;border:1px solid var(--border);border-radius:13px;margin-top:10px;overflow:hidden}
details.block summary{cursor:pointer;padding:12px 14px;font-weight:950;background:#fbfcfe}
details.block[open] summary{border-bottom:1px solid #eef0f4}
.blockBody{padding:10px}
.subtable{background:#fff;border:1px solid var(--border);border-radius:11px;overflow:auto}
.srow{display:grid;gap:7px;padding:8px 10px;border-bottom:1px solid #eef0f4;font-size:11px;align-items:center;min-width:760px}.srow:last-child{border:0}.srow.head2{background:#f8fafc;color:#667085;font-weight:900}
.sessions .srow{grid-template-columns:90px 80px 1.6fr 90px 110px}.quizzes .srow{grid-template-columns:90px 1.5fr 110px 100px 90px 90px}.platform .srow{grid-template-columns:1.8fr 90px 100px 100px 110px}.comps .srow{grid-template-columns:90px 1.8fr 100px 100px 100px 110px}
.empty{padding:24px;text-align:center;color:var(--muted)}.msg{padding:12px;border-radius:11px;margin-bottom:12px}.err{background:#fff1f3;color:#be123c}.loading{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1150px){.filters{grid-template-columns:repeat(3,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.detailGrid{grid-template-columns:repeat(3,1fr)}.decisionHero{grid-template-columns:1fr 1fr}.actionBox{grid-template-columns:1fr}}
@media(max-width:720px){.filters,.summary,.detailGrid,.decisionHero{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px 8px 36px}}
@media(max-width:480px){.filters,.summary,.detailGrid,.decisionHero{grid-template-columns:1fr}.brand h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>سجل الطلاب الشامل</h1><p>لوحة لاتخاذ القرار: ابدأ بالأولوية، ثم راجع الشامل والاستعداد ومؤشرات الأداء، وافتح التفاصيل عند الحاجة.</p></div>
    <div class="toolbar"><span id="who" class="muted small"></span><a class="btn secondary" href="admin-followup-menu.html">← الطلاب والمتابعة</a><button id="refresh" class="btn primary">تحديث</button></div>
  </div>
  <div id="msg"></div>

  <div class="card">
    <div class="filters">
      <input id="search" placeholder="بحث بالكود أو الاسم أو السنتر أو المجموعة">
      <select id="grade"><option value="">كل الصفوف</option><option value="الصف الثالث الثانوي">تالتة ثانوي</option><option value="الصف الثاني الثانوي">تانية ثانوي</option></select>
      <select id="center"><option value="">كل السناتر</option></select>
      <select id="group"><option value="">كل المجموعات</option></select>
      <select id="active"><option value="">نشط وغير نشط</option><option value="1">نشط فقط</option><option value="0">غير نشط فقط</option></select>
      <select id="decision"><option value="">كل حالات القرار</option><option value="intervention">يحتاج تدخل</option><option value="followup">يحتاج متابعة</option><option value="higher">تفوق غير متوقع</option><option value="stable">مستقر</option><option value="missing">بيانات غير كافية</option><option value="inactive">غير نشط</option></select>
      <select id="quick"><option value="">كل المستويات</option><option value="low">يوجد مؤشر أقل من 60%</option><option value="excellent">الشامل 85% فأعلى</option><option value="absent">غائب في الشامل</option></select>
    </div>
    <div class="filterFoot"><div id="sortInfo" class="sortInfo">الترتيب الافتراضي: الأولوية</div><button id="reset" class="btn secondary">إعادة ضبط الفلاتر والترتيب</button></div>
  </div>

  <div id="summary" class="summary"></div>
  <div id="loading" class="loading card">جاري تحميل السجل المركزي...</div>

  <div id="table" class="tableWrap hidden">
    <div id="head" class="head"></div>
    <div id="rows"></div>
  </div>
</div>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/+esm';
import{loadAdminAccess,canView}from'./admin-access.js';

const sb=createClient('https://ltjdhconuiqblxfjzpzj.supabase.co','sb_publishable_-7SIdrqTmUibqpA7mXXrgg_SHz9EJRr',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let data=[],detailCache=new Map(),sortState={key:'priority',dir:'asc'};

const columns=[
  ['priority','الأولوية'],['student_code','الكود'],['full_name','الطالب'],['grade_level','الصف'],['center_name','السنتر'],['group_code','المجموعة'],['is_active','الحالة'],
  ['attendance','الحضور'],['homework','الواجب'],['quizzes','الكويزات'],['platform','المنصة'],['comprehensive','الشامل'],['readiness','الاستعداد'],['delta','الفرق'],['action','الإجراء المقترح']
];

function pct(v){if(v==null||!Number.isFinite(Number(v)))return'—';const x=Math.round((Number(v)+1e-9)*10)/10;return x.toFixed(x%1?1:0)+'%'}
function num(v){if(v==null||!Number.isFinite(Number(v)))return'—';const x=Math.round((Number(v)+1e-9)*10)/10;return x.toFixed(x%1?1:0)}
function msg(t){$('msg').innerHTML='<div class="msg err">'+esc(t)+'</div>'}
function gradeShort(v){return v==='الصف الثالث الثانوي'?'3 ثانوي':v==='الصف الثاني الثانوي'?'2 ثانوي':v||'—'}
async function fn(body){const{data,error}=await sb.functions.invoke('admin-student-ledger',{body});if(error)throw new Error(error.message||'تعذر الاتصال');if(data?.error)throw new Error(data.message||data.error);return data}

function compPct(x){const c=x.comprehensive;if(!c||!['scored','absent'].includes(c.status))return null;return c.status==='absent'?0:Number(c.percentage)}
function platformLikely(x){
  const cp=compPct(x),rd=x.readiness==null?null:Number(x.readiness),pl=x.platform?.ratio==null?null:Number(x.platform.ratio);
  if(cp==null||rd==null||pl==null)return false;
  const d=cp-rd,ad=Math.abs(d);
  if(ad<=10)return false;
  const effect=d>0?(cp-pl)*.30:(pl-cp)*.30;
  return effect>=Math.max(4,ad*.40);
}
function weakFlags(x){
  const out=[];
  const cp=compPct(x);
  if(cp!=null&&cp<50)out.push({key:'comprehensive',label:'نتيجة الشامل منخفضة',value:cp});
  if(x.quizzes?.ratio!=null&&Number(x.quizzes.ratio)<60)out.push({key:'quizzes',label:'الكويزات منخفضة',value:Number(x.quizzes.ratio)});
  if(x.platform?.ratio!=null&&Number(x.platform.ratio)<60)out.push({key:'platform',label:'تدريبات المنصة منخفضة',value:Number(x.platform.ratio)});
  if(x.homework?.rate!=null&&Number(x.homework.rate)<70)out.push({key:'homework',label:'الواجب يحتاج متابعة',value:Number(x.homework.rate)});
  if(x.attendance?.rate!=null&&Number(x.attendance.rate)<80)out.push({key:'attendance',label:'الحضور يحتاج متابعة',value:Number(x.attendance.rate)});
  return out.sort((a,b)=>a.value-b.value);
}
function decisionFor(x){
  if(!x.is_active)return{key:'inactive',rank:6,label:'غير نشط',icon:'⚪'};
  const cp=compPct(x),rd=x.readiness==null?null:Number(x.readiness);
  if(cp==null||rd==null)return{key:'missing',rank:4,label:'بيانات غير كافية',icon:'⚪'};
  const d=cp-rd;
  if(d<-10)return{key:'intervention',rank:1,label:'يحتاج تدخل',icon:'🔴'};
  if(d>10)return{key:'higher',rank:3,label:'تفوق غير متوقع',icon:'🟣'};
  if(weakFlags(x).length)return{key:'followup',rank:2,label:'يحتاج متابعة',icon:'🟠'};
  return{key:'stable',rank:5,label:'مستقر',icon:'🟢'};
}
function actionFor(x){
  const d=decisionFor(x),weak=weakFlags(x)[0];
  if(d.key==='inactive')return'لا إجراء — الطالب غير نشط';
  if(d.key==='missing')return'استكمل البيانات قبل اتخاذ قرار';
  if(d.key==='intervention')return platformLikely(x)?'راجع تدريبات المنصة مع الطالب':'تواصل مع الطالب وراجع سبب هبوط الشامل';
  if(d.key==='higher')return platformLikely(x)?'ثبّت سبب التحسن وراجع أثر المنصة':'تواصل مع الطالب لفهم سبب التفوق';
  if(d.key==='followup'){
    if(!weak)return'متابعة عامة';
    return weak.key==='comprehensive'?'راجع مستوى الشامل مع الطالب':weak.key==='quizzes'?'ركز على الكويزات':weak.key==='platform'?'ركز على تدريبات المنصة':weak.key==='homework'?'تابع الواجب':'تابع الحضور';
  }
  return'لا يحتاج تدخل حاليًا';
}
function decisionReason(x){
  const d=decisionFor(x),weak=weakFlags(x)[0];
  if(d.key==='inactive')return'الطالب غير نشط حاليًا، لذلك لا يدخل ضمن أولويات التدخل اليومية.';
  if(d.key==='missing')return'لا توجد نتيجة شامل معتمدة أو مؤشر استعداد مكتمل يسمح بمقارنة عادلة.';
  if(d.key==='intervention'||d.key==='higher')return x.comparison?.reason||'يوجد فرق أكبر من 10 نقاط بين الشامل والاستعداد.';
  if(d.key==='followup')return weak?`${weak.label} (${pct(weak.value)}) رغم أن فرق الشامل والاستعداد داخل الهامش الطبيعي.`:'يوجد مؤشر يحتاج متابعة.';
  return'فرق الشامل والاستعداد داخل ±10 نقاط ولا توجد إشارة منخفضة واضحة في المؤشرات الرئيسية.';
}
function band(v,good=85,mid=70,warn=50){if(v==null)return'';v=Number(v);return v>=good?'good':v>=mid?'mid':v>=warn?'warn':'bad'}
function metric(rate,sub){return`<div class="metric ${band(rate)}"><b>${pct(rate)}</b><span>${esc(sub||'')}</span></div>`}
function compCell(x){const c=x.comprehensive;if(!c)return'<div class="metric"><b>—</b><span>لا يوجد شامل</span></div>';if(c.status==='pending')return'<div class="metric"><b>—</b><span>لم تُدخل الدرجة</span></div>';if(c.status==='absent')return'<div class="metric bad"><b>0%</b><span>غياب · 0 / '+esc(num(c.max_score))+'</span></div>';return`<div class="metric ${band(c.percentage)}"><b>${pct(c.percentage)}</b><span>${num(c.score)} / ${num(c.max_score)}</span></div>`}
function deltaValue(x){const cp=compPct(x);return cp==null||x.readiness==null?null:Math.round((cp-Number(x.readiness)+1e-9)*10)/10}
function deltaCell(x){const d=deltaValue(x);if(d==null)return'<span class="delta na">—</span>';const cls=Math.abs(d)<=10?'normal':d>10?'up':'down',sign=d>0?'+':'';return`<span class="delta ${cls}">${sign}${num(d)} نقطة</span>`}
function platformCell(x){const p=x.platform||{},count=p.trainings??0,available=p.available,quality=p.quality_ratio,completion=p.completion_rate;let sub=`${count}${available!=null?'/'+available:''} مكتمل`;if(quality!=null)sub+=` · جودة ${pct(quality)}`;else if(completion!=null)sub+=` · إكمال ${pct(completion)}`;return metric(p.ratio,sub)}
function decisionPill(x){const d=decisionFor(x);return`<span class="decision ${d.key}">${d.icon} ${esc(d.label)}</span>`}

function baseFiltered(){
  const q=$('search').value.trim().toLowerCase(),g=$('grade').value,c=$('center').value,gr=$('group').value,a=$('active').value,quick=$('quick').value;
  return data.filter(x=>{
    const textOk=!q||[x.student_code,x.full_name,x.center_name,x.group_code].some(v=>String(v||'').toLowerCase().includes(q));
    const core=textOk&&(!g||x.grade_level===g)&&(!c||x.center_name===c)&&(!gr||x.group_code===gr)&&(!a||(a==='1')===!!x.is_active);
    if(!core)return false;
    if(quick==='low')return [x.attendance?.rate,x.homework?.rate,x.quizzes?.ratio,x.platform?.ratio,compPct(x)].some(v=>v!=null&&Number(v)<60);
    if(quick==='excellent')return compPct(x)!=null&&compPct(x)>=85;
    if(quick==='absent')return x.comprehensive?.status==='absent';
    return true;
  });
}
function filtered(){
  const d=$('decision').value;
  return baseFiltered().filter(x=>!d||decisionFor(x).key===d);
}
function sortValue(x,key){
  if(key==='priority')return decisionFor(x).rank;
  if(key==='student_code'||key==='full_name'||key==='grade_level'||key==='center_name'||key==='group_code')return String(x[key]||'');
  if(key==='is_active')return x.is_active?1:0;
  if(key==='attendance')return x.attendance?.rate;
  if(key==='homework')return x.homework?.rate;
  if(key==='quizzes')return x.quizzes?.ratio;
  if(key==='platform')return x.platform?.ratio;
  if(key==='comprehensive')return compPct(x);
  if(key==='readiness')return x.readiness;
  if(key==='delta')return deltaValue(x);
  if(key==='action')return actionFor(x);
  return null;
}
function sortedRows(rows){
  if(!sortState.key||!sortState.dir)return rows;
  const key=sortState.key,dir=sortState.dir==='asc'?1:-1;
  return [...rows].sort((a,b)=>{
    const av=sortValue(a,key),bv=sortValue(b,key);
    if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return-1;
    if(typeof av==='string'||typeof bv==='string')return String(av).localeCompare(String(bv),'ar')*dir;
    return (Number(av)-Number(bv))*dir;
  });
}
function setSort(key){
  if(sortState.key!==key)sortState={key,dir:'asc'};
  else if(sortState.dir==='asc')sortState={key,dir:'desc'};
  else if(sortState.dir==='desc')sortState={key:null,dir:null};
  else sortState={key,dir:'asc'};
  render();
}
function renderHead(){
  $('head').innerHTML=columns.map(([k,label])=>`<button class="sortBtn" data-sort="${k}" title="ترتيب حسب ${esc(label)}"><span>${esc(label)}</span><span class="sortArrow">${sortState.key===k?(sortState.dir==='asc'?'↑':'↓'):''}</span></button>`).join('');
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>setSort(b.dataset.sort));
}
function fillFilters(){
  const currentC=$('center').value,currentG=$('group').value;
  const centers=[...new Set(data.map(x=>x.center_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar')),groups=[...new Set(data.map(x=>x.group_code).filter(Boolean))].sort();
  $('center').innerHTML='<option value="">كل السناتر</option>'+centers.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  $('group').innerHTML='<option value="">كل المجموعات</option>'+groups.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  if(centers.includes(currentC))$('center').value=currentC;if(groups.includes(currentG))$('group').value=currentG;
}
function renderSummary(){
  const rows=baseFiltered(),counts={intervention:0,followup:0,higher:0,stable:0,missing:0};
  rows.forEach(x=>{const k=decisionFor(x).key;if(k in counts)counts[k]++});
  const selected=$('decision').value;
  const cards=[
    ['', 'الطلاب الظاهرون',rows.length,'all'],
    ['intervention','يحتاجون تدخلًا',counts.intervention,'intervention'],
    ['followup','يحتاجون متابعة',counts.followup,'followup'],
    ['higher','أعلى من المتوقع',counts.higher,'higher'],
    ['stable','مستقرون',counts.stable,'stable'],
    ['missing','بيانات غير كافية',counts.missing,'missing']
  ];
  $('summary').innerHTML=cards.map(([key,label,count,cls])=>`<button class="summaryCard ${cls} ${selected===key?'active':''}" data-summary="${key}"><span>${label}</span><b>${count}</b></button>`).join('');
  document.querySelectorAll('[data-summary]').forEach(b=>b.onclick=()=>{$('decision').value=b.dataset.summary;render()});
}
function render(){
  renderHead();renderSummary();
  const raw=filtered(),rows=sortedRows(raw);
  $('sortInfo').textContent=sortState.key?`الترتيب الحالي: ${columns.find(x=>x[0]===sortState.key)?.[1]||sortState.key} ${sortState.dir==='asc'?'↑':'↓'}`:'بدون ترتيب — ترتيب التحميل الأصلي';
  $('rows').innerHTML=rows.length?rows.map(x=>{
    const d=decisionFor(x);
    return `<div class="row ${d.key}" data-id="${x.user_id}">
      <div>${decisionPill(x)}</div>
      <div><b>${esc(x.student_code||'—')}</b></div>
      <div><div class="nameLine"><span class="name">${esc(x.full_name||'—')}</span><button class="btn secondary open" data-id="${x.user_id}">فتح</button></div></div>
      <div>${esc(gradeShort(x.grade_level))}</div><div>${esc(x.center_name||'—')}</div><div>${esc(x.group_code||'—')}</div>
      <div><span class="pill ${x.is_active?'on':'off'}">${x.is_active?'نشط':'غير نشط'}</span></div>
      <div>${metric(x.attendance?.rate,`${x.attendance?.present||0}/${x.attendance?.total||0} · غياب ${x.attendance?.absent||0}`)}</div>
      <div>${metric(x.homework?.rate,`كامل ${x.homework?.done||0} · ناقص ${x.homework?.partial||0} · لم يسلم ${x.homework?.not_submitted||0}`)}</div>
      <div>${metric(x.quizzes?.ratio,x.quizzes?.possible?`${num(x.quizzes.earned)} / ${num(x.quizzes.possible)} · ${x.quizzes.recorded||0} اختبار`:'لا توجد درجات')}</div>
      <div>${platformCell(x)}</div>
      <div>${compCell(x)}</div>
      <div>${metric(x.readiness,'مؤشر الاستعداد')}</div>
      <div>${deltaCell(x)}</div>
      <div><span class="actionTag">${esc(actionFor(x))}</span></div>
    </div><div id="d-${x.user_id}" class="details hidden"></div>`;
  }).join(''):'<div class="empty">لا يوجد طلاب مطابقون للفلاتر الحالية.</div>';
  document.querySelectorAll('.open').forEach(b=>b.onclick=()=>toggleDetail(b.dataset.id,b));
}
function detailTable(cls,head,rows){return`<div class="subtable ${cls}"><div class="srow head2">${head.map(x=>`<div>${x}</div>`).join('')}</div>${rows||'<div class="empty">لا توجد بيانات.</div>'}</div>`}
async function toggleDetail(id,b){
  const box=$('d-'+id);
  if(!box.classList.contains('hidden')){box.classList.add('hidden');b.textContent='فتح';return}
  box.classList.remove('hidden');b.textContent='إغلاق';
  const x=data.find(v=>String(v.user_id)===String(id));
  if(detailCache.has(id)){renderDetail(box,detailCache.get(id),x);return}
  box.innerHTML='<div class="loading">جاري تحميل التفاصيل...</div>';
  try{const d=await fn({action:'detail',user_id:id});detailCache.set(id,d);renderDetail(box,d,x)}
  catch(e){box.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}
}
function renderDetail(box,d,x){
  const r=d.readiness||{},ss=d.sessions||[],qs=d.quizzes||[],ps=d.platform||[],cs=d.comprehensive||[],dec=decisionFor(x),delta=deltaValue(x),cp=compPct(x),weak=weakFlags(x)[0];
  const prompt=dec.key==='intervention'&&!platformLikely(x)?'اسأل الطالب: إيه أكتر حاجة شايف إنها حصلت معاك في الامتحان وخلت النتيجة أقل من المتوقع؟':dec.key==='higher'&&!platformLikely(x)?'اسأل الطالب: إيه اللي شايف إنك عملته بشكل مختلف أو إيه اللي ساعدك تحقق النتيجة الأعلى من المتوقع؟':'';
  box.innerHTML=`
    <div class="decisionHero">
      <div class="decisionMain"><h3>${dec.icon} ${esc(x.full_name||'الطالب')} — ${esc(dec.label)}</h3><div>${decisionPill(x)}</div><p>${esc(decisionReason(x))}</p></div>
      <div class="heroMetric"><span>نتيجة الشامل</span><b>${pct(cp)}</b></div>
      <div class="heroMetric"><span>درجة الاستعداد</span><b>${pct(x.readiness)}</b></div>
      <div class="heroMetric"><span>الفرق</span><b>${delta==null?'—':(delta>0?'+':'')+num(delta)}</b></div>
    </div>
    <div class="actionBox">
      <div class="actionPanel"><b>🎯 الإجراء المقترح</b><p>${esc(actionFor(x))}</p></div>
      <div class="reasonPanel"><b>🔎 ما الذي يدعم القرار؟</b><p>${esc(decisionReason(x))}${prompt?'<br><strong>'+esc(prompt)+'</strong>':''}</p></div>
    </div>
    <div class="detailGrid">
      <div class="mini"><span>الحضور</span><b>${pct(x.attendance?.rate)}</b></div>
      <div class="mini"><span>الواجب</span><b>${pct(x.homework?.rate)}</b></div>
      <div class="mini"><span>الكويزات</span><b>${pct(x.quizzes?.ratio)}</b></div>
      <div class="mini"><span>مؤشر المنصة</span><b>${pct(x.platform?.ratio)}</b></div>
      <div class="mini"><span>جودة المكتمل</span><b>${pct(x.platform?.quality_ratio)}</b></div>
    </div>
    <div class="small muted">التقييم السريع والإجراء المقترح أدوات مساعدة لاتخاذ القرار وليسا تشخيصًا نهائيًا للطالب.</div>

    <details class="block"><summary>📅 سجل الحضور والواجب (${ss.length})</summary><div class="blockBody">${detailTable('sessions',['التاريخ','الحصة','العنوان','الحضور','الواجب'],ss.map(v=>`<div class="srow"><div>${esc(v.session_date)}</div><div>${Number(v.session_number)}</div><div>${esc(v.title||'—')}</div><div>${v.attendance==='absent'?'غائب':'حاضر'}</div><div>${!v.has_homework?'لا يوجد':v.homework_status==='mastered'?'مكتمل بإتقان':v.homework_status==='done'?'مكتمل':v.homework_status==='partial'?'ناقص':v.homework_status==='not_submitted'?'لم يسلم':v.homework_status==='legacy_done'?'تم — سجل سابق':'غير مسجل'}</div></div>`).join(''))}</div></details>
    <details class="block"><summary>🧪 الكويزات والاختبارات (${qs.length})</summary><div class="blockBody">${detailTable('quizzes',['التاريخ','الاختبار','النوع','الدرجة','النسبة','الحالة'],qs.map(v=>`<div class="srow"><div>${esc(v.session_date)}</div><div>${esc(v.test_name||v.session_title||'اختبار')}</div><div>${esc(v.test_type||'—')}</div><div>${['scored','absent'].includes(v.status)?`${num(v.score)} / ${num(v.max_score)}`:'—'}</div><div>${pct(v.percentage)}</div><div>${v.status==='absent'?'غائب':v.status==='scored'?'مسجل':'لم تدخل'}</div></div>`).join(''))}</div></details>
    <details class="block"><summary>🚀 تدريبات المنصة — أفضل نتيجة لكل تدريب (${ps.length})</summary><div class="blockBody">${detailTable('platform',['التدريب','المحاولات','أفضل درجة','أفضل نسبة','الحالة'],ps.map(v=>`<div class="srow"><div>${esc(v.title)}</div><div>${Number(v.attempts||0)}</div><div>${v.best_score==null?'—':`${num(v.best_score)} / ${num(v.best_max)}`}</div><div>${pct(v.best_percentage)}</div><div>${esc(v.training_status||'—')}</div></div>`).join(''))}</div></details>
    <details class="block"><summary>📌 الامتحانات الشاملة (${cs.length})</summary><div class="blockBody">${detailTable('comps',['التاريخ','الامتحان','الدرجة','النسبة','الحالة','النشر'],cs.map(v=>`<div class="srow"><div>${esc(v.exam_date)}</div><div>${esc(v.title)}</div><div>${['scored','absent'].includes(v.status)?`${num(v.score)} / ${num(v.max_score)}`:'—'}</div><div>${pct(v.percentage)}</div><div>${v.status==='absent'?'غائب':v.status==='scored'?'مسجل':'لم تدخل'}</div><div>${v.exam_status==='approved'?'معتمد':v.exam_status==='complete'?'مكتمل':'مسودة'}</div></div>`).join(''))}</div></details>`;
}
async function load(){
  try{
    $('loading').classList.remove('hidden');$('table').classList.add('hidden');
    const d=await fn({action:'list'});data=d.students||[];fillFilters();render();
    $('loading').classList.add('hidden');$('table').classList.remove('hidden');
  }catch(e){$('loading').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}
}
['search','grade','center','group','active','decision','quick'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('refresh').onclick=()=>{detailCache.clear();load()};
$('reset').onclick=()=>{['search','grade','center','group','active','decision','quick'].forEach(id=>$(id).value='');sortState={key:'priority',dir:'asc'};render()};
try{
  const ctx=await loadAdminAccess(sb);
  if(!canView(ctx,'students')||!canView(ctx,'class_sessions'))throw new Error('تحتاج صلاحية مشاهدة الطلاب والحصص.');
  $('who').textContent=ctx.user.email||'';
  await load();
}catch(e){msg(e.message||'تعذر فتح الصفحة');$('loading').classList.add('hidden')}
</script>
</body>
</html>
