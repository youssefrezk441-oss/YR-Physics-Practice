<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مراجعة طلبات تعديل بيانات الطلاب | YR Physics Practice</title>
<link rel="stylesheet" href="student-access.css"><link rel="stylesheet" href="student-brand-studio-v2.css">
<style>body{background:#f1f5f0;font-family:"Tajawal",Tahoma,Arial,sans-serif}.reviewPage{max-width:1050px;margin:30px auto;padding:0 18px}.reviewHeader{background:#0f4d3e;color:white;border-radius:17px;padding:22px;display:flex;justify-content:space-between;gap:15px;align-items:center}.reviewHeader h1{margin:0 0 8px;font-size:25px}.reviewHeader p{margin:0;color:#d6e7d9}.reviewHeader a{color:white}.reviewIntro{padding:16px 0;color:#5b7364;font-size:14px}.reviewCard{padding:23px;margin:18px 0;border:1px solid #d9e6dc;background:white;border-radius:16px;box-shadow:0 12px 22px #0b51310b}.reviewCard h2{color:#0d5c46;font-size:20px}.changeGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.changeItem{background:#f6f8f5;border:1px solid #e0ebe3;border-radius:10px;padding:12px}.changeItem small{color:#63786a;display:block}.changeItem strong{display:block;margin-top:6px}.changeItem .previous{font-size:12px;color:#697e76}.changeActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.changeActions input{flex:1;min-width:220px;border:1px solid #cbdcd0;border-radius:10px;padding:12px}.changeActions button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;color:white;font-weight:800}.approve{background:#0e6b50}.reject{background:#a73543}.changeActions button:disabled{opacity:.5;cursor:wait}.reviewMsg{margin:12px 0;color:#a73543}.empty{padding:35px;text-align:center;background:white;border:1px dashed #cadbce;border-radius:15px}@media(max-width:630px){.changeGrid{grid-template-columns:1fr}.reviewHeader{flex-direction:column;align-items:start}}</style></head><body>
<main class="reviewPage">
<header class="reviewHeader"><div><h1>مراجعة تعديلات بيانات الطلاب</h1><p>طلبات تغيير الاسم أو الصف أو المجموعة أو النظام التعليمي</p></div><a href="admin-home.html">العودة للوحة الإدارة</a></header>
<p class="reviewIntro">بيانات التواصل تتحدث مباشرة، أما تغيير الهوية الدراسية فيستلزم موافقة صاحب صلاحية الإدارة. الكود ثابت دائمًا.</p>
<p class="reviewMsg" id="status" role="status" aria-live="polite">جارٍ التحقق من صلاحيات الإدارة…</p>
<div id="requests"></div>
</main>
<script type="module">
import {sb,identity,$} from "./student-identity-api.js";
const fields=[["full_name","اسم الطالب"],["grade_level","الصف الدراسي"],["education_system","النظام التعليمي"],["attendance_location","مكان الحضور"],["group_code","المجموعة"]];
function entry(label,oldValue,newValue){
 const box=document.createElement("div"),name=document.createElement("small"),current=document.createElement("span"),requested=document.createElement("strong");
 box.className="changeItem";name.textContent=label;current.className="previous";current.textContent="الحالي: "+(oldValue??"—");requested.textContent="المطلوب: "+(newValue??"—");box.append(name,current,requested);return box;
}
async function load(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session?.user||session.user.app_metadata?.role!=="admin"){location.replace("admin-home.html");return}
 try{
 const data=await identity("admin_profile_changes");
 $("status").textContent="عدد الطلبات المعلقة: "+data.requests.length;
 $("requests").replaceChildren();
 if(!data.requests.length){const d=document.createElement("div");d.className="empty";d.textContent="لا توجد طلبات تعديل تنتظر المراجعة."; $("requests").append(d);return}
 for(const req of data.requests){
  const card=document.createElement("article"),heading=document.createElement("h2"),details=document.createElement("div"),actions=document.createElement("div"),reason=document.createElement("input");
  card.className="reviewCard";heading.textContent="كود الطالب: "+req.student_code;details.className="changeGrid";
  for(const [k,label] of fields){if(req.previous_profile?.[k]!==req.requested_profile?.[k])details.append(entry(label,req.previous_profile?.[k],req.requested_profile?.[k]))}
  actions.className="changeActions";reason.placeholder="اكتب سبب القرار (8 أحرف على الأقل)";reason.maxLength=500;reason.setAttribute("aria-label","سبب القرار");
  for(const [decision,title,cls] of [["approved","اعتماد التعديل","approve"],["rejected","رفض التعديل","reject"]]){
   const button=document.createElement("button");button.type="button";button.textContent=title;button.className=cls;
   button.onclick=async()=>{
    if(reason.value.trim().length<8){$("status").textContent="اكتب سببًا واضحًا للقرار (8 أحرف على الأقل).";reason.focus();return}
    if(!confirm("تأكيد قرار: "+title+" لكود "+req.student_code+"؟"))return;
    const buttons=[...actions.querySelectorAll("button")];buttons.forEach(b=>b.disabled=true);
    try{await identity("admin_profile_change_decide",{request_id:req.id,decision,reason:reason.value.trim()});await load()}
    catch(error){$("status").textContent=error.message;buttons.forEach(b=>b.disabled=false)}
   };actions.append(button);
  }
  actions.prepend(reason);card.append(heading,details,actions);$("requests").append(card);
 }
 }catch(error){$("status").textContent="تعذر قراءة الطلبات: "+error.message}
}
await load();
</script></body></html>
