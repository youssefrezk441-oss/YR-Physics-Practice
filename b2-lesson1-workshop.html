<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورشة الدرس الأول</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f4f5;font-family:Tahoma,Arial,sans-serif;color:#16324f}.boot{font-weight:800;padding:30px}.err{max-width:620px;margin:20px;padding:18px;border:1px solid #e4b9b9;background:#fff;color:#8a423d;border-radius:14px;line-height:1.8}</style></head><body><div id="boot" class="boot">جاري فتح ورشة الدرس الأول...</div><script>(async()=>{try{const n=3,urls=Array.from({length:n},(_,i)=>'./assets/b2-lesson1-workshop/page/chunk-'+String(i+1).padStart(2,'0')+'.txt?v=1');const html=(await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('تعذر تحميل ملفات الورشة');return r.text()})))).join('');document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').outerHTML='<div class="err"><b>تعذر فتح الورشة.</b><br>'+String(e.message||e)+'</div>'}})();</script></body></html>
