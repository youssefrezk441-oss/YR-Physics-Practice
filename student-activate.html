<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل حساب الطالب</title><link rel="stylesheet" href="student-account.css"></head><body><main class="accountPage"><a href="student.html">← العودة للدخول</a><h1>تفعيل الحساب</h1><form id="form" class="accountCard accountGrid"><div class="accountField full"><label>رمز التفعيل</label><textarea name="activation_token" required autocomplete="one-time-code"></textarea></div><div class="accountField"><label>كلمة المرور الجديدة</label><input name="password" type="password" required autocomplete="new-password"></div><div class="accountField"><label>تأكيد كلمة المرور</label><input name="confirm" type="password" required autocomplete="new-password"></div><p class="accountMuted full">10 أحرف على الأقل وتشمل حروفًا وأرقامًا. الرمز صالح مرة واحدة فقط.</p><div id="message" class="hidden full"></div><button class="accountBtn" type="submit">تفعيل الحساب</button></form></main><script type="module">import{identity,$,message}from'./student-identity-api.js';$('form').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{if(b.password!==b.confirm)throw Error('كلمتا المرور غير متطابقتين.');const d=await identity('activate',b);message(d.message,true);setTimeout(()=>location.href='student.html',1500)}catch(x){message(x.message)}};</script></body></html>
