function upgradeFractions(root=document){const nodes=[];if(root&&root.nodeType===1&&root.matches&&root.matches('.formula-inline,.formula-long'))nodes.push(root);if(root&&root.querySelectorAll)nodes.push(...root.querySelectorAll('.formula-inline,.formula-long'));for(const el of nodes){if(el.dataset.fractionsDone==='1'||!el.textContent.includes('/'))continue;const html=fractionMarkup(el.textContent);el.dataset.fractionsDone='1';if(html!==null)el.innerHTML=html}}

function emailForCode(c){return c.trim().toLowerCase().replace(/\s+/g,'')+'@students.yrphysicspractice.com'}function showMsg(t,type='err'){$('msg').innerHTML='<div class="msg '+type+'">'+esc(t)+'</div>'}function clearMsg(){$('msg').innerHTML=''}function showOnly(id){['loginView','dashboardView','practiceView','resultView','reviewView'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}

function startTimer(minutes){stopTimer();if(!minutes){$('timer').textContent='';return}deadline=Date.now()+Number(minutes)*60000;const tick=()=>{const ms=Math.max(0,deadline-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);$('timer').textContent='⏱ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(ms<=0){stopTimer();submitAttempt(true)}};tick();timerId=setInterval(tick,1000)}function stopTimer(){if(timerId)clearInterval(timerId);timerId=null;deadline=null}

else if(q.type==='numeric')html+='<div class="grid"><div class="c8"><label>الإجابة الرقمية</label><input id="numericValue" type="number" step="any" value="'+esc(a.numeric_value??'')+'"></div><div class="c4"><label>الوحدة</label><input id="unitText" value="'+esc(a.unit_text??'')+'" placeholder="إن وجدت"></div></div>';
else html+='<label>إجابتك</label><textarea id="textAnswer" placeholder="اكتب إجابتك هنا">'+esc(a.text_answer??'')+'</textarea>';
$('questionBox').innerHTML=html;document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{answers[q.id]={question_id:q.id,selected_choice_id:el.dataset.choice};renderQuestion()});const nv=$('numericValue');if(nv)nv.oninput=()=>{answers[q.id]={question_id:q.id,numeric_value:nv.value===''?null:Number(nv.value),unit_text:$('unitText').value}};const ut=$('unitText');if(ut)ut.oninput=()=>{answers[q.id]={question_id:q.id,numeric_value:$('numericValue').value===''?null:Number($('numericValue').value),unit_text:ut.value}};const ta=$('textAnswer');if(ta)ta.oninput=()=>{answers[q.id]={question_id:q.id,text_answer:ta.value}};$('prevBtn').disabled=qIndex===0;$('nextBtn').disabled=qIndex===questions.length-1}
$('prevBtn').onclick=()=>{if(qIndex>0){qIndex--;renderQuestion()}};$('nextBtn').onclick=()=>{if(qIndex<questions.length-1){qIndex++;renderQuestion()}};$('finishBtn').onclick=()=>submitAttempt(false);
async function submitAttempt(auto=false){if(!attemptId)return;const unanswered=questions.filter(q=>!answers[q.id]||(q.type==='mcq'&&!answers[q.id].selected_choice_id)||(q.type==='numeric'&&answers[q.id].numeric_value==null)||(q.type==='short_text'&&!String(answers[q.id].text_answer||'').trim())).length;if(!auto&&unanswered>0&&!confirm('لديك '+unanswered+' سؤال بدون إجابة. هل تريد التسليم؟'))return;try{$('finishBtn').disabled=true;stopTimer();const d=await fn({action:'submit_attempt',attempt_id:attemptId,answers:Object.values(answers)});renderResult(d);showOnly('resultView')}catch(e){showMsg(e.message);$('finishBtn').disabled=false}}
function renderResult(d){const pct=Number(d.attempt?.percentage??0);$('resultPercent').textContent=pct+'%';$('resultCaption').textContent=Number(d.attempt?.score??0)+' من '+Number(d.attempt?.max_score??0)+' درجة';const map=new Map((d.results||[]).map(r=>[String(r.question_id),r]));$('resultDetails').innerHTML=questions.map((q,i)=>{const r=map.get(String(q.id))||{};const cls=r.grading_status==='correct'?'good':r.grading_status==='review'?'review':'bad';const icon=r.grading_status==='correct'?'✅':r.grading_status==='review'?'🟡':'❌';let extra='';if(q.type==='mcq'&&r.correct_choice_id){const c=(q.choices||[]).find(x=>x.id===r.correct_choice_id);if(c)extra='<div class="small"><b>الإجابة الصحيحة:</b> '+esc(c.choice_text)+'</div>'}if(q.type==='numeric'&&r.correct_numeric_answer!=null)extra='<div class="small"><b>الإجابة الصحيحة:</b> '+esc(r.correct_numeric_answer)+' '+esc((r.accepted_units||[])[0]||'')+'</div>';return '<div class="answerCard '+cls+'"><b>'+icon+' السؤال '+(i+1)+'</b><div style="margin:7px 0">'+esc(q.stem)+'</div><div class="small">'+esc(r.feedback||'')+'</div>'+extra+(r.explanation?'<div class="small" style="margin-top:7px"><b>الشرح:</b> '+esc(r.explanation)+'</div>':'')+'</div>'}).join('')}
$('backDashboardBtn').onclick=async()=>{attemptId=null;currentSet=null;questions=[];answers={};$('finishBtn').disabled=false;await loadDashboard();showOnly('dashboardView')};
const{data:{session}}=await sb.auth.getSession();if(session){try{await initSession()}catch{await sb.auth.signOut();showOnly('loginView')}}else showOnly('loginView');
