function journeyPct(v){if(v===null||v===undefined||!Number.isFinite(Number(v)))return '—';const n=Math.round((Number(v)+1e-9)*10)/10;return (Number.isInteger(n)?String(n):n.toFixed(1))+'%'}

function journeyQuizStatus(q){if(q.status==='absent')return 'غائب — 0%';if(q.status==='scored')return Number(q.score)+' / '+Number(q.max_score)+' — '+journeyPct(q.percentage);return 'لم تُسجل النتيجة'}

  $('journeyHeroText').textContent=an.message||'';

  $('journeyQuizzes').textContent=journeyPct(q.ratio);
  $('journeyQuizzesDetail').textContent=Number(q.scored||0)+' مصحح · '+Number(q.absent||0)+' غياب'+(Number(q.pending||0)?' · '+Number(q.pending)+' منتظر':'');

}
