<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة الفيزياء — مستر يوسف رزق</title>
<style>body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;display:grid;place-items:center}.boot{padding:24px;text-align:center;font-weight:800}.err{max-width:650px;margin:20px;padding:18px;border-radius:14px;background:#fff1f3;color:#be123c;line-height:1.8}</style>
</head>
<body>
<div id="boot" class="boot">جاري فتح المنصة...</div>
<script>
(async()=>{
  let html=await (await fetch('./student-base.html?v=20260822-1',{cache:'no-store'})).text();
  const replaceOnce=(oldText,newText,label)=>{if(!html.includes(oldText))throw new Error('تعذر تجهيز '+label);html=html.replace(oldText,newText)};

  replaceOnce(
`<section id="trainingMenuView" class="hidden"><div class="studentSubHead"><div><h2>📝 التدريبات</h2><p class="sectionIntro">اختر الكورس الذي تريد التدريب عليه.</p></div><button class="btn secondary studentBack" data-go-home>العودة للرئيسية</button></div><div class="studentSubGrid"><button id="openChapterTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">⚡</div><h3>تدريبات الفصل الأول</h3><p>تدريبات كهربية الفصل الأول للصف الثالث الثانوي.</p></button><button id="openFoundationTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">🧰</div><h3>تدريبات الكورس التأسيسي</h3><p>كل تدريبات الكورس التأسيسي في مكان واحد.</p></button><button id="openCompleted" class="card studentNavCard" type="button"><div class="studentNavIcon">✅</div><h3>التدريبات المكتملة</h3><p>راجع محاولاتك السابقة ونتائجك وتصحيحها.</p></button></div></section>`,
`<section id="trainingMenuView" class="hidden"><div class="studentSubHead"><div><h2>📝 التدريبات</h2><p class="sectionIntro">اختر ما تريد عرضه.</p></div><button class="btn secondary studentBack" data-go-home>العودة للرئيسية</button></div><div class="studentSubGrid two"><button id="openAvailable" class="card studentNavCard" type="button"><div class="studentNavIcon">🚀</div><h3>التدريبات المتاحة</h3><p>ابدأ تدريبًا جديدًا من التدريبات المتاحة لك.</p></button><button id="openCompleted" class="card studentNavCard" type="button"><div class="studentNavIcon">✅</div><h3>التدريبات المكتملة</h3><p>راجع محاولاتك السابقة ونتائجك وتصحيحها.</p></button></div></section>
<section id="trainingCoursesView" class="hidden"><div class="studentSubHead"><div><h2>🚀 التدريبات المتاحة</h2><p class="sectionIntro">اختر الكورس الذي تريد التدريب عليه.</p></div><button id="backTrainingCourses" class="btn secondary studentBack">العودة للتدريبات</button></div><div class="studentSubGrid two"><button id="openFoundationTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">🧰</div><h3>تدريبات الكورس التأسيسي</h3><p>كل تدريبات الكورس التأسيسي في مكان واحد.</p></button><button id="openChapterTrainings" class="card studentNavCard" type="button"><div class="studentNavIcon">⚡</div><h3>تدريبات الفصل الأول</h3><p>تدريبات كهربية الفصل الأول للصف الثالث الثانوي.</p></button></div></section>`,
'قائمة التدريبات');

  replaceOnce(
"const STUDENT_VIEWS=['loginView','dashboardView','trainingMenuView','indicatorsMenuView','availableTrainingsView','completedTrainingsView','platformIndicatorsView','commitmentView','classTestsView','assessmentCycleView','honorView','comingSoonView','practiceView','resultView','reviewView'];",
"const STUDENT_VIEWS=['loginView','dashboardView','trainingMenuView','trainingCoursesView','indicatorsMenuView','availableTrainingsView','completedTrainingsView','platformIndicatorsView','commitmentView','classTestsView','assessmentCycleView','honorView','comingSoonView','practiceView','resultView','reviewView'];",
'الشاشات');

  replaceOnce(
"document.querySelectorAll('[data-go-home]').forEach(b=>b.onclick=()=>showOnly('dashboardView'));function openCourseTrainings",
"document.querySelectorAll('[data-go-home]').forEach(b=>b.onclick=()=>showOnly('dashboardView'));function updateTrainingCourseButtons(){const foundation=$('openFoundationTrainings'),chapter=$('openChapterTrainings');if(foundation)foundation.classList.toggle('hidden',!sets.some(s=>String(s.course_slug||'')==='foundation-physics'));if(chapter)chapter.classList.toggle('hidden',!sets.some(s=>String(s.course_slug||'')==='third-secondary-electricity-chapter-1'))}function openCourseTrainings",
'صلاحيات أيقونات الكورسات');

  replaceOnce(
"$('openChapterTrainings').onclick=()=>openCourseTrainings('third-secondary-electricity-chapter-1','تدريبات الفصل الأول','⚡');",
"$('openAvailable').onclick=()=>{selectedTrainingCourse=null;updateTrainingCourseButtons();showOnly('trainingCoursesView')};$('openChapterTrainings').onclick=()=>openCourseTrainings('third-secondary-electricity-chapter-1','تدريبات الفصل الأول','⚡');",
'زر التدريبات المتاحة');

  replaceOnce(
"$('openCompleted').onclick=()=>showOnly('completedTrainingsView');$('backTrainingMenu1').onclick=()=>{selectedTrainingCourse=null;showOnly('trainingMenuView')};$('backTrainingMenu2').onclick=()=>showOnly('trainingMenuView');",
"$('openCompleted').onclick=()=>showOnly('completedTrainingsView');$('backTrainingCourses').onclick=()=>{selectedTrainingCourse=null;showOnly('trainingMenuView')};$('backTrainingMenu1').onclick=()=>{selectedTrainingCourse=null;updateTrainingCourseButtons();showOnly('trainingCoursesView')};$('backTrainingMenu2').onclick=()=>showOnly('trainingMenuView');",
'أزرار الرجوع');

  document.open();
  document.write(html);
  document.close();
})().catch(e=>{document.getElementById('boot').outerHTML='<div class="err"><b>تعذر فتح المنصة.</b><br>'+String(e.message||e)+'</div>'});
</script>
</body>
</html>
